// 7. 카메라 / 입력
// ==========================================================================
const Camera = {
  x: 0, y: 0, zoom: 1, topPad: 0, botPad: 0,
  viewW() { return CONFIG.view.width / this.zoom; },
  viewH() { return CONFIG.view.height / this.zoom; },
  canPan() { return this.viewW() < CONFIG.world.width - 0.5 || this.viewH() < CONFIG.world.height - 0.5; },
  clamp() {
    const W = CONFIG.world.width, H = CONFIG.world.height, vw = this.viewW(), vh = this.viewH();
    const zoomed = this.zoom > 1.001;
    const tp = zoomed ? this.topPad / this.zoom : 0, bp = zoomed ? this.botPad / this.zoom : 0;   // 위·아래 HUD에 가리지 않도록 여유
    this.x = vw >= W ? (W - vw) / 2 : clamp(this.x, 0, W - vw);
    this.y = vh >= H + tp + bp ? (H - vh) / 2 : clamp(this.y, -tp, H - vh + bp);
  },
  setZoom(z) {
    const cx = this.x + this.viewW() / 2, cy = this.y + this.viewH() / 2;
    this.zoom = z; this.x = cx - this.viewW() / 2; this.y = cy - this.viewH() / 2; this.clamp();
  },
  centerOn(wx, wy) { this.x = wx - this.viewW() / 2; this.y = wy - this.viewH() / 2; this.clamp(); },
  toWorld(sx, sy) { return { x: sx / this.zoom + this.x, y: sy / this.zoom + this.y }; },
};

const Input = {
  pointers: new Map(),
  init(cv) {
    cv.addEventListener('pointerdown', e => this.down(e));
    cv.addEventListener('pointermove', e => this.move(e));
    cv.addEventListener('pointerup', e => this.up(e));
    cv.addEventListener('pointercancel', e => this.cancel(e));
    cv.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('gesturestart', e => e.preventDefault());
    window.addEventListener('keydown', e => this.key(e));
  },
  toVirtual(e) {
    const r = canvas.getBoundingClientRect();
    return { x: ((e.clientX - r.left) * CONFIG.view.width) / r.width, y: ((e.clientY - r.top) * CONFIG.view.height) / r.height };
  },
  threshold() { return (10 * CONFIG.view.width) / canvas.getBoundingClientRect().width; },   // 10 CSS px
  down(e) {
    e.preventDefault();
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (_) {} }
    const v = this.toVirtual(e), item = UI.hit(v.x, v.y);
    this.pointers.set(e.pointerId, { sx: v.x, sy: v.y, lx: v.x, ly: v.y, moved: false, item });
    if (item && item.id) UI.pressed = item.id;
  },
  hover: null,      // 마우스 위치(지도 좌표) — 조준 미리보기용
  move(e) {
    const v = this.toVirtual(e);
    this.hover = Camera.toWorld(v.x, v.y);
    const p = this.pointers.get(e.pointerId); if (!p) return;
    if (!p.moved && Math.hypot(v.x - p.sx, v.y - p.sy) > this.threshold()) {
      p.moved = true;
      if (p.item && UI.pressed === p.item.id) UI.pressed = null;
    }
    if (p.moved && !p.item && this.pointers.size === 1 && Camera.canPan()) {    // 드래그로 화면 이동
      Camera.x -= (v.x - p.lx) / Camera.zoom; Camera.y -= (v.y - p.ly) / Camera.zoom; Camera.clamp();
    }
    p.lx = v.x; p.ly = v.y;
  },
  up(e) {
    const p = this.pointers.get(e.pointerId); if (!p) return;
    this.pointers.delete(e.pointerId);
    const v = this.toVirtual(e);
    if (!p.moved) {
      if (p.item) { if (p.item.id) { const it = UI.hit(v.x, v.y); if (it && it.id === p.item.id && it.onTap) it.onTap(); } }
      else onWorldTap(Camera.toWorld(v.x, v.y));
    }
    UI.pressed = null;
  },
  cancel(e) { this.pointers.delete(e.pointerId); UI.pressed = null; },
  key(e) {   // 키보드는 보조 단축키
    if (e.repeat) return;
    switch (e.code) {
      case 'Space': case 'Enter': case 'NumpadEnter':
        e.preventDefault();
        if (G.state === 'title' || G.state === 'won' || G.state === 'lost') startGame();
        else if (e.code === 'Space') togglePause();
        break;
      case 'Escape': if (G.aim) G.aim = null; else togglePause(); break;
      case 'KeyP': togglePause(); break;
      case 'Digit2': case 'KeyF': toggleSpeed(); break;
      case 'KeyQ': useSkill(0); break;
      case 'KeyW': useSkill(1); break;
      case 'KeyE': useSkill(2); break;
      case 'KeyH': focusHero(); break;
    }
  },
};

function onWorldTap(w) {
  if (G.state !== 'playing' || G.paused) return;
  const h = G.hero;
  // 방향/지점 지정 스킬 조준 중이면 → 그 방향으로 스킬 사용
  if (G.aim) { const i = G.aim.skill; G.aim = null; if (h) h.cast(i, w.x, w.y); return; }
  // 테스트 옵션: 기지 탭 → 바로 피해
  if (CONFIG.debug.tapBaseDamage > 0) {
    for (const b of G.bases) {
      if (!b.enabled || !b.alive) continue;
      if (dist(w.x, w.y, b.x, b.y) <= b.m.hitRadius) {
        b.takeDamage(CONFIG.debug.tapBaseDamage);
        FX.text(w.x, w.y - 20, '-' + CONFIG.debug.tapBaseDamage, '#ffdd55', 24);
        FX.spark(w.x, w.y, '#ffd36b', 8);
        return;
      }
    }
  }
  if (!h || h.dead) { FX.ring(w.x, w.y, 18, '255,255,255', 0.3); return; }
  // 적 기지를 탭 → 영웅이 달려가서 기지 공격
  for (const b of G.bases) {
    if (b.enabled && b.alive && dist(w.x, w.y, b.x, b.y) <= b.m.hitRadius) { h.commandAttackBase(b); return; }
  }
  h.commandMove(w.x, w.y);   // 빈 곳 탭 → 이동
}

function useSkill(i) {
  const h = G.hero;
  if (!h || G.state !== 'playing' || G.paused) return;
  const sk = h.cfg.skills[i]; if (!sk) return;
  if (sk.target !== 'none') {                       // 버튼 → 지도에서 방향/위치 탭
    if (G.aim && G.aim.skill === i) { G.aim = null; return; }
    if (h.canCast(i)) G.aim = { skill: i };
    return;
  }
  G.aim = null;
  h.cast(i);
}
function focusHero() {
  const h = G.hero; if (!h) return;
  if (h.dead) Camera.centerOn(MAP.heroSpawn.x + 200, MAP.heroSpawn.y); else Camera.centerOn(h.x, h.y);
}

// 8. UI — HUD, 버튼, 오버레이 (즉시 모드: 매 프레임 그리면서 버튼 영역 등록)
// ==========================================================================
const UI = {
  k: 1,                // 작은 화면에서 버튼을 손가락 크기로 키우는 배율
  items: [], pressed: null,
  begin() { this.items.length = 0; },
  block(x, y, w, h) { this.items.push({ x, y, w, h, id: null }); },
  button(id, x, y, w, h, onTap) { this.items.push({ x, y, w, h, id, onTap }); return this.pressed === id; },
  hit(px, py) {
    for (let i = this.items.length - 1; i >= 0; i--) {
      const it = this.items[i];
      if (px >= it.x && px <= it.x + it.w && py >= it.y && py <= it.y + it.h) return it;
    }
    return null;
  },
};

function panel(ctx, x, y, w, h, k) {
  rr(ctx, x, y, w, h, 10 * k); ctx.fillStyle = 'rgba(30,22,14,0.86)'; ctx.fill();
  ctx.lineWidth = 2 * k; ctx.strokeStyle = '#b8914a'; ctx.stroke();
  rr(ctx, x + 3 * k, y + 3 * k, w - 6 * k, h - 6 * k, 8 * k); ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,230,170,0.12)'; ctx.stroke();
}
function drawButton(ctx, x, y, w, h, pressed, k, label, o = {}) {
  const off = pressed ? 3 * k : 0, rad = (o.radius || 12) * k;
  rr(ctx, x, y + 4 * k, w, h, rad); ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fill();
  rr(ctx, x, y + off, w, h, rad);
  const g = ctx.createLinearGradient(0, y + off, 0, y + off + h);
  g.addColorStop(0, o.c1 || '#d99a3a'); g.addColorStop(1, o.c2 || '#9a6020');
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 2.5 * k; ctx.strokeStyle = o.border || '#ffe2a6'; ctx.stroke();
  if (pressed) { ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fill(); }
  if (label) txt(ctx, label, x + w / 2, y + h / 2 + off + 1, o.size || 26 * k, '#fff8e6', 'center', { stroke: 'rgba(60,30,5,0.85)', weight: 800 });
  return off;
}

function drawHUD(ctx) {
  const k = UI.k, VW = CONFIG.view.width;
  const pad = 10 * k, top = 10 * k, ph = 58 * k;
  const g = G.gate;

  // --- 성문 에너지 ---
  let x = pad, w = 320 * k;
  panel(ctx, x, top, w, ph, k); UI.block(x, top, w, ph);
  Icon.castle(ctx, x + 27 * k, top + ph / 2 + 2 * k, 30 * k);
  txt(ctx, `성문 Lv.${g.level}`, x + 52 * k, top + 17 * k, 15 * k, '#f3e3bf');
  const sx = x + w - 12 * k, sy = top + 17 * k;

    ix += 82 * k;
  }

  // --- 오른쪽: 일시정지 / 배속 / 시간 ---

  const cx = rx + bs / 2, cy = top + bs / 2 + off - 6 * k;

  }

// ==========================================================================
// 9. 게임 상태 / 루프
// ==========================================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let G = null;
let MAPDATA = null;
let realTime = 0, viewScale = 1, pixelRatio = 1, bgCanvas = null, bgRes = 0;

function buildMapData() {
  const W = CONFIG.world.width, H = CONFIG.world.height, rng = mulberry32(MAP.seed + 99);
  const seg = {};
  for (const k in MAP.segments) seg[k] = catmullRom(MAP.segments[k], 5);
  const routes = {};
  for (const k in MAP.bases) {
    const pts = [];
    for (const name of MAP.bases[k].path) { const sp = seg[name]; for (let i = pts.length ? 1 : 0; i < sp.length; i++) pts.push(sp[i]); }
    routes[k] = new Route(pts);
  }
  const river = catmullRom(MAP.river, 8);

  // 다리: 본길과 강이 만나는 곳
  let best = Infinity, bi = 0, bj = 0;
  for (let i = 0; i < seg.main.length; i++) for (let j = 0; j < river.length; j++) {
    const d = (seg.main[i].x - river[j].x) ** 2 + (seg.main[i].y - river[j].y) ** 2;
    if (d < best) { best = d; bi = i; bj = j; }
  }
  const tan = (P, i) => { const a = P[Math.max(0, i - 1)], b = P[Math.min(P.length - 1, i + 1)]; return Math.atan2(b.y - a.y, b.x - a.x); };
  let bridge = null;
  if (best < 30 * 30) {
    const pa = tan(seg.main, bi), ra = tan(river, bj), s = Math.max(0.45, Math.abs(Math.sin(pa - ra)));
    bridge = { x: seg.main[bi].x, y: seg.main[bi].y, angle: pa, len: (MAP.riverWidth + 22) / s + 18, wid: MAP.pathWidth + 12 };
  }

  // 나무/장식 배치 (길·강·성·기지·건설 자리를 피해서)
  const pathPts = [];
  for (const k in seg) for (let i = 0; i < seg[k].length; i += 2) pathPts.push(seg[k][i]);
  const blocked = (x, y, r, pathGap = 8) => {
    if (x < 215 || y < -20 || y > H + 20 || x > W + 20) return true;
    const pr = MAP.pathWidth / 2 + r + pathGap;
    for (const p of pathPts) if ((p.x - x) ** 2 + (p.y - y) ** 2 < pr * pr) return true;
    const rv = MAP.riverWidth / 2 + r + 8;
    for (const p of river) if ((p.x - x) ** 2 + (p.y - y) ** 2 < rv * rv) return true;
    for (const k in MAP.bases) { const b = MAP.bases[k], br = b.hitRadius + 30 + r; if ((b.x - x) ** 2 + (b.y - y) ** 2 < br * br) return true; }
    for (const s of MAP.buildSpots) { const sr = 40 + r; if ((s.x - x) ** 2 + (s.y - y) ** 2 < sr * sr) return true; }
    return false;
  };
  const trees = [];
  const crowded = (x, y, r) => trees.some(t => (t.x - x) ** 2 + (t.y - y) ** 2 < (Math.max(t.r, r) * 0.95) ** 2);
  const addTree = (x, y, r) => trees.push({ x, y, r, pine: rng() < 0.3, hue: rng(), rot: rng() * TAU });
  for (const f of MAP.forests) {
    let placed = 0;
    for (let tries = 0; tries < f.n * 4 && placed < f.n; tries++) {
      const a = rng() * TAU, d = Math.sqrt(rng()) * f.r;
      const x = f.x + Math.cos(a) * d, y = f.y + Math.sin(a) * d * 0.85, r = 14 + rng() * 12;
      if (blocked(x, y, r) || crowded(x, y, r)) continue;
      addTree(x, y, r); placed++;
    }
  }
  for (let i = 0, tries = 0; i < MAP.scatterTrees && tries < 800; tries++) {
    const x = rng() * W, y = rng() * H, r = 13 + rng() * 9;
    if (blocked(x, y, r, 14) || crowded(x, y, r * 2.5)) continue;
    addTree(x, y, r); i++;
  }
  trees.sort((a, b) => a.y - b.y);
  const decor = [];
  for (let i = 0, tries = 0; i < 70 && tries < 900; tries++) {
    const x = rng() * W, y = rng() * H, r = 4 + rng() * 6;
    if (blocked(x, y, r, 2) || crowded(x, y, r + 10)) continue;
    decor.push({ k: rng() < 0.45 ? 'rock' : 'bush', x, y, r }); i++;
  }
  return { seg, routes, river, riverOff: [offsetPoly(river, -13), offsetPoly(river, 12)], bridge, trees, decor };
}

function createState() {
  return {
    state: 'title', paused: false, speedIdx: 0, time: 0, threat: 1, nextId: 1,
    gate: null, hero: null, aim: null, bases: [], enemies: [], projectiles: [], fx: [],
    pendingResult: null, endTimer: 0, banner: null, stats: { kills: 0 },
  };
}
function newGame(state) {
  G = createState();
  G.gate = new Gate();
  G.hero = new Hero('knight');      // 6단계에서 영웅 선택 화면 추가 예정
  G.bases = Object.keys(CONFIG.bases).map(k => new EnemyBase(k));
  G.state = state;
}
function startGame() {
  newGame('playing');
  if (Camera.zoom > 1) Camera.centerOn(MAP.startView.x, MAP.startView.y);
  showBanner('빈 곳을 탭해 기사를 움직이고, 동굴을 탭해 공격하세요!', '#ffe08a', 3.2);
}
function togglePause() { if (G.state === 'playing') G.paused = !G.paused; }
function toggleSpeed() { if (G.state === 'playing') G.speedIdx = (G.speedIdx + 1) % CONFIG.speeds.length; }

function update(dt) {
  G.time += dt;
  const th = 1 + Math.floor(G.time / CONFIG.escalation.interval);
  if (th !== G.threat) { G.threat = th; showBanner(`적이 강해집니다!  위협 Lv.${th}`, '#ff9a4a', 2.4); }
  G.gate.update(dt);
  G.hero.update(dt);
  for (const b of G.bases) b.update(dt);
  for (const e of G.enemies) if (e.alive) e.update(dt);
  for (const p of G.projectiles) p.update(dt);
  FX.update(dt);
  compact(G.enemies, e => e.alive);
  compact(G.projectiles, p => !p.done);
  if (G.banner && G.banner.t > 0) G.banner.t -= dt;
  if (G.pendingResult) { G.endTimer -= dt; if (G.endTimer <= 0) { G.state = G.pendingResult; G.paused = false; } }
}

function renderWorld(ctx) {
  const W = CONFIG.world.width, H = CONFIG.world.height;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(bgCanvas, 0, 0, W, H);
  Art.riverShimmer(ctx, realTime);
  Art.castleDynamic(ctx, G.gate, realTime);
  for (const b of G.bases) Art.base(ctx, b, G.time, realTime);

  const h = G.hero;
  if (h && !h.dead && h.mode === 'move') Art.rallyFlag(ctx, h.guard, realTime);
  if (h && G.aim && !h.dead) Art.aimPreview(ctx, h, G.aim, Input.hover, realTime);

  for (const e of G.enemies) if (e.air) Art.airShadow(ctx, e);
  const ground = [];
  for (const e of G.enemies) if (!e.air) ground.push(e);
  for (const c of G.gate.carpenters) ground.push(c);
  if (h) ground.push(h);
  ground.sort((a, b) => (a.dead ? a.deathY : a.y) - (b.dead ? b.deathY : b.y));
  for (const o of ground) {
    if (o instanceof Enemy) Art.enemy(ctx, o);
    else if (o instanceof Hero) Art.hero(ctx, o, realTime);
    else Art.carpenter(ctx, o);
  }
  for (const a of G.gate.archers) Art.wallArcher(ctx, a);
  for (const p of G.projectiles) Art.arrow(ctx, p);
  for (const e of G.enemies) if (e.air) Art.enemy(ctx, e);
  FX.draw(ctx);
  for (const b of G.bases) Art.baseBar(ctx, b);
  for (const e of G.enemies) Art.enemyBar(ctx, e);
  if (h) Art.heroBar(ctx, h);
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#1d2914'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
  ctx.save();
  ctx.scale(Camera.zoom, Camera.zoom); ctx.translate(-Camera.x, -Camera.y);
  renderWorld(ctx);
  ctx.restore();
  UI.begin();
  drawHUD(ctx);
  drawBanner(ctx);
  drawAimHint(ctx);
  drawOverlay(ctx);
}

function resize() {
  const VW = CONFIG.view.width, VH = CONFIG.view.height;
  const vw = window.innerWidth, vh = window.innerHeight;
  viewScale = Math.min(vw / VW, vh / VH);
  const cssW = Math.max(1, Math.floor(VW * viewScale)), cssH = Math.max(1, Math.floor(VH * viewScale));
  canvas.style.width = cssW + 'px'; canvas.style.height = cssH + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
  pixelRatio = canvas.width / VW;
  UI.k = clamp(0.78 / viewScale, 1, 1.8);           // 버튼이 최소 약 45 CSS px 이 되도록
  Camera.topPad = (10 + 58 + 6) * UI.k;
  Camera.botPad = (BOTTOM_HUD_H + 20) * UI.k;
  const zoom = viewScale < CONFIG.view.smallScreenScale ? CONFIG.view.smallScreenZoom : 1;
  if (zoom !== Camera.zoom) { Camera.setZoom(zoom); if (zoom > 1) Camera.centerOn(MAP.startView.x, MAP.startView.y); } else Camera.clamp();
  const res = clamp(Math.round(pixelRatio * Camera.zoom * 4) / 4, 1, 2);
  if (!bgCanvas || res !== bgRes) { bgRes = res; bgCanvas = Art.buildBackground(res); }
}

let lastNow = performance.now(), acc = 0;
function frame(now) {
  let dt = (now - lastNow) / 1000; lastNow = now;
  dt = clamp(dt, 0, 0.25);
  realTime += dt;
  if (G.state === 'playing' && !G.paused) {
    acc += dt * CONFIG.speeds[G.speedIdx];
    let n = 0;
    while (acc >= STEP && n < 30 && G.state === 'playing') { update(STEP); acc -= STEP; n++; }
    if (n >= 30) acc = 0;
  } else acc = 0;
  render();
  requestAnimationFrame(frame);
}

// ---------- 시작 ----------
MAPDATA = buildMapData();
loadImages();
newGame('title');
resize();
Input.init(canvas);
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'playing') G.paused = true; });  // 앱 전환 시 자동 일시정지
requestAnimationFrame(frame);

// 콘솔 디버그/밸런스 테스트용: GAME.simulate(60) → 60초 진행
window.GAME = {
  get G() { return G; }, CONFIG, MAP, Camera,
  start: startGame, useSkill, tap: (x, y) => onWorldTap({ x, y }),
  simulate(sec) { const n = Math.round(sec / STEP); for (let i = 0; i < n && G.state === 'playing'; i++) update(STEP); },
};
</script>
