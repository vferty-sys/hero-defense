// ---------- 성문 ----------
class Gate {
  constructor() {
    this.level = 1; this.maxHp = 0; this.hp = 0;
    this.lastHit = -999; this.flash = 0; this.destroyed = false;
    this.carpenters = []; this.archers = [];
    this.repairing = false; this.repairAccum = 0; this.repairTextTimer = 0; this.oilTimer = 0;
    this.slots = Gate.buildSlots();
    this.cracks = [];
    for (let i = 0; i < 7; i++) {
      let x = rand(0.15, 0.85), y = rand(0.08, 0.92), a = rand(0, TAU); const pts = [[x, y]];
      for (let j = 0; j < 4; j++) { a += rand(-0.9, 0.9); x = clamp(x + Math.cos(a) * 0.16, 0, 1); y = clamp(y + Math.sin(a) * 0.12, 0, 1); pts.push([x, y]); }
      this.cracks.push(pts);
    }
    this.applyLevel(true);
  }
  get cfg() { return CONFIG.gate.levels[this.level - 1]; }
  get underAttack() { return G.time - this.lastHit < 1.0; }
  get maxed() { return this.level >= CONFIG.gate.levels.length; }
  get upgradeCost() { return this.maxed ? 0 : CONFIG.gate.levels[this.level].cost; }
  upgrade() {
    if (this.maxed || this.destroyed) return false;
    this.level++; this.applyLevel(false);
    const fx = MAP.castle.wallX + MAP.castle.wallW / 2;
    FX.ring(fx, MAP.gate.y, 80, '255,215,90', 0.6); FX.spark(fx, MAP.gate.y, '#ffe08a', 12);
    FX.text(fx + 40, MAP.gate.y - 70, `성문 Lv.${this.level}!`, '#ffd36b', 22, 1.6);
    return true;
  }

  // 성문 앞 공격 자리 (반원 모양으로 여러 줄)
  static buildSlots() {
    const cx = MAP.castle.wallX + MAP.castle.wallW, cy = MAP.gate.y, slots = [];
    for (const r of [22, 46, 70, 94, 118, 142]) {
      const arc = Math.PI * 0.85, n = Math.max(1, Math.floor((r * arc) / 24));
      for (let i = 0; i < n; i++) {
        const a = -arc / 2 + arc * (n === 1 ? 0.5 : i / (n - 1));
        slots.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r, r, ground: null, air: null });
      }
    }
    return slots;
  }
  claimSlot(e) {
    const key = e.air ? 'air' : 'ground';
    let best = null, bc = Infinity;
    for (const s of this.slots) {
      if (s[key]) continue;
      const c = s.r * 2 + Math.hypot(s.x - e.x, s.y - e.y);
      if (c < bc) { bc = c; best = s; }
    }
    if (best) best[key] = e;
    return best;
  }

  applyLevel(fill) {
    const c = this.cfg, prevMax = this.maxHp;
    this.maxHp = c.maxHp;
    this.hp = fill ? c.maxHp : Math.min(c.maxHp, this.hp + (c.maxHp - prevMax));
    while (this.archers.length < c.archers) {
      const s = MAP.wallArcherSpots[this.archers.length];
      this.archers.push(new WallArcher(s[0], s[1]));
    }
  }

  takeDamage(amount) {
    if (this.destroyed) return;
    this.hp -= amount; this.lastHit = G.time; this.flash = 0.12;
    for (const k of this.carpenters) k.goHome();       // 공격받으면 목수는 성 안으로
    if (Math.random() < 0.35) FX.dust(MAP.castle.wallX + MAP.castle.wallW + 4, MAP.gate.y + rand(-30, 30));
    if (this.hp <= 0) {
      this.hp = 0; this.destroyed = true;
      FX.explosion(MAP.gate.x + 10, MAP.gate.y, 0.9); shake(10, 0.6);
      showBanner('성문이 무너졌습니다!', '#ff6a55', 3);
      if (!G.pendingResult) { G.pendingResult = 'lost'; G.endTimer = 1.8; }
    }
  }

  update(dt) {
    if (this.flash > 0) this.flash -= dt;
    const c = this.cfg;
    for (const a of this.archers) a.update(dt, c);

    // 3레벨: 성문에 붙은 적에게 끓는 기름 (광역 피해)
    if (c.oilDamage && !this.destroyed) {
      this.oilTimer -= dt;
      if (this.oilTimer <= 0) {
        const ox = MAP.castle.wallX + MAP.castle.wallW, oy = MAP.gate.y;
        if (G.enemies.some(e => e.alive && e.state === 'attack' && !e.air)) {
          this.oilTimer = c.oilInterval;
          for (const e of G.enemies) if (e.alive && !e.air && dist(e.x, e.y, ox, oy) <= c.oilRadius) e.takeDamage(c.oilDamage, 'tower', true);
          for (let i = 0; i < 16; i++) {
            const a = rand(-1.3, 1.3), r = rand(10, c.oilRadius * 0.8);
            FX.puff(ox + Math.cos(a) * r, oy + Math.sin(a) * r, '#6b3510', rand(8, 15), 0.9, 0, 0, 0.7, 0.4);
            FX.add({ k: 'flame', x: ox + Math.cos(a) * r, y: oy + Math.sin(a) * r, vx: 0, vy: -20, g: 0, life: rand(0.3, 0.6), max: 0.6, size: rand(6, 11) });
            if (i % 2) FX.puff(ox + Math.cos(a) * r, oy + Math.sin(a) * r, '#efe8dc', rand(8, 14), 1.4, rand(-6, 6), -30, 0.4, 1.4);
          }
          FX.text(ox + 50, oy - 70, '끓는 기름!', '#ffae5a', 20, 1.2);
        } else this.oilTimer = 0.3;
      }
    }

    // 자동 수리: repairDelay초 동안 공격이 없으면 목수 출동
    if (!this.destroyed) {
      const needRepair = this.hp < this.maxHp - 0.01;
      const idle = G.time - this.lastHit;
      if (needRepair && idle >= CONFIG.gate.repairDelay) {
        for (const k of this.carpenters) k.goOut();
        const used = new Set(this.carpenters.map(k => k.idx));
        for (let i = 0; i < c.carpenters; i++) if (!used.has(i)) this.carpenters.push(new Carpenter(i, c.carpenters));
      } else if (!needRepair) {
        for (const k of this.carpenters) k.goHome();
      }
    } else for (const k of this.carpenters) k.goHome();

    let working = 0;
    for (const k of this.carpenters) { k.update(dt); if (k.state === 'work') working++; }
    compact(this.carpenters, k => !k.done);
    this.repairing = working > 0;
    if (working > 0) {
      const before = this.hp;
      this.hp = Math.min(this.maxHp, this.hp + working * c.repairPerCarpenter * dt);
      this.repairAccum += this.hp - before;
      this.repairTextTimer -= dt;
      if (this.repairTextTimer <= 0) {
        this.repairTextTimer = 1;
        if (this.repairAccum >= 1) FX.text(MAP.castle.wallX + MAP.castle.wallW + 40, MAP.gate.y - 58, '+' + Math.round(this.repairAccum), '#7dff6a', 18);
        this.repairAccum = 0;
      }
    } else this.repairTextTimer = 0.3;
  }
}

// ---------- 목수 ----------
class Carpenter {
  constructor(idx, total) {
    const offs = total <= 2 ? [-20, 20] : [-30, 0, 30];
    const oy = offs[idx] != null ? offs[idx] : (idx - (total - 1) / 2) * 26;
    const c = MAP.castle;
    this.idx = idx;
    this.home = { x: c.wallX + c.wallW / 2, y: MAP.gate.y + oy * 0.4 };
    this.work = { x: c.wallX + c.wallW + 18 + (idx % 2) * 4, y: MAP.gate.y + oy };
    this.x = this.home.x; this.y = this.home.y;
    this.state = 'out'; this.face = 0; this.walk = 0; this.done = false;
    this.phase = Math.random() * 3; this.swings = Math.floor((this.phase * 9) / TAU);
  }
  goHome() { if (this.state !== 'in') this.state = 'in'; }
  goOut() { if (this.state === 'in') this.state = 'out'; }
  moveTo(t, dt) {
    const dx = t.x - this.x, dy = t.y - this.y, d = Math.hypot(dx, dy), s = CONFIG.gate.carpenterSpeed * dt;
    this.walk += dt;
    if (d <= s) { this.x = t.x; this.y = t.y; return true; }
    this.x += (dx / d) * s; this.y += (dy / d) * s; this.face = Math.atan2(dy, dx);
    return false;
  }
  update(dt) {
    if (this.state === 'out') { if (this.moveTo(this.work, dt)) { this.state = 'work'; this.face = Math.PI; } }
    else if (this.state === 'work') {
      this.face = Math.PI; this.phase += dt;
      const sw = Math.floor((this.phase * 9) / TAU);
      if (sw !== this.swings) { this.swings = sw; FX.spark(MAP.castle.wallX + MAP.castle.wallW + 1, this.y + rand(-4, 4), '#ffe6a0', 3); }
    } else if (this.state === 'in') { if (this.moveTo(this.home, dt)) this.done = true; }
  }
}

// ---------- 성벽 궁수 ----------
class WallArcher {
  constructor(x, y) { this.x = x; this.y = y; this.cd = rand(0.2, 1); this.aim = 0; this.shootAnim = 0; }
  findTarget(range) {
    let best = null, bs = -Infinity; const r2 = range * range;
    for (const e of G.enemies) {
      if (!e.alive) continue;
      const dx = e.x - this.x, dy = e.y - this.y, d2 = dx * dx + dy * dy;
      if (d2 > r2) continue;
      const score = (e.post ? -1 : e.state === 'walk' ? e.dist / e.route.length : 2) - Math.sqrt(d2) * 0.001;   // 성문에 붙은 적 우선
      if (score > bs) { bs = score; best = e; }
    }
    return best;
  }
  update(dt, gcfg) {
    if (this.shootAnim > 0) this.shootAnim -= dt;
    this.cd -= dt;
    const target = this.findTarget(gcfg.archerRange);
    if (target) this.aim = Math.atan2(target.y - (target.air ? AIR_HEIGHT : 0) - this.y, target.x - this.x);
    if (this.cd <= 0) {
      if (target) {
        this.cd = gcfg.archerInterval * rand(0.9, 1.1); this.shootAnim = 0.18;
        G.projectiles.push(new Arrow(this.x + Math.cos(this.aim) * 10, this.y + Math.sin(this.aim) * 10, target, gcfg.archerDamage));
      } else this.cd = 0;
    }
  }
}

// ---------- 화살 (목표를 따라가며 포물선) ----------
class Arrow {
  constructor(x, y, target, damage, speed, source) {
    this.x = x; this.y = y; this.target = target; this.damage = damage; this.source = source || 'tower';
    this.hostile = source instanceof Enemy;
    this.tx = target.x; this.ty = target.y - (target.air ? AIR_HEIGHT : 0);
    this.speed = speed || CONFIG.wallArcher.arrowSpeed; this.traveled = 0;
    this.total = Math.max(1, dist(x, y, this.tx, this.ty));
    this.z = 0; this.angle = Math.atan2(this.ty - y, this.tx - x); this.done = false;
  }
  update(dt) {
    if (this.target && this.target.alive) { this.tx = this.target.x; this.ty = this.target.y - (this.target.air ? AIR_HEIGHT : 0); }
    const px = this.x, py = this.y - this.z;
    const dx = this.tx - this.x, dy = this.ty - this.y, d = Math.hypot(dx, dy), step = this.speed * dt;
    if (d <= step + 2) {
      this.done = true;
      if (this.target && this.target.alive) { this.target.takeDamage(this.damage, this.source, false, this.crit); FX.spark(this.tx, this.ty, '#fff3b0', 4); }
      return;
    }
    this.x += (dx / d) * step; this.y += (dy / d) * step; this.traveled += step;
    const p = clamp(this.traveled / (this.traveled + d), 0, 1);
    this.z = Math.sin(p * Math.PI) * Math.min(40, this.total * 0.15);
    this.angle = Math.atan2(this.y - this.z - py, this.x - px);
  }
}

// ---------- 건물 공통 (레벨·투자금·업그레이드·판매) ----------
function buildingCfg(type) { return CONFIG.towers[type] || CONFIG.barracks[type]; }
class Building {
  constructor(type, spot) {
    this.type = type; this.cfg = buildingCfg(type); this.spot = spot;
    this.x = spot.x; this.y = spot.y; this.level = 1;
    this.invested = this.cfg.levels[0].cost; this.buildAnim = 0.45;
  }
  get stats() { return this.cfg.levels[this.level - 1]; }
  get maxed() { return this.level >= this.cfg.levels.length; }
  get upgradeCost() { return this.maxed ? 0 : this.cfg.levels[this.level].cost; }
  get sellValue() { return Math.floor(this.invested * CONFIG.economy.sellRefund); }
  upgrade() {
    if (this.maxed) return false;
    this.invested += this.upgradeCost; this.level++; this.buildAnim = 0.3;
    this.onUpgrade();
    return true;
  }
  onUpgrade() {}
  onRemove() {}
}

// ---------- 방어타워: 궁수탑 / 투석기 / 마법탑 ----------
class Tower extends Building {
  constructor(type, spot) {
    super(type, spot);
    this.cd = 0.4; this.aim = -Math.PI / 2; this.shootAnim = 0; this.shooter = 0; this.fireAnim = 0;
  }
  findTarget() {
    const s = this.stats, r2 = s.range * s.range; let best = null, bs = -Infinity;
    for (const e of G.enemies) {
      if (!e.alive || (e.air && !this.cfg.canHitAir)) continue;
      const dx = e.x - this.x, dy = e.y - this.y; if (dx * dx + dy * dy > r2) continue;
      const score = e.post ? -1 : e.state === 'walk' || e.state === 'rejoin' ? e.dist / e.route.length : 2;   // 성문에 가까운 적 우선, 수비병은 마지막
      if (score > bs) { bs = score; best = e; }
    }
    return best;
  }
  findBase() {
    for (const b of G.bases) if (b.enabled && b.alive && !b.protectedByBoss && dist(this.x, this.y, b.x, b.y) - b.m.hitRadius * 0.8 <= this.stats.range) return b;
    return null;
  }
  update(dt) {
    if (this.buildAnim > 0) this.buildAnim -= dt;
    if (this.shootAnim > 0) this.shootAnim -= dt;
    if (this.fireAnim > 0) this.fireAnim -= dt;
    this.cd -= dt;
    const t = this.findTarget();
    const b = !t && this.cfg.canHitBase ? this.findBase() : null;
    if (t) this.aim = Math.atan2(t.y - (t.air ? AIR_HEIGHT : 0) - this.y, t.x - this.x);
    else if (b) this.aim = Math.atan2(b.y - this.y, b.x - this.x);
    if (this.cd > 0) return;
    if (!t && !b) { this.cd = 0; return; }
    const s = this.stats;
    this.cd = s.interval;
    if (this.type === 'archer') {
      this.shooter = (this.shooter + 1) % this.level; this.shootAnim = 0.18;
      G.projectiles.push(new Arrow(this.x + Math.cos(this.aim) * 10, this.y - 6 + Math.sin(this.aim) * 10, t, s.damage, this.cfg.arrowSpeed));
    } else if (this.type === 'catapult') {
      this.fireAnim = 0.35;
      let tx, ty;
      if (t) {                                                        // 움직이는 적은 도착 지점을 예측해서 던짐
        const flight = dist(this.x, this.y, t.x, t.y) / this.cfg.projectileSpeed + 0.2;
        if (t.state === 'walk' && !t.stun) { const p = t.route.sample(Math.min(t.route.length, t.dist + t.spd * flight), TMP); tx = p.x - p.dy * t.lane; ty = p.y + p.dx * t.lane; }
        else { tx = t.x; ty = t.y; }
      } else { const a = Math.atan2(this.y - b.y, this.x - b.x), r = b.m.hitRadius * 0.45; tx = b.x + Math.cos(a) * r; ty = b.y + Math.sin(a) * r; }
      G.projectiles.push(new Boulder(this.x + Math.cos(this.aim) * 14, this.y + Math.sin(this.aim) * 14, tx, ty, s, this.cfg));
    } else if (this.type === 'mage') {
      this.fireAnim = 0.3;
      G.projectiles.push(new MagicBolt(this.x, this.y - 10, t, s, this.cfg));
    }
  }
}

// ---------- 병력생성소: 일정 시간마다 병사 1명씩 생산 (상한까지) ----------
class Barracks extends Building {
  constructor(type, spot) {
    super(type, spot);
    this.units = [];
    this.timer = this.stats.spawnTime * 0.35;      // 첫 병사는 조금 빨리
    this.capped = false;
  }
  get progress() { return clamp(1 - this.timer / this.stats.spawnTime, 0, 1); }
  onUpgrade() { for (const u of this.units) u.applyStats(this.level, this.stats); }
  onRemove() { for (const u of this.units) if (!u.dead) { u.dead = true; u.releaseAll(); FX.poof(u.x, u.y, 10); } }
  update(dt) {
    if (this.buildAnim > 0) this.buildAnim -= dt;
    compact(this.units, u => !u.dead);
    const s = this.stats;
    this.capped = false;
    if (this.units.length >= s.maxUnits) { this.timer = s.spawnTime; return; }              // 상한 도달 → 생산 중지
    if (G.soldiers.length >= CONFIG.soldiers.globalCap) { this.capped = true; return; }    // 전체 상한 → 대기
    this.timer -= dt;
    if (this.timer <= 0) {
      this.timer = s.spawnTime;
      const u = new Soldier(this);
      this.units.push(u); G.soldiers.push(u);
      FX.dust(u.x, u.y); FX.ring(u.x, u.y, 16, '255,240,180', 0.3);
    }
  }
}

// ---------- 병사 ----------
// 행동 우선순위: 1) 주변 적과 싸움  2) 영웅이 적 기지를 공격 중이면 함께 공격
//               3) 영웅 주위에 둥글게 대형 유지  4) 영웅 사망 중이면 성문 앞에 모임
class Soldier {
  constructor(barracks) {
    this.barracks = barracks; this.kind = barracks.cfg.unit; this.cfg = CONFIG.soldiers[this.kind];
    this.radius = this.cfg.radius; this.maxBlock = this.cfg.maxBlock;
    this.applyStats(barracks.level, barracks.stats, true);
    this.x = barracks.x + rand(-6, 6); this.y = barracks.y + 22; this.face = Math.PI / 2;
    this.engaged = new Set(); this.target = null; this.retarget = 0;
    this.atkTimer = rand(0, 0.5); this.attackAnim = 0; this.flash = 0;
    this.lastHit = -999; this.dead = false; this.moving = false; this.walkAnim = Math.random() * 3;
  }
  applyStats(level, s, fresh) {
    const ratio = fresh ? 1 : this.hp / this.maxHp;
    this.level = level; this.maxHp = s.hp; this.hp = this.maxHp * ratio; this.damage = s.damage; this.armor = s.armor;
  }
  get dash() { return null; }
  get alive() { return !this.dead; }
  takeDamage(amount) {
    if (this.dead) return;
    this.hp -= amount * (1 - this.armor); this.lastHit = G.time; this.flash = 0.1;
    if (this.hp <= 0) this.die();
  }
  releaseAll() { for (const e of [...this.engaged]) e.release(); this.engaged.clear(); }
  die() { this.dead = true; this.hp = 0; this.releaseAll(); FX.poof(this.x, this.y, 10); }

  // 대형 위치: 영웅 주위 동심원 (영웅이 죽었으면 성문 앞)
  formationPos(i) {
    const h = G.hero, alive = h && !h.dead;
    const cx = alive ? h.x : MAP.heroSpawn.x + 60, cy = alive ? h.y : MAP.heroSpawn.y;
    let idx = i;
    for (const [r, n, off] of [[46, 7, 0], [76, 12, 0.26], [106, 16, 0.1]]) {
      if (idx < n) { const a = (idx / n) * TAU + off; return Nav.clampTarget(cx + Math.cos(a) * r, cy + Math.sin(a) * r * 0.8); }
      idx -= n;
    }
    return Nav.clampTarget(cx + ((i * 37) % 120) - 60, cy + ((i * 53) % 100) - 50);
  }
  anchorCenter() { const h = G.hero; return h && !h.dead ? h : { x: MAP.heroSpawn.x + 60, y: MAP.heroSpawn.y }; }

  stepToward(tx, ty, dt) {
    const wp = Nav.route(this, { x: tx, y: ty })[0];
    const dx = wp.x - this.x, dy = wp.y - this.y, d = Math.hypot(dx, dy);
    if (d < 0.8) return;
    const k = Math.min(1, (this.cfg.speed * dt) / d), nx = this.x + dx * k, ny = this.y + dy * k;
    this.face = Math.atan2(dy, dx); this.moving = true; this.walkAnim += dt;
    if (!Nav.blocked(nx, ny)) { this.x = nx; this.y = ny; }
  }

  findEnemy() {
    const c = this.cfg, a = this.anchorCenter(); let best = null, bd = Infinity;
    for (const e of this.engaged) { if (!e.alive) continue; const d = dist(this.x, this.y, e.x, e.y); if (d < bd) { bd = d; best = e; } }
    if (best) return best;
    for (const e of G.enemies) {
      if (!e.alive || (e.air && !c.canHitAir && !e.cfg.lowFly)) continue;
      const d = dist(this.x, this.y, e.x, e.y);
      if (d > c.detect || dist(e.x, e.y, a.x, a.y) > CONFIG.soldiers.leash) continue;
      if (d < bd) { bd = d; best = e; }
    }
    return best;
  }

  hit(t, isBase) {
    this.face = Math.atan2(t.y - this.y, t.x - this.x);
    if (this.atkTimer > 0) return;
    this.atkTimer = this.cfg.attackInterval; this.attackAnim = 0.25;
    if (this.cfg.ranged) {
      if (isBase) { const d = Math.round(this.damage * this.cfg.baseDamageMul); t.takeDamage(d); FX.spark(t.x + rand(-30, 30), t.y + rand(-20, 20), '#fff3b0', 2); }
      else G.projectiles.push(new Arrow(this.x, this.y - 4, t, this.damage, 650, this));
    } else if (isBase) {
      const d = Math.round(this.damage * this.cfg.baseDamageMul); t.takeDamage(d);
      FX.spark(this.x + Math.cos(this.face) * 16, this.y + Math.sin(this.face) * 16, '#ffe08a', 2);
    } else { t.takeDamage(this.damage, this); FX.spark(t.x, t.y, '#ffffff', 2); FX.arc(t.x, t.y, this.face, 11, 1.2, '255,255,255', 0.12); }
  }

  update(dt, idx) {
    if (this.attackAnim > 0) this.attackAnim -= dt;
    if (this.flash > 0) this.flash -= dt;
    this.atkTimer -= dt; this.moving = false;
    const c = this.cfg, S = CONFIG.soldiers;
    if (G.time - this.lastHit >= S.regenDelay && this.hp < this.maxHp) this.hp = Math.min(this.maxHp, this.hp + this.maxHp * S.regenRate * dt);
    const a = this.anchorCenter();

    // 1) 적과 싸움
    if (this.target && (!this.target.alive || dist(this.target.x, this.target.y, a.x, a.y) > S.leash + 30)) this.target = null;
    this.retarget -= dt;
    if (!this.target || this.retarget <= 0) { this.retarget = 0.3; this.target = this.findEnemy(); }
    const e = this.target;
    if (e) {
      const d = dist(this.x, this.y, e.x, e.y);
      const reach = c.ranged ? c.range : this.radius + e.radius + c.range;
      if (d > reach) this.stepToward(e.x, e.y, dt); else this.hit(e, false);
      return;
    }
    // 2) 영웅이 적 기지를 공격 중이면 함께 공격
    const h = G.hero, b = h && !h.dead ? h.siegeTarget : null;
    if (b && b.alive) {
      const bodyR = b.m.hitRadius * 0.8;
      const ang = Math.atan2(this.y - b.y, this.x - b.x);
      const want = c.ranged ? bodyR + c.range * 0.7 : bodyR + this.radius + 4;
      const d = dist(this.x, this.y, b.x, b.y);
      if (d > want + (c.ranged ? 20 : 6)) {
        const spread = ((idx % 7) - 3) * 0.18;
        this.stepToward(b.x + Math.cos(ang + spread) * want, b.y + Math.sin(ang + spread) * want, dt);
      } else this.hit(b, true);
      return;
    }
    // 3, 4) 대형 유지 (영웅 주위 / 영웅 사망 시 성문 앞)
    const f = this.formationPos(idx);
    if (dist(this.x, this.y, f.x, f.y) > 4) this.stepToward(f.x, f.y, dt);
    else if (h && !h.dead) this.face = h.face;
  }
}

// ---------- 보스 등장 ----------
function spawnBoss(type, base) {
  const e = new Enemy(type, base, 0, G.threat);
  G.enemies.push(e);
  for (let i = 0; i < 4; i++) FX.dust(e.x + rand(-20, 20), e.y + rand(-10, 10));
  const fin = e.cfg.final;
  if (fin) {                                               // 최종보스: 요새 앞을 지키며 다가오는 영웅·병사와 싸움
    G.finalBoss = e;
    const a = Math.atan2(MAP.gate.y - base.y, MAP.gate.x - base.x), r = base.m.hitRadius * 0.8 + 130;
    e.post = Nav.clampTarget(base.x + Math.cos(a) * r, base.y + Math.sin(a) * r);
    e.guardCfg = { aggro: 340, leash: 560 }; e.state = 'guard';
  }
  showBanner(fin ? (CONFIG.bosses.final.protectBase ? `최종 보스 ${e.cfg.name} 출현! 드래곤을 쓰러뜨려야 ${base.cfg.name}를 부술 수 있어요` : `최종 보스 ${e.cfg.name} 출현!`) : `중간보스 등장: ${e.cfg.name} (${base.cfg.name})`, fin ? '#ff6a4a' : '#ffae5a', 4);
  G.banner.warn = true;
  if (fin) G.redFlash = 0.7;
  shake(fin ? 10 : 5, fin ? 0.8 : 0.4);
  return e;
}

// ---------- 아이템 ----------
const STAT_LABEL = { damage: '공격력', hp: '체력', armor: '방어력', cdr: '스킬 쿨타임', range: '사거리', speed: '이동 속도', attackSpeed: '공격 속도', crit: '치명타 확률', spellPower: '마법 피해', mana: '최대 마나', manaRegen: '마나 회복' };
const PCT_STATS = new Set(['armor', 'cdr', 'attackSpeed', 'crit', 'spellPower']);
function fmtStat(k, v) {
  if (PCT_STATS.has(k)) return `${STAT_LABEL[k]} ${k === 'cdr' ? '-' : '+'}${Math.round(v * 100)}%`;
  return `${STAT_LABEL[k]} +${Math.round(v * 10) / 10}${k === 'manaRegen' ? '/초' : ''}`;
}
function rarityOf(item) { return CONFIG.items.rarities.find(r => r.id === item.rarity); }
function makeItem(heroType, final) {
  const I = CONFIG.items, slots = ['weapon', 'armor', 'accessory'], slot = slots[Math.floor(Math.random() * 3)];
  const rs = I.rarities.map(r => ({ ...r, weight: r.id === 'legendary' && final ? I.finalBossLegendaryWeight : r.weight }));
  const r = weightedPick(rs), base = I.heroes[heroType][slot], stats = {};
  for (const k in base.stats) stats[k] = PCT_STATS.has(k) ? Math.round(base.stats[k] * r.mul * 100) / 100 : Math.round(base.stats[k] * r.mul);
  return { slot, rarity: r.id, name: `${r.prefix} ${base.name}`, baseName: base.name, stats,
           perk: r.id === 'legendary' ? base.perk : null, perkDesc: r.id === 'legendary' ? base.perkDesc : null,
           rank: I.rarities.indexOf(I.rarities.find(q => q.id === r.id)) };
}
function dropItem(x, y, final) {
  const p = Nav.clampTarget(x, y), it = makeItem(G.heroType, final);
  G.drops.push(new Drop(p.x, p.y, it));
  FX.ring(p.x, p.y, 40, '255,230,150', 0.6);
  FX.text(p.x, p.y - 50, `${rarityOf(it).name} 아이템!`, rarityOf(it).color, 18, 1.6);
}
// 바닥에 떨어진 아이템: 영웅이 위로 지나가면 획득
class Drop {
  constructor(x, y, item) { this.x = x; this.y = y; this.item = item; this.t = 0; this.done = false; }
  update(dt) {
    if (this.done) return;                                   // 이미 처리된 아이템은 다시 줍지 않음
    this.t += dt;
    const h = G.hero;
    if (h && !h.dead && !G.itemPrompt && dist(h.x, h.y, this.x, this.y) < h.radius + 18) pickupDrop(this);
  }
}
function pickupDrop(d) {
  const h = G.hero, it = d.item, cur = h.items[it.slot];
  if (!cur) {
    h.equip(it); d.done = true; G.stats.itemsFound++;
    FX.text(h.x, h.y - 50, `획득: ${it.name}`, rarityOf(it).color, 18, 1.8);
    return;
  }
  G.itemPrompt = { drop: d, item: it, cur };     // 같은 슬롯 → 교체할지 선택 (그동안 게임 일시정지)
}
function resolveItemPrompt(take) {
  const P = G.itemPrompt; if (!P) return;
  const h = G.hero, sold = take ? P.cur : P.item, gold = rarityOf(sold).sell;
  if (take) h.equip(P.item);
  addGold(gold); P.drop.done = true; G.itemPrompt = null; G.stats.itemsFound++;
  FX.text(h.x, h.y - 50, take ? `장착: ${P.item.name}  (+${gold} 골드)` : `+${gold} 골드`, take ? rarityOf(P.item).color : '#ffd84a', 17, 1.8);
}

// ---------- 영웅 스킬 효과 ----------
function nearestPathPoint(x, y) {
  let best = null, bd = Infinity;
  for (const k in MAPDATA.seg) for (const q of MAPDATA.seg[k]) { const d = (q.x - x) ** 2 + (q.y - y) ** 2; if (d < bd) { bd = d; best = q; } }
  return { x: best.x, y: best.y };
}

// 일정 시간 지속되는 범위 효과: 화살비(물리 지속 피해), 얼음 폭풍(마법 지속 피해 + 둔화)
class Zone {
  constructor(kind, x, y, r, dur, o) {
    this.kind = kind; this.x = x; this.y = y; this.r = r; this.dur = dur; this.o = o;
    this.t = 0; this.tick = 0; this.done = false; this.seed = Math.random() * 100;
  }
  update(dt) {
    this.t += dt; this.tick -= dt;
    if (this.tick <= 0) {
      this.tick = 0.25;
      for (const e of G.enemies) {
        if (!e.alive || dist(e.x, e.y, this.x, this.y) > this.r + e.radius * 0.5) continue;
        if (this.kind === 'arrowRain') e.takeDamage(this.o.dps * 0.25, this.o.src);
        else { e.takeDamage(this.o.dps * 0.25, this.o.src, true); e.applySlow(this.o.slow, 0.45); }
      }
    }
    if (this.kind === 'arrowRain' && Math.random() < 0.5) {
      const a = rand(0, TAU), r = Math.sqrt(Math.random()) * this.r;
      FX.puff(this.x + Math.cos(a) * r, this.y + Math.sin(a) * r * 0.8, '#b49a72', rand(3, 5), 0.35, 0, -6, 0.5);
    }
    if (this.t >= this.dur) this.done = true;
  }
}

// 궁사 덫: 처음 밟은 순간 근처 지상 적 모두 속박 + 지속 피해, 한 번 쓰면 사라짐
class Trap {
  constructor(x, y, sk, dps, src) {
    this.x = x; this.y = y; this.r = sk.radius; this.rootTime = sk.root; this.dps = dps; this.src = src;
    this.life = sk.life; this.done = false; this.anim = 0;
  }
  update(dt) {
    this.life -= dt; this.anim += dt;
    if (this.life <= 0) { this.done = true; return; }
    const hit = G.enemies.filter(e => e.alive && !e.air && !e.post && dist(e.x, e.y, this.x, this.y) <= this.r + e.radius * 0.6);
    if (!hit.length) return;
    for (const e of G.enemies) {
      if (!e.alive || e.air || dist(e.x, e.y, this.x, this.y) > this.r + 14) continue;
      e.root = Math.max(e.root, this.rootTime); e.dot = { dps: this.dps, t: this.rootTime, src: this.src };
    }
    this.done = true;
    FX.spark(this.x, this.y, '#d0d0d0', 8); FX.ring(this.x, this.y, this.r + 10, '230,230,230', 0.3);
    FX.text(this.x, this.y - 30, '속박!', '#e8e0c8', 16, 0.9);
  }
}

// 마법사 화염구: 지정 지점으로 날아가 폭발 (마법 피해, 적 기지에도 피해). explosions = 폭발 횟수
class Fireball {
  constructor(x, y, tx, ty, sk, damage, src) {
    this.sx = x; this.sy = y; this.tx = tx; this.ty = ty; this.x = x; this.y = y; this.z = 0;
    this.total = Math.max(1, dist(x, y, tx, ty)); this.dur = Math.max(0.2, this.total / sk.speed);
    this.t = 0; this.sk = sk; this.damage = damage; this.src = src; this.done = false;
    this.booms = sk.explosions || 1; this.wait = 0; this.landed = false;
  }
  update(dt) {
    if (this.landed) { this.wait -= dt; if (this.wait <= 0) this.boom(); return; }
    this.t += dt;
    const p = Math.min(1, this.t / this.dur);
    this.x = lerp(this.sx, this.tx, p); this.y = lerp(this.sy, this.ty, p);
    this.z = Math.sin(p * Math.PI) * Math.min(60, this.total * 0.2);
    if (Math.random() < 0.8) FX.add({ k: 'flame', x: this.x + rand(-3, 3), y: this.y - this.z + rand(-3, 3), vx: 0, vy: -10, g: 0, life: 0.3, max: 0.3, size: rand(4, 7) });
    if (p >= 1) { this.landed = true; this.boom(); }
  }
  boom() {
    const sk = this.sk;
    for (const e of G.enemies) if (e.alive && dist(e.x, e.y, this.tx, this.ty) <= sk.radius + e.radius * 0.5) e.takeDamage(this.damage, this.src, true);
    for (const b of G.bases) {
      if (!b.enabled || !b.alive) continue;
      if (dist(this.tx, this.ty, b.x, b.y) - b.m.hitRadius * 0.85 <= sk.radius) { b.takeDamage(sk.baseDamage); FX.text(this.tx, this.ty - 40, '-' + sk.baseDamage, '#ffb35a', 22, 1); }
    }
    FX.explosion(this.tx, this.ty, 0.55); FX.ring(this.tx, this.ty, sk.radius, '255,170,80', 0.4);
    this.booms--;
    if (this.booms > 0) this.wait = 0.4; else this.done = true;
  }
}

// ---------- 투석기 돌 (포물선, 착지 지점 광역 피해) ----------
class Boulder {
  constructor(x, y, tx, ty, s, cfg) {
    this.sx = x; this.sy = y; this.tx = tx; this.ty = ty; this.x = x; this.y = y; this.z = 0;
    this.total = Math.max(1, dist(x, y, tx, ty)); this.dur = Math.max(0.55, this.total / cfg.projectileSpeed);
    this.t = 0; this.s = s; this.done = false; this.spin = 0;
  }
  update(dt) {
    this.t += dt; this.spin += dt * 8;
    const p = Math.min(1, this.t / this.dur);
    this.x = lerp(this.sx, this.tx, p); this.y = lerp(this.sy, this.ty, p);
    this.z = Math.sin(p * Math.PI) * Math.min(130, this.total * 0.45);
    if (p >= 1) this.impact();
  }
  impact() {
    this.done = true;
    const s = this.s;
    for (const e of G.enemies) {
      if (!e.alive || e.air) continue;
      const d = dist(e.x, e.y, this.tx, this.ty);
      if (d <= s.splash + e.radius) e.takeDamage(s.damage * (d < s.splash * 0.4 ? 1 : 0.7), 'tower');
    }
    for (const b of G.bases) {
      if (!b.enabled || !b.alive) continue;
      if (dist(this.tx, this.ty, b.x, b.y) - b.m.hitRadius * 0.85 <= s.splash * 0.5) {
        b.takeDamage(s.baseDamage); FX.text(this.tx, this.ty - 30, '-' + s.baseDamage, '#ffd36b', 18, 0.8);
      }
    }
    FX.ring(this.tx, this.ty, s.splash, '200,170,120', 0.4);
    for (let i = 0; i < 7; i++) { const a = rand(0, TAU), v = rand(40, 120); FX.add({ k: 'debris', x: this.tx, y: this.ty, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 0, drag: 3, life: rand(0.4, 0.7), max: 0.7, size: rand(3, 6), color: '#6f6a61', rot: rand(0, TAU), spin: rand(-8, 8) }); }
    for (let i = 0; i < 5; i++) FX.puff(this.tx + rand(-s.splash * 0.5, s.splash * 0.5), this.ty + rand(-s.splash * 0.4, s.splash * 0.4), '#a48a64', rand(8, 14), 0.6, rand(-15, 15), rand(-20, 0), 0.55);
  }
}

// ---------- 마법탑 마법탄 (유도, 방어력 무시, 3레벨 둔화) ----------
class MagicBolt {
  constructor(x, y, target, s, cfg, source, color) {
    this.x = x; this.y = y; this.target = target; this.s = s; this.speed = cfg.boltSpeed;
    this.source = source || 'tower'; this.color = color || null;
    this.tx = target.x; this.ty = target.y - (target.air ? AIR_HEIGHT : 0); this.done = false; this.trail = [];
  }
  update(dt) {
    if (this.target && this.target.alive) { this.tx = this.target.x; this.ty = this.target.y - (this.target.air ? AIR_HEIGHT : 0); }
    this.trail.push({ x: this.x, y: this.y }); if (this.trail.length > 6) this.trail.shift();
    const dx = this.tx - this.x, dy = this.ty - this.y, d = Math.hypot(dx, dy), step = this.speed * dt;
    if (d <= step + 3) {
      this.done = true;
      if (this.target && this.target.alive) {
        this.target.takeDamage(this.s.damage, this.source, true);
        if (this.s.slow && this.target.applySlow) this.target.applySlow(this.s.slow, this.s.slowTime);
      }
      FX.spark(this.tx, this.ty, '#d6b8ff', 5); FX.ring(this.tx, this.ty, 16, '190,150,255', 0.25);
      return;
    }
    this.x += (dx / d) * step; this.y += (dy / d) * step;
  }
}

// ---------- 적 ----------
class Enemy {
  constructor(type, base, lane, threat) {
    const cfg = CONFIG.enemies[type], esc = CONFIG.escalation, lv = cfg.final ? 0 : threat - 1;   // 최종보스는 위협 레벨 영향 없음
    this.id = G.nextId++; this.type = type; this.cfg = cfg; this.base = base; this.route = base.route;
    const D = G.diff || CONFIG.difficulty.normal;                  // 난이도 배율
    this.maxHp = Math.round(cfg.hp * Math.pow(esc.hpMul, lv) * D.enemyHp); this.hp = this.maxHp;
    this.gateDamage = cfg.gateDamage * Math.pow(esc.damageMul, lv) * D.enemyDmg;
    this.speed = cfg.speed * rand(0.92, 1.08);
    this.armor = cfg.armor || 0; this.slowAmt = 0; this.slowTimer = 0;
    this.root = 0; this.dot = null;         // 덫: 속박(이동 불가) 시간 / 지속 피해 {dps, t, src}
    this.boss = !!cfg.boss;                                     // 보스 능력 타이머
    this.summonT = cfg.summon ? cfg.summon.interval * 0.5 : 0; this.healT = cfg.heal ? cfg.heal.interval : 0;
    this.breathT = cfg.breath ? 2.5 : 0; this.breathAnim = 0; this.breathTo = null; this.auraTick = 0;
    this.auraT = 0; this.auraMul = 1; this.auraSpd = 1;           // 오크 족장 오라를 받는 중
    this.radius = cfg.radius; this.air = cfg.air;
    this.damage = cfg.damage * Math.pow(esc.damageMul, lv) * D.enemyDmg;
    this.dmgPop = 0; this.dmgPopT = 0; this.dmgMagic = false;       // 데미지 숫자 모으기
    this.xp = cfg.xp * (1 + 0.1 * lv);
    this.lane = lane; this.dist = 0;
    // 상태: walk(길 따라 이동) / fight(영웅과 교전) / rejoin(길로 복귀) / toGate(성문 앞 자리로) / attack(성문 공격)
    this.state = 'walk';
    this.slot = null; this.fallback = null; this.foe = null; this.engageAngle = 0;
    this.stun = 0; this.taunt = 0; this.knock = null;
    this.ranged = !!cfg.ranged; this.shootTarget = null; this.prevState = 'walk';
    this.post = null; this.guardCfg = null; this.hunt = null;     // 수비병: 지키는 자리 / 설정 / 쫓는 대상
    this.atkTimer = rand(0.2, cfg.attackInterval);
    this.anim = Math.random() * 10; this.lunge = 0; this.flash = 0; this.alive = true;
    const s = this.route.sample(0, TMP);
    this.x = s.x - s.dy * lane; this.y = s.y + s.dx * lane; this.face = Math.atan2(s.dy, s.dx);
  }
  get reachedEnd() { return !!(this.slot || this.fallback); }
  get spd() { return this.root > 0 ? 0 : this.speed * (this.slowTimer > 0 ? 1 - this.slowAmt : 1) * (this.auraT > 0 ? this.auraSpd : 1); }     // 속박·둔화·오라 적용된 속도
  get dmgMul() { return this.auraT > 0 ? this.auraMul : 1; }
  applySlow(amount, time) { this.slowAmt = Math.max(this.slowTimer > 0 ? this.slowAmt : 0, amount); this.slowTimer = Math.max(this.slowTimer, time); }

  moveToward(tx, ty, dt) {
    const dx = tx - this.x, dy = ty - this.y, d = Math.hypot(dx, dy), step = this.spd * dt;
    if (d <= step) { this.x = tx; this.y = ty; return true; }
    this.x += (dx / d) * step; this.y += (dy / d) * step; this.face = Math.atan2(dy, dx);
    return false;
  }

  // 영웅·병사와 마주치면 멈춰서 싸움 (공중 유닛은 근접으로 막을 수 없음)
  canEngage(b) { return !this.air && b && !b.dead && !b.dash && (b.engaged.size < b.maxBlock || (this.taunt > 0 && b === G.hero)); }
  tryEngage() {
    if (this.air) return false;
    let best = null, bd = Infinity;
    const h = G.hero;
    if (this.canEngage(h)) { const d = dist(this.x, this.y, h.x, h.y); if (d <= this.radius + h.radius + 10) { best = h; bd = d; } }
    for (const u of G.soldiers) {
      if (!this.canEngage(u)) continue;
      const d = dist(this.x, this.y, u.x, u.y);
      if (d <= this.radius + u.radius + 8 && d < bd) { best = u; bd = d; }
    }
    if (best) { this.engage(best); return true; }
    return false;
  }
  engage(h) {
    if (this.foe === h) return;
    const n = h.engaged.size, off = n === 0 ? 0 : (n % 2 ? 1 : -1) * Math.ceil(n / 2) * 0.75;
    this.engageAngle = Math.atan2(this.y - h.y, this.x - h.x) + off;
    this.foe = h; h.engaged.add(this); this.state = 'fight';
  }
  release() {
    if (this.foe) this.foe.engaged.delete(this);
    this.foe = null;
    if (this.post) { this.state = 'guard'; this.hunt = null; return; }
    if (this.reachedEnd) this.state = 'toGate';
    else { this.dist = this.route.nearestDist(this.x, this.y, this.dist); this.state = 'rejoin'; }
  }
  taunted(h, dur) { if (this.air || this.boss) return; this.taunt = Math.max(this.taunt, dur); this.engage(h); }
  knockback(vx, vy, stun) {
    if (this.boss) return;                                     // 보스는 밀쳐내기 면역
    this.knock = { vx, vy, t: 0.22 };
    this.stun = Math.max(this.stun, stun);
  }

  flushDmg() {
    if (this.dmgPop >= 1) dmgText(this.x, this.y - (this.air ? AIR_HEIGHT * (this.cfg.final ? 1.6 : 1) : 0) - this.radius - 12, Math.round(this.dmgPop), this.dmgMagic ? '#9fd4ff' : '#ffffff', this.boss ? 19 : 16);
    this.dmgPop = 0; this.dmgPopT = 0.3;
  }
  update(dt) {
    this.anim += dt;
    if (this.flash > 0) this.flash -= dt;
    if (this.lunge > 0) this.lunge -= dt;
    if (this.taunt > 0) this.taunt -= dt;
    this.dmgPopT -= dt; if (this.dmgPop > 0 && this.dmgPopT <= 0) this.flushDmg();
    if (this.slowTimer > 0) this.slowTimer -= dt;
    if (this.root > 0) this.root -= dt;
    if (this.auraT > 0) this.auraT -= dt;
    if (this.boss) { this.stun = Math.min(this.stun, 0.6); this.root = Math.min(this.root, 0.8); this.bossUpdate(dt); if (!this.alive) return; }
    if (this.dot) {
      const d = this.dot; d.t -= dt; this.takeDamage(d.dps * dt, d.src);
      if (d.t <= 0) this.dot = null;
      if (!this.alive) return;
    }
    if (this.knock) {                                   // 밀려나는 중
      const k = this.knock;
      this.x = clamp(this.x + k.vx * dt, MAP.castle.wallX + MAP.castle.wallW + 8, CONFIG.world.width - 8);
      this.y = clamp(this.y + k.vy * dt, 8, CONFIG.world.height - 8);
      k.t -= dt;
      if (k.t <= 0) { this.knock = null; if (this.state === 'walk') { this.dist = this.route.nearestDist(this.x, this.y, this.dist); this.state = 'rejoin'; } }
      return;
    }
    if (this.stun > 0) { this.stun -= dt; return; }     // 기절
    if (this.cfg.regen && this.hp < this.maxHp) this.hp = Math.min(this.maxHp, this.hp + this.cfg.regen * dt);   // 트롤 재생

    switch (this.state) {
      case 'guard': this.updateGuard(dt); break;
      case 'shoot': this.updateShoot(dt); break;
      case 'siege': {                                   // 원거리 적: 성문 앞에서 활로 성문 공격
        if (this.tryEngage() || this.tryShoot()) break;
        this.face = Math.atan2(MAP.gate.y - this.y, MAP.castle.wallX + MAP.castle.wallW - this.x);
        if (G.gate.destroyed) break;
        this.atkTimer -= dt;
        if (this.atkTimer <= 0) { this.atkTimer += this.cfg.attackInterval; this.lunge = 0.15; G.projectiles.push(new Arrow(this.x, this.y - 4, gateTarget(), this.gateDamage * this.dmgMul, 520, this)); }
        break;
      }
      case 'walk': {
        if (this.tryEngage()) break;
        if (this.ranged) {
          if (this.tryShoot()) break;
          if (this.dist >= this.route.length - 130) { this.state = 'siege'; break; }
        }
        this.dist += this.spd * dt;
        if (this.dist >= this.route.length) {
          this.dist = this.route.length; this.state = 'toGate';
          this.slot = G.gate.claimSlot(this);
          if (!this.slot) { const a = rand(-1.25, 1.25), r = rand(150, 180); this.fallback = { x: MAP.castle.wallX + MAP.castle.wallW + Math.cos(a) * r, y: MAP.gate.y + Math.sin(a) * r }; }
        }
        const s = this.route.sample(this.dist, TMP);
        this.x = s.x - s.dy * this.lane; this.y = s.y + s.dx * this.lane; this.face = Math.atan2(s.dy, s.dx);
        break;
      }
      case 'rejoin': {
        if (this.tryEngage() || (this.ranged && this.tryShoot())) break;
        const s = this.route.sample(this.dist, TMP);
        if (this.moveToward(s.x - s.dy * this.lane, s.y + s.dx * this.lane, dt)) this.state = 'walk';
        break;
      }
      case 'fight': this.updateFight(dt); break;
      case 'toGate': {
        if (this.tryEngage()) break;
        const t = this.slot || this.fallback;
        if (this.moveToward(t.x, t.y, dt)) this.state = 'attack';
        break;
      }
      case 'attack': {
        if (this.tryEngage()) break;
        this.face = Math.atan2(MAP.gate.y - this.y, MAP.castle.wallX + MAP.castle.wallW - this.x);
        if (G.gate.destroyed) break;
        this.atkTimer -= dt;
        if (this.atkTimer <= 0) { this.atkTimer += this.cfg.attackInterval; this.lunge = 0.15; G.gate.takeDamage(this.gateDamage * this.dmgMul); }
        break;
      }
    }
  }

  // ---------- 보스 능력 ----------
  bossUpdate(dt) {
    const c = this.cfg;
    if (c.summon) {                                            // 거미 여왕: 새끼 거미 소환
      this.summonT -= dt;
      if (this.summonT <= 0) {
        this.summonT = c.summon.interval;
        for (let i = 0; i < c.summon.count; i++) {
          const b = new Enemy(c.summon.type, this.base, rand(-14, 14), G.threat);
          b.maxHp = b.hp = Math.round(b.maxHp * 0.6); b.x = this.x + rand(-18, 18); b.y = this.y + rand(-18, 18);
          b.dist = this.reachedEnd ? this.route.length : this.dist; b.state = 'rejoin';
          G.enemies.push(b); FX.dust(b.x, b.y);
        }
      }
    }
    if (c.heal) {                                              // 고블린 주술사: 주변 적 치유
      this.healT -= dt;
      if (this.healT <= 0) {
        this.healT = c.heal.interval;
        let n = 0;
        for (const e of G.enemies) if (e.alive && e.hp < e.maxHp && dist(e.x, e.y, this.x, this.y) <= c.heal.radius) { e.hp = Math.min(e.maxHp, e.hp + c.heal.amount); n++; FX.spark(e.x, e.y - 6, '#7dff6a', 2); }
        if (n) FX.ring(this.x, this.y, c.heal.radius, '120,255,120', 0.5);
      }
    }
    if (c.aura) {                                              // 오크 족장: 주변 적 공격력·속도 강화
      this.auraTick -= dt;
      if (this.auraTick <= 0) {
        this.auraTick = 0.25;
        for (const e of G.enemies) if (e.alive && !e.post && dist(e.x, e.y, this.x, this.y) <= c.aura.radius) { e.auraT = 0.5; e.auraMul = c.aura.damageMul; e.auraSpd = c.aura.speedMul; }
      }
    }
    if (c.breath) {                                            // 드래곤: 화염 범위 공격
      if (this.breathAnim > 0) this.breathAnim -= dt;
      this.breathT -= dt;
      if (this.breathT <= 0) {
        const b = c.breath; let t = null, bd = b.range;
        const h = G.hero;
        if (h && !h.dead) { const d = dist(this.x, this.y, h.x, h.y); if (d < bd) { bd = d; t = h; } }
        for (const u of G.soldiers) { if (u.dead) continue; const d = dist(this.x, this.y, u.x, u.y); if (d < bd) { bd = d; t = u; } }
        const gx = MAP.castle.wallX + MAP.castle.wallW + 20, gy = MAP.gate.y;
        if (t) this.breathAt(t.x, t.y);
        else if (dist(this.x, this.y, gx, gy) < b.range) this.breathAt(gx, gy);
        this.breathT = t || dist(this.x, this.y, gx, gy) < b.range ? b.interval : 0.5;
      }
    }
  }
  breathAt(tx, ty) {
    const b = this.cfg.breath, dmg = b.damage * this.dmgMul;
    const h = G.hero;
    if (h && !h.dead && dist(h.x, h.y, tx, ty) <= b.radius) h.takeDamage(dmg);
    for (const u of G.soldiers) if (!u.dead && dist(u.x, u.y, tx, ty) <= b.radius) u.takeDamage(dmg);
    if (dist(tx, ty, MAP.castle.wallX + MAP.castle.wallW, MAP.gate.y) <= b.radius + 20) G.gate.takeDamage(dmg);
    this.breathAnim = 0.7; this.breathTo = { x: tx, y: ty }; this.face = Math.atan2(ty - this.y, tx - this.x);
    const sx = this.x + Math.cos(this.face) * 30, sy = this.y - AIR_HEIGHT * 1.6 + Math.sin(this.face) * 30;
    for (let i = 0; i < 26; i++) {
      const p = Math.random(), x = lerp(sx, tx, p) + rand(-10, 10) * p, y = lerp(sy, ty, p) + rand(-10, 10) * p;
      FX.add({ k: 'flame', x, y, vx: rand(-20, 20), vy: rand(-30, 0), g: 0, life: rand(0.3, 0.7), max: 0.7, size: rand(6, 12) * (0.5 + p) });
    }
    FX.ring(tx, ty, b.radius, '255,120,40', 0.5);
    for (let i = 0; i < 6; i++) FX.puff(tx + rand(-b.radius * 0.6, b.radius * 0.6), ty + rand(-b.radius * 0.5, b.radius * 0.5), '#3a2a20', rand(8, 14), 1.2, 0, -15, 0.45, 1.3);
  }

  // 원거리 적: 사거리 안의 영웅·병사를 발견하면 멈춰서 활을 쏨
  tryShoot() {
    let best = null, bd = this.cfg.range;
    const h = G.hero;
    if (h && !h.dead) { const d = dist(this.x, this.y, h.x, h.y); if (d < bd) { bd = d; best = h; } }
    for (const u of G.soldiers) { if (u.dead) continue; const d = dist(this.x, this.y, u.x, u.y); if (d < bd) { bd = d; best = u; } }
    if (!best) return false;
    this.shootTarget = best; if (this.state !== 'shoot') this.prevState = this.state; this.state = 'shoot';
    return true;
  }
  updateShoot(dt) {
    if (this.tryEngage()) return;
    const t = this.shootTarget;
    if (!t || t.dead || dist(this.x, this.y, t.x, t.y) > this.cfg.range + 20) { this.shootTarget = null; this.state = this.prevState === 'siege' ? 'siege' : 'walk'; return; }
    this.face = Math.atan2(t.y - this.y, t.x - this.x);
    this.atkTimer -= dt;
    if (this.atkTimer <= 0) { this.atkTimer += this.cfg.attackInterval; this.lunge = 0.15; G.projectiles.push(new Arrow(this.x, this.y - 4, t, this.damage * this.dmgMul, 520, this)); }
  }

  // 수비병: 기지 근처에 들어온 영웅·병사를 쫓아가 싸우고, 멀어지면 자리로 복귀
  updateGuard(dt) {
    const g = this.guardCfg, post = this.post;
    if (this.hunt && (this.hunt.dead || dist(this.hunt.x, this.hunt.y, post.x, post.y) > g.leash)) this.hunt = null;
    if (!this.hunt) {
      let best = null, bd = g.aggro;
      const h = G.hero;
      if (h && !h.dead) { const d = dist(h.x, h.y, post.x, post.y); if (d < bd) { bd = d; best = h; } }
      for (const u of G.soldiers) { if (u.dead) continue; const d = dist(u.x, u.y, post.x, post.y); if (d < bd) { bd = d; best = u; } }
      this.hunt = best;
    }
    const t = this.hunt;
    if (t && this.air) {                                       // 날아다니는 수호자(드래곤): 붙잡히지 않고 근처에서 발톱 공격 (화염은 bossUpdate)
      const d = dist(this.x, this.y, t.x, t.y);
      if (d > 70) this.moveToward(t.x, t.y, dt);
      this.face = Math.atan2(t.y - this.y, t.x - this.x);
      if (d <= 80 + t.radius) { this.atkTimer -= dt; if (this.atkTimer <= 0) { this.atkTimer += this.cfg.attackInterval; this.lunge = 0.15; t.takeDamage(this.damage * this.dmgMul, this); } }
      return;
    }
    if (t) {
      if (dist(this.x, this.y, t.x, t.y) <= this.radius + t.radius + 7) { this.engage(t); return; }
      this.moveToward(t.x, t.y, dt); return;
    }
    if (this.air) { const a = this.anim * 0.5; this.moveToward(post.x + Math.cos(a) * 50, post.y + Math.sin(a) * 30, dt); return; }   // 요새 앞 선회
    if (dist(this.x, this.y, post.x, post.y) > 3) this.moveToward(post.x, post.y, dt);
  }

  updateFight(dt) {
    const h = this.foe;
    if (!h || h.dead) { this.release(); return; }
    if (this.post && dist(this.x, this.y, this.post.x, this.post.y) > this.guardCfg.leash) { this.release(); return; }
    const contact = this.radius + h.radius + 3, d = dist(this.x, this.y, h.x, h.y);
    if (this.taunt <= 0 && d > contact + 60) { this.release(); return; }   // 영웅이 멀어지면 다시 성문으로
    const fx = h.x + Math.cos(this.engageAngle) * contact, fy = h.y + Math.sin(this.engageAngle) * contact;
    if (dist(this.x, this.y, fx, fy) > 2) this.moveToward(fx, fy, dt);
    if (d <= contact + 6) {
      this.face = Math.atan2(h.y - this.y, h.x - this.x);
      this.atkTimer -= dt;
      if (this.atkTimer <= 0) { this.atkTimer += this.cfg.attackInterval; this.lunge = 0.15; h.takeDamage(this.damage * this.dmgMul, this); }
    }
  }

  // magic = true 이면 방어력 무시 (마법탑, 끓는 기름)
  takeDamage(amount, src, magic, crit) {
    if (!this.alive) return;
    const d = magic ? amount : amount * (1 - this.armor);
    this.hp -= d; this.flash = 0.12;
    if (SETTINGS.damageNumbers) {                                  // 데미지 숫자: 치명타는 바로 크게, 나머지는 0.3초씩 모아서
      if (crit) dmgText(this.x, this.y - (this.air ? AIR_HEIGHT : 0) - this.radius - 14, Math.round(d), '#ffdd44', 20);
      else { this.dmgPop += d; this.dmgMagic = !!magic; }
    }
    if (this.hp <= 0) this.die(src || true);
  }
  die(killer) {
    this.alive = false;
    if (this.dmgPop > 0) this.flushDmg();
    if (this.slot) { this.slot[this.air ? 'air' : 'ground'] = null; this.slot = null; }
    if (this.foe) { this.foe.engaged.delete(this); this.foe = null; }
    FX.poof(this.x, this.y - (this.air ? AIR_HEIGHT : 0), this.radius);
    if (this.boss) {
      if (killer) G.stats.bossKills++;
      showBanner(`${this.cfg.name} 처치!`, '#ffd36b', 2.6); shake(this.cfg.final ? 9 : 5, 0.5);
      FX.explosion(this.x, this.y - (this.air ? AIR_HEIGHT : 0), this.cfg.final ? 1.2 : 0.7);
      if (Math.random() < CONFIG.items.dropChance[this.cfg.final ? 'finalBoss' : 'midBoss']) dropItem(this.x, this.y, this.cfg.final);
    }
    if (killer) {
      G.stats.kills++;
      addGold(this.cfg.gold || 0);
      const h = G.hero;
      if (h && !h.dead) h.gainXp(killer === h ? this.xp : this.xp * CONFIG.heroLevels.sharedXp);
    }
  }
}

// 원거리 적이 성문을 쏠 때 쓰는 목표 (화살이 따라갈 위치 + 맞으면 성문 피해)
function gateTarget() {
  return { x: MAP.castle.wallX + MAP.castle.wallW - 4, y: MAP.gate.y + rand(-30, 30), alive: true, radius: 10, takeDamage: d => G.gate.takeDamage(d) };
}

// ---------- 이동 도우미: 강은 다리로만 건널 수 있음, 성 안으로는 못 들어감 ----------
const Nav = {
  riverXAt(y) {
    const R = MAPDATA.river;
    if (y <= R[0].y) return R[0].x;
    for (let i = 1; i < R.length; i++) if (R[i].y >= y) { const a = R[i - 1], b = R[i], t = (y - a.y) / ((b.y - a.y) || 1); return a.x + (b.x - a.x) * t; }
    return R[R.length - 1].x;
  },
  onBridge(x, y) {
    const b = MAPDATA.bridge; if (!b) return false;
    const dx = x - b.x, dy = y - b.y, c = Math.cos(-b.angle), s = Math.sin(-b.angle);
    return Math.abs(dx * c - dy * s) <= b.len / 2 + 4 && Math.abs(dx * s + dy * c) <= b.wid / 2 + 2;
  },
  // 다리 + 양쪽 입구 구역 (이 안에서는 항상 건너편으로 진행 → 입구에서 앞뒤로 흔들리지 않음)
  inBridgeZone(x, y) {
    const b = MAPDATA.bridge; if (!b) return false;
    const dx = x - b.x, dy = y - b.y, c = Math.cos(-b.angle), s = Math.sin(-b.angle);
    return Math.abs(dx * c - dy * s) <= b.len / 2 + 16 && Math.abs(dx * s + dy * c) <= b.wid / 2 + 10;
  },
  inWater(x, y) { return !this.onBridge(x, y) && Math.abs(x - this.riverXAt(y)) < MAP.riverWidth / 2 + 4; },
  side(x, y) { return x < this.riverXAt(y) ? -1 : 1; },
  blocked(x, y) {
    return x < MAP.castle.wallX + MAP.castle.wallW + 12 || x > CONFIG.world.width - 10 || y < 10 || y > CONFIG.world.height - 10 || this.inWater(x, y);
  },
  // 이동 목표를 갈 수 있는 곳으로 보정
  clampTarget(x, y) {
    x = clamp(x, MAP.castle.wallX + MAP.castle.wallW + 16, CONFIG.world.width - 14);
    y = clamp(y, 14, CONFIG.world.height - 14);
    if (this.inWater(x, y)) { const rx = this.riverXAt(y), s = x < rx ? -1 : 1; x = rx + s * (MAP.riverWidth / 2 + 16); }
    return { x, y };
  },
  bridgeEnds() {
    const b = MAPDATA.bridge, c = Math.cos(b.angle), s = Math.sin(b.angle), L = b.len / 2 + 14;
    return [{ x: b.x - c * L, y: b.y - s * L }, { x: b.x + c * L, y: b.y + s * L }];
  },
  // from → to 경로 (강 건너편이면 다리를 거쳐 감)
  route(from, to) {
    if (!MAPDATA.bridge) return [to];
    const s2 = this.side(to.x, to.y);
    const [A, B] = this.bridgeEnds();
    const near = this.side(A.x, A.y) === s2 ? B : A, far = near === A ? B : A;
    if (this.inBridgeZone(from.x, from.y)) return dist(from.x, from.y, far.x, far.y) < 3 ? [to] : [far, to];   // 다리 구역 안이면 건너편으로
    if (this.side(from.x, from.y) === s2) return [to];
    return [near, far, to];
  },
};

// ---------- 영웅 ----------
class Hero {
  constructor(type) {
    this.type = type; this.cfg = CONFIG.heroes[type];
    this.level = 1; this.xp = 0; this.radius = this.cfg.radius;
    this.items = { weapon: null, armor: null, accessory: null };   // 장착 아이템
    this.recalc(); this.hp = this.maxHp;
    this.x = MAP.heroSpawn.x; this.y = MAP.heroSpawn.y; this.face = 0;
    this.guard = { x: this.x, y: this.y }; this.path = []; this.mode = 'guard';
    this.target = null; this.baseTarget = null;
    this.atkTimer = 0; this.attackAnim = 0; this.flash = 0;
    this.lastHit = -999; this.dead = false; this.respawnTimer = 0; this.deathX = 0; this.deathY = 0;
    this.engaged = new Set();
    this.cooldowns = this.cfg.skills.map(() => 0);
    this.buffs = { warcry: 0, warcryRed: 0 };
    this.dash = null; this.burst = null; this.moving = false; this.walkAnim = 0; this.retarget = 0;
    this.mana = this.maxMana;
  }
  // 능력치 = 기본 + 레벨 성장 + 장착 아이템
  recalc() {
    const c = this.cfg, l = this.level - 1, B = this.bonus();
    this.maxHp = Math.round(c.hp + c.perLevel.hp * l + (B.hp || 0));
    this.damage = c.attack.damage + c.perLevel.damage * l + (B.damage || 0);
    this.armor = Math.min(0.75, c.armor + c.perLevel.armor * l + (B.armor || 0));
    this.maxMana = c.mana ? Math.round(c.mana + (c.perLevel.mana || 0) * l + (B.mana || 0)) : 0;
    this.range = c.attack.range + (B.range || 0);
    this.atkInterval = c.attack.interval * (1 - Math.min(0.5, B.attackSpeed || 0));
    this.speed = c.speed + (B.speed || 0);
    this.crit = B.crit || 0; this.cdr = Math.min(0.5, B.cdr || 0);
    this.manaRegenBonus = B.manaRegen || 0; this.spellPower = B.spellPower || 0;
  }
  bonus() {
    const B = {};
    for (const it of Object.values(this.items)) if (it) for (const k in it.stats) B[k] = (B[k] || 0) + it.stats[k];
    return B;
  }
  hasPerk(id) { return Object.values(this.items).some(it => it && it.perk === id); }
  equip(item) {
    const hr = this.hp / this.maxHp, mr = this.maxMana ? this.mana / this.maxMana : 1;
    this.items[item.slot] = item; this.recalc();
    this.hp = Math.max(1, this.maxHp * hr); this.mana = this.maxMana * mr;
    FX.ring(this.x, this.y, 40, '255,215,90', 0.5);
  }
  get ranged() { return !!this.cfg.attack.ranged; }
  get maxBlock() { return this.cfg.maxBlock; }
  get alive() { return !this.dead; }
  get xpToNext() { return this.level >= CONFIG.heroLevels.max ? 0 : CONFIG.heroLevels.xpToNext[this.level - 1]; }
  // 레벨에 따라 커지는 스킬 수치 (scaleKey 항목에 perLevel × (레벨-1) 추가)
  skillValue(sk, key) {
    let v = sk[key] + (sk.perLevel && key === (sk.scaleKey || 'damage') ? sk.perLevel * (this.level - 1) : 0);
    if (this.spellPower && (key === 'damage' || key === 'dps' || key === 'amount')) v *= 1 + this.spellPower;   // 마법사 지팡이: 마법 피해+
    return v;
  }

  gainXp(n) {
    if (this.level >= CONFIG.heroLevels.max) return;
    this.xp += n;
    while (this.level < CONFIG.heroLevels.max && this.xp >= this.xpToNext) {
      this.xp -= this.xpToNext; this.level++;
      const before = this.maxHp, mb = this.maxMana; this.recalc(); this.hp = Math.min(this.maxHp, this.hp + (this.maxHp - before) + this.maxHp * 0.25);
      this.mana = Math.min(this.maxMana, this.mana + (this.maxMana - mb));
      FX.ring(this.x, this.y, 50, '255,215,90', 0.6); FX.spark(this.x, this.y - 10, '#ffe08a', 10);
      FX.text(this.x, this.y - 44, `레벨 업! Lv.${this.level}`, '#ffd36b', 20, 1.4);
    }
    if (this.level >= CONFIG.heroLevels.max) this.xp = 0;
  }

  // ----- 명령 -----
  commandMove(x, y) {
    const t = Nav.clampTarget(x, y);
    this.path = Nav.route(this, t); this.guard = t; this.mode = 'move';
    this.baseTarget = null; this.target = null;
    FX.ring(t.x, t.y, 22, '140,255,120', 0.4);
  }
  commandAttackBase(b) {
    const bodyR = b.m.hitRadius * 0.8, a = Math.atan2(this.y - b.y, this.x - b.x);
    const r = bodyR + (this.ranged ? this.range * 0.8 : this.radius + 4);     // 원거리 영웅은 사거리 안쪽에 섬
    const spot = Nav.clampTarget(b.x + Math.cos(a) * r, b.y + Math.sin(a) * r);
    this.path = Nav.route(this, spot); this.guard = spot; this.mode = 'move';
    this.baseTarget = b; this.target = null;
    FX.ring(b.x, b.y, 90, '255,120,90', 0.45);
  }

  // ----- 피해 / 사망 / 부활 -----
  takeDamage(amount) {
    if (this.dead) return;
    let d = amount * (1 - this.armor);
    if (this.buffs.warcry > 0) d *= 1 - this.buffs.warcryRed;
    this.hp -= d; this.lastHit = G.time; this.flash = 0.1;
    if (SETTINGS.damageNumbers) { this.dmgTaken = (this.dmgTaken || 0) + d; if (G.time - (this.dmgTakenT || -9) > 0.4) { dmgText(this.x, this.y - 46, '-' + Math.round(this.dmgTaken), '#ff7a6a', 15); this.dmgTaken = 0; this.dmgTakenT = G.time; } }
    if (this.hp <= 0) this.die();
  }
  die() {
    this.hp = 0; this.dead = true; this.respawnTimer = this.cfg.respawn; G.stats.heroDeaths++; shake(4, 0.3);
    this.deathX = this.x; this.deathY = this.y; this.dash = null; this.burst = null; this.path = []; this.target = null; this.baseTarget = null;
    for (const e of [...this.engaged]) e.release();
    this.engaged.clear();
    if (G.aim) G.aim = null;
    FX.poof(this.x, this.y, 18);
    showBanner(`${this.cfg.name}가 쓰러졌습니다! ${this.cfg.respawn}초 후 성문 앞에서 부활`, '#ff8a75', 2.8);
  }
  respawn() {
    this.dead = false; this.hp = this.maxHp; this.mana = this.maxMana; this.lastHit = -999;
    this.x = MAP.heroSpawn.x; this.y = MAP.heroSpawn.y; this.face = 0;
    this.guard = { x: this.x, y: this.y }; this.mode = 'guard';
    FX.ring(this.x, this.y, 46, '255,240,180', 0.6); FX.spark(this.x, this.y, '#fff2b0', 10);
    showBanner(`${this.cfg.name} 부활!`, '#ffe08a', 1.8);
  }

  // ----- 스킬 -----
  canCast(i) { const sk = this.cfg.skills[i]; return !this.dead && !this.dash && this.cooldowns[i] <= 0 && this.mana >= (sk.mana || 0); }
  cast(i, tx, ty) {
    if (!this.canCast(i)) return false;
    const sk = this.cfg.skills[i];
    if (sk.target === 'point' && tx != null) {                    // 사거리 밖을 누르면 사거리 끝 지점으로
      const d = dist(this.x, this.y, tx, ty);
      if (d > sk.range) { tx = this.x + (tx - this.x) / d * sk.range; ty = this.y + (ty - this.y) / d * sk.range; }
    }
    const fn = {
      shieldBash: () => this.castShieldBash(sk), warcry: () => this.castWarcry(sk), charge: () => this.castCharge(sk, tx, ty),
      multiShot: () => this.castMultiShot(sk), arrowRain: () => this.castArrowRain(sk, tx, ty), trap: () => this.castTrap(sk, tx, ty),
      fireball: () => this.castFireball(sk, tx, ty), heal: () => this.castHeal(sk), blizzard: () => this.castBlizzard(sk, tx, ty),
    }[sk.id];
    if (!fn || fn() === false) return false;                      // false = 쓸 수 없음 (쿨타임·마나 소모 안 함)
    this.cooldowns[i] = sk.cooldown * (1 - this.cdr);            // 왕의 반지: 쿨타임 감소
    this.mana -= sk.mana || 0;
    return true;
  }

  // ----- 궁사 스킬 -----
  castMultiShot(sk) {
    const t = this.findShotTarget(this.range + 30);
    if (!t) { FX.text(this.x, this.y - 40, '대상 없음', '#d8c8a4', 16, 0.8); return false; }
    this.burst = { left: this.hasPerk('multiPlus') ? 8 : sk.arrows, timer: 0, gap: sk.gap, target: t, damage: this.skillValue(sk, 'damage') };
  }
  findShotTarget(range) {
    if (this.target && this.target.alive && dist(this.x, this.y, this.target.x, this.target.y) <= range) return this.target;
    let best = null, bd = range;
    for (const e of G.enemies) { if (!e.alive) continue; const d = dist(this.x, this.y, e.x, e.y); if (d < bd) { bd = d; best = e; } }
    if (best) return best;
    for (const b of G.bases) if (b.enabled && b.alive && dist(this.x, this.y, b.x, b.y) - b.m.hitRadius * 0.8 <= range) return b;
    return null;
  }
  castArrowRain(sk, tx, ty) {
    G.zones.push(new Zone('arrowRain', tx, ty, sk.radius * (this.hasPerk('rainPlus') ? 1.4 : 1), sk.duration, { dps: this.skillValue(sk, 'dps'), src: this }));
    this.face = Math.atan2(ty - this.y, tx - this.x); this.attackAnim = 0.25;
  }
  castTrap(sk, tx, ty) {
    const p = nearestPathPoint(tx, ty);                          // 덫은 길 위에 설치
    const plus = this.hasPerk('trapPlus'), mine = G.traps.filter(t => t.src === this);
    if (mine.length >= (plus ? 5 : sk.maxTraps)) G.traps.splice(G.traps.indexOf(mine[0]), 1);   // 오래된 덫부터 교체
    G.traps.push(new Trap(p.x, p.y, plus ? { ...sk, root: 3 } : sk, this.skillValue(sk, 'dps'), this));
    FX.dust(p.x, p.y); FX.ring(p.x, p.y, sk.radius, '220,200,160', 0.35);
  }

  // ----- 마법사 스킬 -----
  castFireball(sk, tx, ty) {
    G.projectiles.push(new Fireball(this.x, this.y - 10, tx, ty, this.hasPerk('fireballPlus') ? { ...sk, explosions: 2 } : sk, this.skillValue(sk, 'damage'), this));
    this.face = Math.atan2(ty - this.y, tx - this.x); this.attackAnim = 0.3;
  }
  castHeal(sk) {
    const amt = this.skillValue(sk, 'amount') * (this.hasPerk('healPlus') ? 2 : 1);
    const heal = (u, a) => { const before = u.hp; u.hp = Math.min(u.maxHp, u.hp + a); const got = Math.round(u.hp - before); if (got > 0) FX.text(u.x, u.y - 26, '+' + got, '#7dff6a', 15, 0.9); };
    heal(this, amt);
    for (const u of G.soldiers) if (!u.dead && dist(this.x, this.y, u.x, u.y) <= sk.radius) heal(u, amt);
    const gx = MAP.castle.wallX + MAP.castle.wallW, gy = MAP.gate.y;
    if (!G.gate.destroyed && dist(this.x, this.y, gx, gy) <= sk.gateRange) {
      const before = G.gate.hp; G.gate.hp = Math.min(G.gate.maxHp, G.gate.hp + amt);
      FX.text(gx + 40, gy - 60, '+' + Math.round(G.gate.hp - before), '#7dff6a', 18, 1.1); FX.ring(gx, gy, 60, '140,255,140', 0.6);
    }
    FX.ring(this.x, this.y, sk.radius, '140,255,140', 0.6); FX.ring(this.x, this.y, sk.radius * 0.5, '220,255,200', 0.45);
    for (let i = 0; i < 18; i++) { const a = rand(0, TAU), r = rand(0, sk.radius * 0.8); FX.add({ k: 'spark', x: this.x + Math.cos(a) * r, y: this.y + Math.sin(a) * r, vx: 0, vy: -50, g: 0, life: 0.7, max: 0.7, color: '#b8ff9a', size: 7 }); }
    this.attackAnim = 0.3;
  }
  castBlizzard(sk, tx, ty) {
    G.zones.push(new Zone('blizzard', tx, ty, sk.radius, sk.duration * (this.hasPerk('blizzardPlus') ? 1.5 : 1), { dps: this.skillValue(sk, 'dps'), slow: sk.slow, src: this }));
    this.face = Math.atan2(ty - this.y, tx - this.x); this.attackAnim = 0.3;
  }
  castShieldBash(sk) {
    let best = null, bd = sk.range + 40;                          // 가까운 적 쪽으로 몸을 돌림
    for (const e of G.enemies) { if (!e.alive || e.air) continue; const d = dist(this.x, this.y, e.x, e.y) - e.radius; if (d < bd) { bd = d; best = e; } }
    if (best) this.face = Math.atan2(best.y - this.y, best.x - this.x);
    const plus = this.hasPerk('bashPlus'), range = sk.range * (plus ? 1.5 : 1);
    const dmg = this.skillValue(sk, 'damage'), half = (sk.arc * Math.PI) / 360;
    for (const e of G.enemies) {
      if (!e.alive || (e.air && !e.cfg.lowFly)) continue;
      const d = dist(this.x, this.y, e.x, e.y);
      if (d - e.radius > range) continue;
      const da = Math.abs(Math.atan2(Math.sin(Math.atan2(e.y - this.y, e.x - this.x) - this.face), Math.cos(Math.atan2(e.y - this.y, e.x - this.x) - this.face)));
      if (da > half && d > this.radius + e.radius + 4) continue;
      e.stun = Math.max(e.stun, sk.stun * (plus ? 1.5 : 1)); e.takeDamage(dmg, this); FX.spark(e.x, e.y, '#ffe08a', 5);
    }
    for (const b of G.bases) {
      if (!b.enabled || !b.alive) continue;
      if (dist(this.x, this.y, b.x, b.y) - b.m.hitRadius * 0.8 <= sk.range) { const bd2 = Math.round(dmg * this.cfg.baseDamageMul); b.takeDamage(bd2); FX.text(this.x + Math.cos(this.face) * 40, this.y + Math.sin(this.face) * 40 - 20, '-' + bd2, '#ffd36b', 20); }
    }
    this.attackAnim = 0.25;
    FX.arc(this.x, this.y, this.face, range + 10, half * 2);
  }
  castWarcry(sk) {
    this.buffs.warcry = sk.duration; this.buffs.warcryRed = this.hasPerk('warcryPlus') ? 0.75 : sk.damageReduction;
    let n = 0;
    for (const e of G.enemies) if (e.alive && !e.air && dist(this.x, this.y, e.x, e.y) <= sk.radius) { e.taunted(this, sk.duration); n++; }
    FX.ring(this.x, this.y, sk.radius, '255,120,70', 0.55); FX.ring(this.x, this.y, sk.radius * 0.6, '255,200,120', 0.4);
    FX.text(this.x, this.y - 40, n ? `도발! (${n})` : '도발!', '#ff9a6a', 20, 1.1);
  }
  castCharge(sk, tx, ty) {
    const a = Math.atan2(ty - this.y, tx - this.x);
    const plus = this.hasPerk('chargePlus');
    this.dash = { a, left: sk.distance * (plus ? 1.4 : 1), hit: new Set(), sk, mul: plus ? 2 : 1 };
    this.face = a; this.path = []; this.target = null; this.baseTarget = null;
    for (const e of [...this.engaged]) if (e.taunt <= 0) e.release();
  }
  updateDash(dt) {
    const D = this.dash, sk = D.sk, c = Math.cos(D.a), s = Math.sin(D.a);
    const step = Math.min(sk.speed * dt, D.left), nx = this.x + c * step, ny = this.y + s * step;
    let stop = Nav.blocked(nx, ny);
    if (!stop) { this.x = nx; this.y = ny; D.left -= step; this.moving = true; this.walkAnim += dt * 2; }
    if (Math.random() < 0.6) FX.puff(this.x - c * 12 + rand(-5, 5), this.y + 6 + rand(-4, 4), '#b49a72', rand(4, 8), 0.45, -c * 20, -s * 20 - 8, 0.5);
    const dmg = this.skillValue(sk, 'damage') * D.mul;
    for (const e of G.enemies) {
      if (!e.alive || e.air || D.hit.has(e)) continue;
      if (dist(this.x, this.y, e.x, e.y) > this.radius + e.radius + sk.width / 2) continue;
      D.hit.add(e);
      const side = (e.x - this.x) * -s + (e.y - this.y) * c >= 0 ? 1 : -1;     // 진행 방향 옆으로도 살짝 밀어냄
      e.knockback((c * 0.8 - s * side * 0.6) * sk.knockback / 0.22, (s * 0.8 + c * side * 0.6) * sk.knockback / 0.22, 0.5);
      e.takeDamage(dmg, this); FX.spark(e.x, e.y, '#ffe08a', 6);
    }
    for (const b of G.bases) {
      if (!b.enabled || !b.alive || D.hit.has(b)) continue;
      if (dist(this.x, this.y, b.x, b.y) - b.m.hitRadius * 0.8 <= this.radius + 4) {
        D.hit.add(b); const bd = Math.round(dmg * this.cfg.baseDamageMul); b.takeDamage(bd);
        FX.text(this.x, this.y - 30, '-' + bd, '#ffd36b', 22); stop = true; this.baseTarget = b;
      }
    }
    if (stop || D.left <= 0.5) { this.dash = null; this.guard = { x: this.x, y: this.y }; this.mode = 'guard'; }
  }

  // ----- 이동 -----
  stepToward(tx, ty, dt) {
    const wp = Nav.route(this, { x: tx, y: ty })[0];
    const dx = wp.x - this.x, dy = wp.y - this.y, d = Math.hypot(dx, dy), step = this.speed * dt;
    if (d < 0.5) return true;
    this.face = Math.atan2(dy, dx); this.moving = true; this.walkAnim += dt;
    const k = Math.min(1, step / d), nx = this.x + dx * k, ny = this.y + dy * k;
    if (!Nav.blocked(nx, ny)) { this.x = nx; this.y = ny; }
    return d <= step && wp.x === tx && wp.y === ty;
  }

  findEnemy() {
    const c = this.cfg; let best = null, bd = Infinity;
    for (const e of this.engaged) {                                       // 나를 공격하는 적 먼저
      if (!e.alive || (e.air && !c.canHitAir && !e.cfg.lowFly)) continue;
      const d = dist(this.x, this.y, e.x, e.y); if (d < bd) { bd = d; best = e; }
    }
    if (best) return best;
    for (const e of G.enemies) {
      if (!e.alive || (e.air && !c.canHitAir && !e.cfg.lowFly)) continue;
      if (dist(e.x, e.y, this.guard.x, this.guard.y) > c.aggroRange) continue;
      const d = dist(this.x, this.y, e.x, e.y); if (d < bd) { bd = d; best = e; }
    }
    return best;
  }
  findBase() {
    if (this.baseTarget && this.baseTarget.alive && !this.baseTarget.protectedByBoss) return this.baseTarget;
    for (const b of G.bases) {
      if (!b.enabled || !b.alive || b.protectedByBoss) continue;
      if (dist(this.guard.x, this.guard.y, b.x, b.y) - b.m.hitRadius * 0.8 <= this.attackReach(null) + 30) return b;
    }
    return null;
  }
  // 기본공격이 닿는 거리 (원거리: 중심에서 사거리, 근접: 몸 가장자리 + 사거리)
  attackReach(t) { return this.ranged ? this.range : this.radius + (t ? t.radius : 0) + this.cfg.attack.range; }

  update(dt) {
    for (let i = 0; i < this.cooldowns.length; i++) if (this.cooldowns[i] > 0) this.cooldowns[i] = Math.max(0, this.cooldowns[i] - dt);
    if (this.buffs.warcry > 0) this.buffs.warcry -= dt;
    if (this.attackAnim > 0) this.attackAnim -= dt;
    if (this.flash > 0) this.flash -= dt;
    this.atkTimer -= dt;
    this.moving = false;
    if (this.baseTarget && !this.baseTarget.alive) this.baseTarget = null;     // 파괴된 기지는 목표에서 제외
    // 병사들이 함께 공격할 적 기지 (기지를 공격하러 가는 중이거나 공격 중일 때, 드래곤 보호 중이면 제외)
    this.siegeTarget = this.baseTarget && !this.baseTarget.protectedByBoss ? this.baseTarget : null;
    if (this.dead) { this.respawnTimer -= dt; if (this.respawnTimer <= 0) this.respawn(); return; }
    const c = this.cfg, idle = G.time - this.lastHit >= c.regenDelay;
    if (idle && this.hp < this.maxHp) this.hp = Math.min(this.maxHp, this.hp + this.maxHp * c.regenRate * dt);   // 자연 회복
    if (this.maxMana) this.mana = Math.min(this.maxMana, this.mana + ((c.manaRegen || 0) + this.manaRegenBonus + (idle ? c.manaRegenIdle || 0 : 0)) * dt);   // 마나 회복
    if (this.dash) { this.updateDash(dt); return; }
    if (this.burst) {                                   // 연발 사격: 짧은 간격으로 화살 여러 발
      const B = this.burst; B.timer -= dt;
      if (B.timer <= 0) {
        if (!B.target.alive) B.target = this.findShotTarget(this.range + 30);
        if (!B.target) this.burst = null;
        else {
          B.timer = B.gap; B.left--; this.attackAnim = 0.12; this.face = Math.atan2(B.target.y - this.y, B.target.x - this.x);
          const isBase = B.target instanceof EnemyBase;
          G.projectiles.push(new Arrow(this.x + Math.cos(this.face) * 12, this.y + Math.sin(this.face) * 12, B.target, isBase ? Math.round(B.damage * c.baseDamageMul) : B.damage, c.attack.projectileSpeed, this));
          if (B.left <= 0) this.burst = null;
        }
      }
    }

    if (this.mode === 'move') {                         // 명령 이동 중에는 적을 무시하고 이동
      if (!this.path.length) { this.mode = 'guard'; }
      else {
        const wp = this.path[0], dx = wp.x - this.x, dy = wp.y - this.y, d = Math.hypot(dx, dy), step = this.speed * dt;
        this.moving = true; this.walkAnim += dt; this.face = Math.atan2(dy, dx);
        if (d <= step) { this.x = wp.x; this.y = wp.y; this.path.shift(); if (!this.path.length) this.mode = 'guard'; }
        else { this.x += (dx / d) * step; this.y += (dy / d) * step; }
        return;
      }
    }

    // 지키기: 주변 적 → 적 기지 → 제자리 복귀
    this.retarget -= dt;
    if (this.target && (!this.target.alive || dist(this.target.x, this.target.y, this.guard.x, this.guard.y) > c.leash)) this.target = null;
    if (!this.target || this.retarget <= 0) { this.retarget = 0.25; this.target = this.findEnemy(); }
    const e = this.target;
    if (e) {
      if (dist(this.x, this.y, e.x, e.y) > this.attackReach(e)) this.stepToward(e.x, e.y, dt);
      else this.strike(e, false);
      return;
    }
    const b = this.findBase();
    if (b) {
      this.siegeTarget = b;
      if (dist(this.x, this.y, b.x, b.y) - b.m.hitRadius * 0.8 > this.attackReach(null)) this.stepToward(b.x, b.y, dt);
      else this.strike(b, true);
      return;
    }
    if (dist(this.x, this.y, this.guard.x, this.guard.y) > 3) this.stepToward(this.guard.x, this.guard.y, dt);
  }

  strike(t, isBase) {
    this.face = Math.atan2(t.y - this.y, t.x - this.x);
    if (this.atkTimer > 0) return;
    this.atkTimer = this.atkInterval; this.attackAnim = 0.25;
    const A = this.cfg.attack;
    const crit = this.crit && Math.random() < this.crit;           // 매의 눈 반지: 치명타 (2배)
    if (crit) FX.text(this.x, this.y - 44, '치명타!', '#ffdd55', 15, 0.6);
    if (A.ranged) {                                     // 원거리: 궁사는 화살, 마법사는 마법탄 (방어력 무시)
      const dmg = (isBase ? Math.round(this.damage * this.cfg.baseDamageMul) : this.damage) * (crit ? 2 : 1);
      const sx = this.x + Math.cos(this.face) * 12, sy = this.y + Math.sin(this.face) * 12 - 4;
      if (A.magic) G.projectiles.push(new MagicBolt(sx, sy, t, { damage: dmg }, { boltSpeed: A.projectileSpeed }, this, '#7fd0ff'));
      else { const ar = new Arrow(sx, sy, t, dmg, A.projectileSpeed, this); ar.crit = crit; G.projectiles.push(ar); }
      return;
    }
    if (isBase) {
      const d = Math.round(this.damage * this.cfg.baseDamageMul);
      t.takeDamage(d);
      const hx = this.x + Math.cos(this.face) * 30, hy = this.y + Math.sin(this.face) * 30;
      FX.spark(hx, hy, '#ffe08a', 4); FX.text(hx, hy - 16, '-' + d, '#ffd36b', 16, 0.7);
    } else {
      t.takeDamage(this.damage * (crit ? 2 : 1), this, false, crit); FX.spark(t.x, t.y, '#ffffff', 3);
      FX.arc(t.x - Math.cos(this.face) * 6, t.y - Math.sin(this.face) * 6, this.face, 16, 1.4, '255,255,255', 0.14);   // 베기 효과
    }
  }
}

// ---------- 적 생산기지 ----------
function makeBaseArt(key) {
  const rng = mulberry32(MAP.seed * 7 + key.charCodeAt(0) * 131 + key.length);
  const m = MAP.bases[key];
  const blob = (x, y, r, sx, c) => {
    const P = [];
    for (let i = 0; i < 12; i++) { const a = (i / 12) * TAU, k = 0.84 + rng() * 0.28; P.push([x + Math.cos(a) * r * k * sx, y + Math.sin(a) * r * k]); }
    return { x, y, r, sx, c, P };
  };
  const cracks = (n, rx, ry, cx, cy) => {
    const out = [];
    for (let i = 0; i < n; i++) {
      let x = cx + (rng() - 0.5) * rx * 2, y = cy + (rng() - 0.5) * ry * 2, a = rng() * TAU; const pts = [[x, y]];
      for (let j = 0; j < 4; j++) { a += (rng() - 0.5) * 1.4; x += Math.cos(a) * (6 + rng() * 9); y += Math.sin(a) * (6 + rng() * 9); pts.push([x, y]); }
      out.push(pts);
    }
    return out;
  };
  if (key === 'cave') return {
    blobs: [blob(0, -8, 60, 1.35, '#6a655c'), blob(-70, 12, 34, 1.15, '#5f5b53'), blob(70, 10, 36, 1.15, '#625d55'),
            blob(-30, -40, 38, 1.2, '#77726a'), blob(30, -42, 34, 1.2, '#7c776d'), blob(-2, -58, 24, 1.25, '#8a857a')],
    moss: Array.from({ length: 9 }, () => ({ x: (rng() - 0.5) * 150, y: -10 - rng() * 50, r: 5 + rng() * 9 })),
    cracks: cracks(7, 60, 26, 0, -28),
    rubble: Array.from({ length: 10 }, () => ({ x: (rng() - 0.5) * 64, y: 26 + (rng() - 0.5) * 18, r: 5 + rng() * 6, a: rng() * TAU })),
    eye: rng() * 3,
  };
  if (key === 'goblin') {
    const s0 = MAP.segments.goblin[0], gapA = Math.atan2(s0[1] - m.y, s0[0] - m.x), stakes = [];
    for (let i = 0; i < 46; i++) {
      const a = (i / 46) * TAU - Math.PI;
      const da = Math.abs(Math.atan2(Math.sin(a - gapA), Math.cos(a - gapA)));
      if (da < 0.3) continue;
      stakes.push({ x: Math.cos(a) * 96, y: Math.sin(a) * 70 });
    }
    return {
      stakes, fire: { x: 5, y: -5 }, totem: { x: 22, y: 8 },
      huts: [{ x: -55, y: 8, r: 22 }, { x: 38, y: -32, r: 25 }, { x: -12, y: 42, r: 20 }, { x: 58, y: 28, r: 21 }].map(h => ({ ...h, rot: rng() * TAU })),
      dirt: Array.from({ length: 12 }, () => ({ x: (rng() - 0.5) * 160, y: (rng() - 0.5) * 110, r: 4 + rng() * 10 })),
    };
  }
  return { gateY: MAP.segments.orc[0][1] - m.y, flags: [[-78, -88], [78, -88], [-78, 88], [78, 88]] };
}

class EnemyBase {
  constructor(key) {
    this.key = key; this.cfg = CONFIG.bases[key]; this.m = MAP.bases[key];
    this.x = this.m.x; this.y = this.m.y; this.enabled = this.cfg.enabled;
    this.maxHp = Math.round(this.cfg.maxHp * (G.diff || CONFIG.difficulty.normal).baseHp); this.hp = this.maxHp; this.alive = true;
    this.route = MAPDATA.routes[key];
    this.spawnTimer = this.cfg.firstSpawn; this.queue = [];
    this.lastHit = -999; this.flash = 0; this.shake = 0; this.smokeTimer = 0;
    this.art = makeBaseArt(key);
    this.defenders = []; this.summonCd = 0;
    if (this.enabled && this.cfg.defenders) this.spawnDefenders(this.cfg.defenders.count, false);
  }
  // 수비병 배치: 기지 둘레(성 쪽 반원)에 자리를 잡음. summoned = 기지 입구에서 나와 자리로 이동
  spawnDefenders(n, summoned) {
    const d = this.cfg.defenders;
    compact(this.defenders, e => e.alive);
    for (let i = 0; i < n && this.defenders.length < d.max; i++) {
      const e = new Enemy(d.type, this, 0, G.threat || 1);
      e.maxHp = e.hp = Math.round(e.maxHp * d.hpMul); e.damage *= d.damageMul;
      const k = this.defenders.length, a = Math.PI * (0.55 + ((k * 0.37) % 0.9)), r = this.m.hitRadius * 0.8 + 34 + (k % 2) * 20;
      e.post = Nav.clampTarget(this.x + Math.cos(a) * r, this.y + Math.sin(a) * r);
      e.guardCfg = d; e.state = 'guard';
      if (!summoned) { e.x = e.post.x; e.y = e.post.y; } else FX.dust(e.x, e.y);
      this.defenders.push(e); G.enemies.push(e);
    }
  }
  get spawnInterval() {
    const e = CONFIG.escalation;
    return Math.max(e.minSpawnInterval, this.cfg.spawnInterval * Math.pow(e.spawnIntervalMul, G.threat - 1));
  }
  update(dt) {
    if (this.flash > 0) this.flash -= dt;
    if (this.shake > 0) this.shake -= dt;
    if (this.summonCd > 0) this.summonCd -= dt;
    if (!this.enabled) return;
    if (!this.alive) {                                   // 폐허 연기
      this.smokeTimer -= dt;
      if (this.smokeTimer <= 0) { this.smokeTimer = 0.35; FX.puff(this.x + rand(-50, 50), this.y + rand(-30, 20), '#55504a', rand(10, 18), 2.2, rand(-6, 6), rand(-26, -14), 0.45, 1.6); }
      return;
    }
    if (G.time - this.lastHit >= this.cfg.regenDelay && this.hp < this.maxHp) this.hp = Math.min(this.maxHp, this.hp + this.cfg.regenRate * dt);
    this.spawnTimer -= dt;
    if (this.spawnTimer <= 0 && this.cfg.spawns.length) {
      this.spawnTimer += this.spawnInterval * rand(0.85, 1.15);
      const g = weightedPick(this.cfg.spawns);
      for (let i = 0; i < g.count; i++) {
        const lane = g.count === 1 ? rand(-10, 10) : lerp(-13, 13, i / (g.count - 1)) + rand(-3, 3);
        this.queue.push({ type: g.type, delay: i * this.cfg.groupGap, lane });
      }
    }
    for (let i = this.queue.length - 1; i >= 0; i--) {
      const q = this.queue[i]; q.delay -= dt;
      if (q.delay <= 0) {
        this.queue.splice(i, 1);
        const e = new Enemy(q.type, this, q.lane, G.threat);
        G.enemies.push(e); FX.dust(e.x, e.y);
      }
    }
  }
  // 드래곤이 지키는 중인지 (최종보스가 살아 있는 동안 오크 요새 무적)
  get protectedByBoss() { const f = CONFIG.bosses.final; return f.protectBase && this.key === f.base && G.finalBoss && G.finalBoss.alive; }
  takeDamage(amount) {
    if (!this.alive || !this.enabled) return;
    if (this.protectedByBoss) {
      if (G.time - (this.protMsgT || -9) > 1.5) { this.protMsgT = G.time; FX.text(this.x, this.y - 60, '드래곤이 지키는 중!', '#ff8a6a', 18, 1.2); }
      return;
    }
    this.hp -= amount; this.lastHit = G.time; this.flash = 0.12; this.shake = 0.2;
    const f = CONFIG.bosses.final;                       // 최종보스: 오크 요새 체력 50% 이하
    if (f && this.key === f.base && !G.finalSpawned && this.hp > 0 && this.hp <= this.maxHp * f.triggerHpRatio) { G.finalSpawned = true; spawnBoss(f.type, this); }
    const d = this.cfg.defenders;                         // 공격받으면 수비병 추가 소환해 반격
    if (d && this.summonCd <= 0 && this.hp > 0) {
      this.summonCd = d.summonCooldown;
      const before = this.defenders.filter(e => e.alive).length;
      this.spawnDefenders(d.summon, true);
      if (this.defenders.length > before) FX.text(this.x, this.y - 40, '수비병 소환!', '#ff8a6a', 18, 1.3);
    }
    if (this.hp <= 0) this.destroy();
  }
  destroy() {
    this.hp = 0; this.alive = false; this.queue.length = 0;
    for (const e of this.defenders) {                     // 남은 수비병은 성문으로 진격
      if (!e.alive) continue;
      e.post = null; e.guardCfg = null; e.hunt = null;
      if (e.state !== 'fight') { e.dist = e.route.nearestDist(e.x, e.y, 0, 1e9); e.state = 'rejoin'; }
    }
    FX.explosion(this.x, this.y, 1.5); shake(8, 0.6);
    const left = G.bases.filter(b => b.enabled && b.alive).length;
    showBanner(left ? `${this.cfg.name} 파괴!  남은 기지들이 분노합니다 (위협 +${CONFIG.escalation.baseLostBonus || 0})` : `${this.cfg.name} 파괴!`, '#ffd36b', 3);
    if (G.hero && !G.hero.dead) G.hero.gainXp(this.cfg.xp || 0);
    if (Math.random() < CONFIG.items.dropChance.base) dropItem(this.x, this.y + 40, false);
    if (this.cfg.gold) { addGold(this.cfg.gold); FX.text(this.x, this.y - 70, `+${this.cfg.gold} 골드`, '#ffd84a', 26, 2); }
    if (!G.pendingResult && G.bases.every(b => !b.enabled || !b.alive)) { G.pendingResult = 'won'; G.endTimer = 2; }
  }
}
