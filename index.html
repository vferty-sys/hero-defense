// 위아래를 뒤집은 지도 (성은 그대로)
function mirrorMap(m, o) {
  const H = CONFIG.world.height, fy = p => [p[0], H - p[1]];
  const bases = {}; for (const k in m.bases) bases[k] = { ...m.bases[k], y: H - m.bases[k].y };
  const segments = {}; for (const k in m.segments) segments[k] = m.segments[k].map(fy);
  return { ...m, ...o, bases, segments, river: m.river.map(fy).reverse(), forests: m.forests.map(f => ({ ...f, y: H - f.y })) };
}

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

}

}

// Catmull-Rom 곡선으로 제어점을 촘촘한 점 목록으로 변환
function catmullRom(points, step) {
  const P = points.map(p => ({ x: p[0], y: p[1] }));
  const out = [], n = P.length;
  for (let i = 0; i < n - 1; i++) {
    const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(n - 1, i + 2)];
    const steps = Math.max(2, Math.ceil(Math.hypot(p2.x - p1.x, p2.y - p1.y) / step));
    for (let s = 0; s < steps; s++) {
      const t = s / steps, t2 = t * t, t3 = t2 * t;
      out.push({
        x: 0.5 * (2 * p1.x + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
        y: 0.5 * (2 * p1.y + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3),
      });
    }
  }
  out.push({ x: P[n - 1].x, y: P[n - 1].y });
  return out;
}
function offsetPoly(pts, off) {
  const out = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    let dx = b.x - a.x, dy = b.y - a.y; const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
    out.push({ x: pts[i].x - dy * off, y: pts[i].y + dx * off });
  }
  return out;
}

// 경로: 거리(d)로 위치·방향을 구함
class Route {
  constructor(pts) {
    this.pts = pts;
    this.cum = new Float32Array(pts.length);
    let L = 0;
    for (let i = 1; i < pts.length; i++) { L += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y); this.cum[i] = L; }
    this.length = L;
  }
  sample(d, out) {
    const pts = this.pts, cum = this.cum;
    let lo = 0, hi = pts.length - 1;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (cum[mid] <= d) lo = mid; else hi = mid; }
    const a = pts[lo], b = pts[hi], segL = (cum[hi] - cum[lo]) || 1;
    const t = clamp((d - cum[lo]) / segL, 0, 1);
    out.x = a.x + (b.x - a.x) * t; out.y = a.y + (b.y - a.y) * t;
    out.dx = (b.x - a.x) / segL; out.dy = (b.y - a.y) / segL;
    return out;
  }
  // (x, y)에서 가장 가까운 경로상의 거리값 (around 근처 window 범위에서만 찾음)
  nearestDist(x, y, around, win = 250) {
    let best = Infinity, bd = around;
    for (let i = 0; i < this.pts.length; i++) {
      const c = this.cum[i]; if (c < around - win || c > around + win) continue;
      const p = this.pts[i], d = (p.x - x) ** 2 + (p.y - y) ** 2;
      if (d < best) { best = d; bd = c; }
    }
    return bd;
  }
}

function rr(ctx, x, y, w, h, r) {

  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);

}

}
// 칸 너비(maxW)를 넘으면 글자 크기를 줄여서 한 줄에 맞춤
function fitTxt(ctx, s, x, y, size, maxW, color, align = 'left', o = {}) {

}

    const test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test;

}

// 한국어 조사: 받침이 있으면 a, 없으면 b (예: josa('드래곤', '을', '를') → '드래곤을')

// ---------- 그림 파일(스프라이트): AI로 만든 그림으로 캐릭터를 그림 ----------
// images/ 에 원본을 올리고 tools/prepare_images.py 를 실행하면 images/web/ 에 게임용 그림이 생깁니다.

// 그림은 오른쪽을 바라보는 모습 (왼쪽으로 갈 때는 뒤집어 그림). 병사는 unit_<종류>_<단계>, 없는 단계는 낮은 단계 그림을 씀
const SPRITE_NAMES = ['hero_knight', 'hero_archer', 'hero_mage', 'unit_footman_1', 'unit_archer_1'];
const SPRITE_DIR = 'images/web/';
const Sprites = {
  list: {},
  load() {
    for (const n of SPRITE_NAMES) {
      const im = new Image();
      im.onload = () => this.prepare(n, im);
      im.src = SPRITE_DIR + n + '.png';
    }
  },
  prepare(n, im) {
    const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
    const half = mk(Math.round(im.width / 2), Math.round(im.height / 2)), hg = half.getContext('2d');
    hg.imageSmoothingQuality = 'high'; hg.drawImage(im, 0, 0, half.width, half.height);       // 작게 그릴 때 쓰는 절반 크기
    const flash = mk(im.width, im.height), fg = flash.getContext('2d');                         // 맞았을 때 하얀 실루엣
    fg.drawImage(im, 0, 0); fg.globalCompositeOperation = 'source-in'; fg.fillStyle = '#ffffff'; fg.fillRect(0, 0, flash.width, flash.height);
    let headX = 0.5;                                                                            // 초상화용 얼굴 위치 (위쪽 20%의 가운데)
    try {
      const c = mk(im.width, im.height), g = c.getContext('2d'); g.drawImage(im, 0, 0);
      const d = g.getImageData(0, 0, c.width, Math.round(c.height * 0.2)).data; let sx = 0, cnt = 0;
      for (let i = 3; i < d.length; i += 16) if (d[i] > 128) { sx += ((i - 3) / 4) % c.width; cnt++; }
      if (cnt) headX = sx / cnt / c.width;
    } catch (_) {}
    this.list[n] = { img: im, half, flash, ar: im.width / im.height, headX };
  },
  get(n) { return this.list[n] || null; },
  unit(kind, level) { for (let t = tierOf(level); t >= 1; t--) { const sp = this.list[`unit_${kind}_${t}`]; if (sp) return sp; } return null; },
};

function blobPath(ctx, bl) {
  const P = bl.P, n = P.length;
  ctx.beginPath();
  ctx.moveTo((P[n - 1][0] + P[0][0]) / 2, (P[n - 1][1] + P[0][1]) / 2);
  for (let i = 0; i < n; i++) {
    const p = P[i], q = P[(i + 1) % n];
    ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
  }
  ctx.closePath();
}

const Art = {
  SIZES: { spider: 30, bat: 36, carpenter: 26, wallArcher: 30, arrow: 22, cave: [250, 190], goblin: [230, 180], orc: [210, 220], graveyard: [230, 190] },

  // 이미지가 등록되어 있으면 이미지로 그리고 true 반환
  img(ctx, key, x, y, w, h, rot = 0, flip = false) {
    const im = Images[key]; if (!im) return false;
    ctx.save(); ctx.translate(x, y); if (rot) ctx.rotate(rot); if (flip) ctx.scale(-1, 1);
    ctx.drawImage(im, -w / 2, -h / 2, w, h); ctx.restore();
    return true;
  },

  // 그림 파일로 그리기: (x, y) = 발 위치, H = 키(지도 px). 움직임은 코드로 붙임
  sprite(ctx, sp, x, y, H, o) {
    const W = H * sp.ar, dir = o.flip ? -1 : 1, sq = o.sq || 0;
    const im = H * pixelRatio * Camera.zoom < 150 ? sp.half : sp.img;                 // 작게 보일 때는 절반 크기 그림 (더 깔끔)
    ctx.save(); ctx.translate(x + (o.dx || 0), y + (o.bob || 0));
    if (o.tilt) ctx.rotate(o.tilt);
    ctx.scale(dir * (1 + sq), 1 - sq);
    ctx.drawImage(im, -W / 2, -H, W, H);
    if (o.flash > 0) { ctx.globalAlpha = Math.min(0.75, o.flash * 7); ctx.drawImage(sp.flash, -W / 2, -H, W, H); }
    ctx.restore();
  },
  // 걷기(통통 튀기·좌우 흔들림) / 공격(앞으로 숙이기) / 가만히(숨쉬기) / 기절(흔들흔들) / 방향(좌우 뒤집기)
  spriteMotion(u, rt, atkDur = 0.25) {
    const c = Math.cos(u.face); if (c < -0.25) u.flipX = true; else if (c > 0.25) u.flipX = false;
    const dir = u.flipX ? -1 : 1, o = { flip: !!u.flipX, flash: u.flash || 0 };
    if (u.moving) { const w = u.walkAnim * 11; o.bob = -Math.abs(Math.sin(w)) * 3; o.tilt = Math.sin(w) * 0.06; }
    else o.sq = Math.sin(rt * 2.4 + (u.x % 7)) * 0.012;

    if (u.stun > 0) o.tilt = Math.sin(rt * 9) * 0.08;
    return o;
  },

  // ---------------- 배경 (한 번만 그려서 캐시) ----------------
  buildBackground(res) {
    const W = CONFIG.world.width, H = CONFIG.world.height;
    const c = document.createElement('canvas');
    c.width = Math.round(W * res); c.height = Math.round(H * res);
    const g = c.getContext('2d'); g.scale(res, res);
    const rng = mulberry32(MAP.seed);
    this.grass(g, rng);

    this.decor(g);
    for (const t of MAPDATA.trees) this.tree(g, t);

  },

  grass(g, rng) {
    const W = CONFIG.world.width, H = CONFIG.world.height;
    const T = theme();
    g.fillStyle = MAP.grass || T.grass; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 260; i++) {
      g.fillStyle = rng() < 0.5 ? T.spot[0] : T.spot[1];
      circle(g, rng() * W, rng() * H, 30 + rng() * 100); g.fill();
    }
    g.lineCap = 'round'; g.lineWidth = 1.3;
    for (let i = 0; i < 3600; i++) {
      const x = rng() * W, y = rng() * H, a = -Math.PI / 2 + (rng() - 0.5) * 1.0, l = 3 + rng() * 5;
      g.strokeStyle = rng() < 0.55 ? T.blade[0] : T.blade[1];
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
    }
    const cols = T.flowers;
    for (let i = 0; i < (cols.length ? 46 : 0); i++) {
      const cx = rng() * W, cy = rng() * H; g.fillStyle = cols[Math.floor(rng() * cols.length)];
      for (let j = 0; j < 7; j++) { circle(g, cx + (rng() - 0.5) * 34, cy + (rng() - 0.5) * 22, 1.5 + rng() * 1.3); g.fill(); }
    }

  river(g, rng) {

    strokePoly(g, P, w, T.water[0]);
    strokePoly(g, P, w - 16, T.water[1]);

      for (let i = 0; i < off.length; i += 2) {

  paths(g, rng) {
    const segs = Object.values(MAPDATA.seg), w = MAP.pathWidth;
    for (const s of segs) strokePoly(g, s, w + 12, 'rgba(60,42,20,0.35)');
    for (const s of segs) strokePoly(g, s, w + 4, '#7c5a33');
    for (const s of segs) strokePoly(g, s, w, '#a47c4b');
    for (const s of segs) strokePoly(g, s, w - 18, '#b28a58');
    for (const s of segs) for (const o of [-9, 9]) strokePoly(g, offsetPoly(s, o), 2.2, 'rgba(105,75,40,0.45)'); // 바퀴 자국
    for (const s of segs) for (let i = 0; i < s.length; i++) {                                               // 자갈
      if (rng() < 0.45) continue;
      const a = s[Math.max(0, i - 1)], b = s[Math.min(s.length - 1, i + 1)];
      let dx = b.x - a.x, dy = b.y - a.y; const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
      const o = (rng() - 0.5) * (w - 8);
      g.fillStyle = rng() < 0.5 ? 'rgba(120,88,52,0.8)' : 'rgba(205,175,125,0.8)';
      circle(g, s[i].x - dy * o, s[i].y + dx * o, 0.8 + rng() * 1.8); g.fill();
    }
  },

  bridge(g) {
    const b = MAPDATA.bridge; if (!b) return;
    const L = b.len, Wd = b.wid;
    g.save(); g.translate(b.x, b.y); g.rotate(b.angle);
    g.fillStyle = 'rgba(0,0,0,0.32)'; g.fillRect(-L / 2 + 3, -Wd / 2 + 7, L, Wd);
    for (let x = -L / 2, i = 0; x < L / 2; x += 9, i++) {
      g.fillStyle = i % 3 === 0 ? '#8e6136' : i % 3 === 1 ? '#996a3c' : '#86592f';
      g.fillRect(x, -Wd / 2, Math.min(8, L / 2 - x), Wd);
    }
    g.fillStyle = '#4b2f17'; g.fillRect(-L / 2, -Wd / 2 - 4, L, 6); g.fillRect(-L / 2, Wd / 2 - 2, L, 6);
    g.fillStyle = '#35210f';
    for (const px of [-L / 2, -3.5, L / 2 - 7]) { g.fillRect(px, -Wd / 2 - 6, 7, 9); g.fillRect(px, Wd / 2 - 3, 7, 9); }
    g.restore();
  },

  decor(g) {
    const T = theme();
    for (const d of MAPDATA.decor) {
      if (d.k === 'rock') {
        g.fillStyle = 'rgba(0,0,0,0.25)'; ellipse(g, d.x + 3, d.y + 4, d.r * 1.2, d.r * 0.8); g.fill();
        g.fillStyle = T.rock[0]; ellipse(g, d.x, d.y, d.r * 1.2, d.r * 0.85); g.fill();
        g.fillStyle = T.rock[1]; ellipse(g, d.x - d.r * 0.3, d.y - d.r * 0.25, d.r * 0.55, d.r * 0.35); g.fill();
      } else {
        g.fillStyle = 'rgba(0,0,0,0.22)'; ellipse(g, d.x + 3, d.y + 4, d.r * 1.3, d.r * 0.8); g.fill();
        g.fillStyle = T.bush[0];
        for (const [ox, oy] of [[-d.r * 0.5, 0], [d.r * 0.5, 0], [0, -d.r * 0.4]]) { circle(g, d.x + ox, d.y + oy, d.r * 0.7); g.fill(); }
        g.fillStyle = T.bush[1]; circle(g, d.x - d.r * 0.2, d.y - d.r * 0.4, d.r * 0.35); g.fill();
      }
    }
  },

  // 건설 자리 (빈 터)
  tree(g, t) {
    const { x, y, r } = t, T = theme();
    g.fillStyle = 'rgba(0,0,0,0.26)'; ellipse(g, x + r * 0.28, y + r * 0.38, r * 1.05, r * 0.72); g.fill();
    if (t.pine) {
      const cols = T.pine;
      for (let L = 0; L < 4; L++) {
        const R = r * (1.05 - L * 0.24), n = 9;
        g.fillStyle = cols[L]; g.beginPath();
        for (let i = 0; i <= n * 2; i++) {
          const a = t.rot + (i / (n * 2)) * TAU, rad = i % 2 ? R * 0.62 : R;
          const px = x - L * 1.2 + Math.cos(a) * rad, py = y - L * 1.6 + Math.sin(a) * rad;
          if (i) g.lineTo(px, py); else g.moveTo(px, py);
        }
        g.closePath(); g.fill();
      }
      return;
    }
    const warm = t.hue >= 0.5, L = T.leaf[warm ? 1 : 0];
    g.fillStyle = L[0]; circle(g, x, y, r); g.fill();
    for (let i = 0; i < 6; i++) { const a = t.rot + (i / 6) * TAU; circle(g, x + Math.cos(a) * r * 0.55, y + Math.sin(a) * r * 0.5, r * 0.58); g.fill(); }
    g.fillStyle = L[1]; circle(g, x - r * 0.12, y - r * 0.16, r * 0.78); g.fill();
    for (let i = 0; i < 4; i++) { const a = t.rot + 0.6 + (i / 4) * TAU; circle(g, x - r * 0.12 + Math.cos(a) * r * 0.4, y - r * 0.16 + Math.sin(a) * r * 0.36, r * 0.42); g.fill(); }
    g.fillStyle = L[2]; circle(g, x - r * 0.3, y - r * 0.36, r * 0.38); g.fill();
    g.fillStyle = MAP.theme === 'snow' ? 'rgba(255,255,255,0.6)' : 'rgba(190,230,130,0.35)'; circle(g, x - r * 0.38, y - r * 0.44, r * 0.16); g.fill();
  },

  castle(g, rng) {
    const c = MAP.castle, H = CONFIG.world.height, wx = c.wallX, ww = c.wallW;
    g.fillStyle = '#776e60'; g.fillRect(0, 0, wx + 2, H);                        // 성 안 돌바닥
    const tones = ['#867d6e', '#8f8677', '#7e7568', '#978e7f'];
    for (let y = 0, row = 0; y < H; y += 13, row++) {
      for (let x = row % 2 ? -8 : 0; x < wx; x += 16) { g.fillStyle = tones[Math.floor(rng() * 4)]; rr(g, x + 1, y + 1, 14, 11, 3); g.fill(); }
    }
    const kp = MAP.keep;
    g.fillStyle = 'rgba(70,55,40,0.25)';
    g.fillRect(kp.x + kp.w - 4, c.gateTop + 10, wx - (kp.x + kp.w) + 8, c.gateBottom - c.gateTop - 20);
    for (const h of MAP.houses) this.roof(g, h[0], h[1], h[2], h[3], rng);
    this.keep(g, kp);
    g.fillStyle = 'rgba(0,0,0,0.3)'; g.fillRect(wx + ww, 0, 10, H);              // 성벽 그림자
    g.fillStyle = '#958f84'; g.fillRect(wx, 0, ww, H);                           // 성벽
    g.fillStyle = '#aaa498'; g.fillRect(wx + 5, 0, ww - 18, H);                  // 성벽 위 통로
    g.strokeStyle = 'rgba(55,50,45,0.35)'; g.lineWidth = 1;
    for (let y = 0, row = 0; y < H; y += 12, row++) {
      g.beginPath(); g.moveTo(wx, y); g.lineTo(wx + ww, y); g.stroke();
      for (let x = wx + (row % 2 ? 9 : 0); x < wx + ww; x += 18) { g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 12); g.stroke(); }
    }
    for (let y = 2; y < H; y += 16) {                                             // 바깥쪽 총안
      g.fillStyle = '#827c71'; g.fillRect(wx + ww - 11, y, 11, 9);
      g.fillStyle = 'rgba(255,255,255,0.15)'; g.fillRect(wx + ww - 11, y, 11, 2);
    }
    g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(wx, 0, 3, H);
    g.fillStyle = '#2b221a'; g.fillRect(wx - 2, c.gateTop, ww + 6, c.gateBottom - c.gateTop); // 성문 통로
    for (const t of MAP.towers) this.tower(g, t[0], t[1], t[2]);
  },

  roof(g, x, y, w, h, rng) {
    const pals = [['#a8472f', '#8a3825', '#6f2d1e'], ['#86603c', '#6d4d30', '#563c25'], ['#5a7391', '#475c76', '#38495e']];
    const pal = pals[Math.floor(rng() * pals.length)];
    g.fillStyle = 'rgba(0,0,0,0.3)'; g.fillRect(x + 4, y + 5, w, h);
    g.fillStyle = pal[0]; g.fillRect(x, y, w, h / 2);
    g.fillStyle = pal[1]; g.fillRect(x, y + h / 2, w, h / 2);
    g.strokeStyle = 'rgba(0,0,0,0.18)'; g.lineWidth = 1;
    for (let yy = y + 5; yy < y + h; yy += 6) { g.beginPath(); g.moveTo(x, yy); g.lineTo(x + w, yy); g.stroke(); }
    g.fillStyle = pal[2]; g.fillRect(x, y + h / 2 - 2, w, 4);
    g.strokeStyle = 'rgba(0,0,0,0.4)'; g.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    if (rng() < 0.6) { g.fillStyle = '#6d655a'; g.fillRect(x + w * 0.7, y + 4, 8, 8); }
  },

  keep(g, k) {
    const { x, y, w, h } = k;
    g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(x + 6, y + 8, w, h);
    g.fillStyle = '#8c877c'; g.fillRect(x, y, w, h);
    g.fillStyle = '#a19c90';
    for (let i = x; i < x + w - 4; i += 12) { g.fillRect(i, y, 7, 6); g.fillRect(i, y + h - 6, 7, 6); }
    for (let j = y; j < y + h - 4; j += 12) { g.fillRect(x, j, 6, 7); g.fillRect(x + w - 6, j, 6, 7); }
    const ix = x + 10, iy = y + 10, iw = w - 20, ih = h - 20, cx = ix + iw / 2, cy = iy + ih / 2;
    const tri = (a, b, c2, d, col) => { g.fillStyle = col; g.beginPath(); g.moveTo(a, b); g.lineTo(c2, d); g.lineTo(cx, cy); g.closePath(); g.fill(); };
    tri(ix, iy, ix + iw, iy, '#9a4130'); tri(ix + iw, iy, ix + iw, iy + ih, '#7a3123');
    tri(ix + iw, iy + ih, ix, iy + ih, '#62271c'); tri(ix, iy + ih, ix, iy, '#8a3a2a');
    g.strokeStyle = 'rgba(0,0,0,0.3)'; g.lineWidth = 1.2;
    g.beginPath(); g.moveTo(ix, iy); g.lineTo(ix + iw, iy + ih); g.moveTo(ix + iw, iy); g.lineTo(ix, iy + ih); g.stroke();
  },

  tower(g, x, y, r) {
    g.fillStyle = 'rgba(0,0,0,0.35)'; circle(g, x + 5, y + 6, r); g.fill();
    g.fillStyle = '#8e897e'; circle(g, x, y, r); g.fill();
    g.fillStyle = '#6c675e'; circle(g, x, y, r - 7); g.fill();
    g.fillStyle = '#7a5c3d'; circle(g, x, y, r - 10); g.fill();
    g.save(); circle(g, x, y, r - 10); g.clip();
    g.strokeStyle = 'rgba(40,25,10,0.35)'; g.lineWidth = 1;
    for (let i = -r; i < r; i += 6) { g.beginPath(); g.moveTo(x - r, y + i); g.lineTo(x + r, y + i); g.stroke(); }
    g.restore();
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * TAU;
      g.save(); g.translate(x + Math.cos(a) * (r - 3.5), y + Math.sin(a) * (r - 3.5)); g.rotate(a);
      g.fillStyle = '#a7a296'; g.fillRect(-3.5, -4.5, 7, 9); g.restore();
    }
    g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 1.5; circle(g, x, y, r); g.stroke();
  },

  // ---------------- 매 프레임 그리는 것들 ----------------
  riverShimmer(ctx, t) {
    ctx.save();
    ctx.setLineDash([10, 34]); ctx.lineCap = 'round'; ctx.lineWidth = 2.2;
    ctx.strokeStyle = theme().shimmer;
    ctx.lineDashOffset = -t * 22; polyPath(ctx, MAPDATA.riverOff[0]); ctx.stroke();
    ctx.lineDashOffset = -t * 22 + 17; polyPath(ctx, MAPDATA.riverOff[1]); ctx.stroke();
    ctx.restore();
    this.bridge(ctx);   // 물결이 다리를 덮지 않도록 다리를 다시 그림
  },

  castleDynamic(ctx, gate, rt) {
    this.gateDoor(ctx, gate);
    if (gate.cfg.oilDamage && !gate.destroyed) this.cauldron(ctx, gate, rt);
    const kp = MAP.keep;
    this.flag(ctx, kp.x + kp.w / 2, kp.y + kp.h / 2, '#2f5fb3', rt, 1.2);
    this.flag(ctx, 150, 150, '#2f5fb3', rt + 1, 1);
    this.flag(ctx, 150, 750, '#2f5fb3', rt + 2, 1);
  },

  gateDoor(ctx, gate) {
    const c = MAP.castle, x = c.wallX + 2, y = c.gateTop, w = c.wallW - 2, h = c.gateBottom - c.gateTop;
    if (gate.destroyed) {
      ctx.fillStyle = '#1e1813'; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = '#5c3b1f';
      for (const [ox, oy, a] of [[6, 10, 0.4], [26, 22, -0.6], [12, 52, 1.1], [30, 60, 0.2], [44, 36, -1.2]]) {
        ctx.save(); ctx.translate(x + ox, y + oy); ctx.rotate(a); ctx.fillRect(-9, -3, 18, 6); ctx.restore();
      }
      return;
    }
    if (this.img(ctx, 'gate', x + w / 2, y + h / 2, w, h)) return;
    const ratio = gate.hp / gate.maxHp;
    const L = 2;                         // 외형: 철띠로 보강한 나무문
    const planks = L === 3 ? ['#55524f', '#4a4744'] : L === 2 ? ['#6a4324', '#5e3b20'] : ['#7a4f2b', '#6e4626'];
    for (let i = 0; i < 4; i++) { ctx.fillStyle = planks[i % 2]; ctx.fillRect(x + (i * w) / 4, y, w / 4 + 0.5, h); }
    ctx.strokeStyle = 'rgba(30,18,8,0.5)'; ctx.lineWidth = 1;
    for (let i = 1; i < 4; i++) { ctx.beginPath(); ctx.moveTo(x + (i * w) / 4, y); ctx.lineTo(x + (i * w) / 4, y + h); ctx.stroke(); }
    const bands = L === 1 ? [0.2, 0.72] : [0.12, 0.44, 0.76];
    ctx.fillStyle = L === 3 ? '#b8923a' : '#3d3a38';
    for (const b of bands) ctx.fillRect(x, y + h * b, w, L === 1 ? 5 : 6);
    ctx.fillStyle = L === 3 ? '#ffe08a' : '#9a958c';
    for (const b of bands) for (let i = 0; i < 4; i++) { circle(ctx, x + 5 + i * ((w - 10) / 3), y + h * b + 3, L === 3 ? 1.8 : 1.4); ctx.fill(); }
    if (L === 3) { ctx.strokeStyle = '#e8c35a'; ctx.lineWidth = 1.5; ctx.strokeRect(x + 1, y + 1, w - 2, h - 2); }
    const n = Math.min(gate.cracks.length, Math.floor((1 - ratio) * (gate.cracks.length + 1)));
    ctx.strokeStyle = 'rgba(25,15,8,0.9)'; ctx.lineWidth = 1.6;
    for (let i = 0; i < n; i++) {
      const cr = gate.cracks[i]; ctx.beginPath();
      cr.forEach((p, j) => { const px = x + p[0] * w, py = y + p[1] * h; if (j) ctx.lineTo(px, py); else ctx.moveTo(px, py); });
      ctx.stroke();
    }
    if (ratio < 0.5) { ctx.fillStyle = `rgba(20,10,5,${(0.5 - ratio) * 0.6})`; ctx.fillRect(x, y, w, h); }
    if (gate.flash > 0) { ctx.fillStyle = `rgba(255,90,60,${Math.min(0.6, gate.flash * 4)})`; ctx.fillRect(x, y, w, h); }
    if (gate.openAnim > 0) {                                     // 병사가 나올 때 문이 잠깐 열림
      const o = Math.sin(clamp(gate.openAnim / 0.7, 0, 1) * Math.PI) * h * 0.42;
      ctx.fillStyle = '#16100a'; ctx.fillRect(x, y + h / 2 - o / 2, w, o);
      ctx.fillStyle = 'rgba(255,220,150,0.25)'; ctx.fillRect(x, y + h / 2 - o / 2, 3, o);
    }
  },

  flag(ctx, x, y, col, t, s = 1) {
    const w1 = Math.sin(t * 5 + x * 0.05) * 3 * s, w2 = Math.sin(t * 5 + 1.4 + x * 0.05) * 4 * s;
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath(); ctx.moveTo(x + 3, y - 3); ctx.quadraticCurveTo(x + 14 * s, y - 4 + w1, x + 27 * s, y + 2 + w2); ctx.quadraticCurveTo(x + 14 * s, y + 5 + w1, x + 3, y + 5); ctx.fill();
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(x, y - 7 * s); ctx.quadraticCurveTo(x + 11 * s, y - 9 * s + w1, x + 24 * s, y - 3 * s + w2); ctx.quadraticCurveTo(x + 11 * s, y + 1 * s + w1, x, y + 1 * s); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#f2c94c'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.fillStyle = '#3a2a1a'; circle(ctx, x, y - 3 * s, 2.6 * s); ctx.fill();
  },

  base(ctx, b, t, rt) {
    const sx = b.shake > 0 ? Math.sin(t * 70) * b.shake * 18 : 0;
    ctx.save(); ctx.translate(b.x + sx, b.y);
    if (!b.enabled) ctx.globalAlpha = 0.55;
    const S = this.SIZES[b.key];
    if (!this.img(ctx, 'base_' + b.key, 0, 0, S[0], S[1])) {
      if (b.key === 'cave') this.cave(ctx, b, t, rt);
      else if (b.key === 'goblin') this.goblinVillage(ctx, b, t, rt);
      else if (b.key === 'graveyard') this.graveyard(ctx, b, t, rt);
      else this.orcFortress(ctx, b, t, rt);
    }
    ctx.globalAlpha = 1;
    if (b.alive && b.protectedByBoss) {                            // 드래곤의 보호막
      const p = 0.5 + Math.sin(rt * 3) * 0.2;
      ctx.fillStyle = `rgba(255,90,40,${0.12 * p + 0.06})`; ellipse(ctx, 0, -6, b.m.hitRadius * 1.25, b.m.hitRadius * 1.05); ctx.fill();
      ctx.strokeStyle = `rgba(255,140,80,${0.5 + p * 0.3})`; ctx.lineWidth = 3; ctx.stroke();
    }
    if (!b.enabled) {
      rr(ctx, -52, -14, 104, 28, 14); ctx.fillStyle = 'rgba(15,10,6,0.7)'; ctx.fill();
      txt(ctx, '준비 중', 0, 1, 15, '#d8ccb0', 'center', { weight: 700 });
    }
    ctx.restore();
  },

  cave(ctx, b, t, rt) {
    const s = b.art;
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ellipse(ctx, 10, 30, 125, 44); ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(30,25,20,0.35)';
    for (const bl of s.blobs) { blobPath(ctx, bl); ctx.fillStyle = b.alive ? bl.c : '#57534c'; ctx.fill(); ctx.stroke(); }
    ctx.fillStyle = 'rgba(255,255,255,0.07)';
    for (const bl of s.blobs) { ellipse(ctx, bl.x - bl.r * 0.25 * bl.sx, bl.y - bl.r * 0.3, bl.r * 0.55 * bl.sx, bl.r * 0.4); ctx.fill(); }
    ctx.fillStyle = b.alive ? 'rgba(85,125,55,0.55)' : 'rgba(60,70,45,0.4)';
    for (const m of s.moss) { circle(ctx, m.x, m.y, m.r); ctx.fill(); }
    const ratio = b.hp / b.maxHp;
    const n = Math.min(s.cracks.length, Math.floor((1 - ratio) * (s.cracks.length + 1)));
    ctx.strokeStyle = 'rgba(20,15,10,0.8)'; ctx.lineWidth = 2;
    for (let i = 0; i < n; i++) {
      ctx.beginPath(); s.cracks[i].forEach((p, j) => (j ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.stroke();
    }
    if (b.alive) {
      ctx.fillStyle = '#2a231c'; ellipse(ctx, 0, 24, 42, 27); ctx.fill();
      const grd = ctx.createRadialGradient(0, 32, 2, 0, 28, 34);
      grd.addColorStop(0, '#000'); grd.addColorStop(1, '#1d1712');
      ctx.fillStyle = grd; ellipse(ctx, 0, 28, 34, 21); ctx.fill();
      ctx.fillStyle = '#5b564e';
      for (let i = -3; i <= 3; i++) {
        const tx = i * 9, ty = 5 + Math.abs(i) * 2.2;
        ctx.beginPath(); ctx.moveTo(tx - 4, ty); ctx.lineTo(tx + 4, ty); ctx.lineTo(tx, ty + 7 + (i % 2 ? 0 : 3)); ctx.closePath(); ctx.fill();
      }
      const blink = ((rt * 0.6 + s.eye) % 3.2) < 0.3;
      if (b.enabled && (b.spawnTimer < 1.4 || blink)) {
        ctx.fillStyle = '#ff3a2a';
        for (const [ex, ey] of [[-11, 30], [12, 33]]) { circle(ctx, ex - 2.6, ey, 1.8); ctx.fill(); circle(ctx, ex + 2.6, ey, 1.8); ctx.fill(); }
      }
    } else {
      ctx.fillStyle = '#1b1612'; ellipse(ctx, 0, 26, 36, 20); ctx.fill();
      for (const r of s.rubble) {
        ctx.fillStyle = '#6f6a61'; ellipse(ctx, r.x, r.y, r.r * 1.2, r.r * 0.8, r.a); ctx.fill();
        ctx.fillStyle = '#89847a'; ellipse(ctx, r.x - r.r * 0.3, r.y - r.r * 0.25, r.r * 0.5, r.r * 0.3, r.a); ctx.fill();
      }
    }
    if (b.flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${Math.min(0.45, b.flash * 3.5)})`;
      for (const bl of s.blobs) { blobPath(ctx, bl); ctx.fill(); }
    }
  },

  goblinVillage(ctx, b, t, rt) {
    const s = b.art, alive = b.alive;
    ctx.fillStyle = 'rgba(0,0,0,0.2)'; ellipse(ctx, 6, 10, 108, 80); ctx.fill();
    ctx.fillStyle = '#8a7048'; ellipse(ctx, 0, 0, 100, 74); ctx.fill();
    ctx.fillStyle = 'rgba(60,40,20,0.18)'; for (const d of s.dirt) { circle(ctx, d.x, d.y, d.r); ctx.fill(); }
    ctx.fillStyle = '#5c5850';
    for (let i = 0; i < 8; i++) { const a = (i / 8) * TAU; circle(ctx, s.fire.x + Math.cos(a) * 11, s.fire.y + Math.sin(a) * 8, 3.2); ctx.fill(); }
    if (alive && b.enabled) {
      const f = Math.sin(rt * 14) * 1.5;
      ctx.fillStyle = '#e2572a'; circle(ctx, s.fire.x, s.fire.y - 1, 7.5 + f); ctx.fill();
      ctx.fillStyle = '#f7a73a'; circle(ctx, s.fire.x, s.fire.y - 2, 5 + f * 0.6); ctx.fill();
      ctx.fillStyle = '#ffe48a'; circle(ctx, s.fire.x, s.fire.y - 2, 2.5); ctx.fill();
    } else { ctx.fillStyle = '#2a2522'; circle(ctx, s.fire.x, s.fire.y, 7); ctx.fill(); }
    for (const h of s.huts) {
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; circle(ctx, h.x + 4, h.y + 5, h.r); ctx.fill();
      ctx.fillStyle = alive ? '#a7823d' : '#3b3128'; circle(ctx, h.x, h.y, h.r); ctx.fill();
      ctx.strokeStyle = alive ? '#c9a659' : '#2a231d'; ctx.lineWidth = 1.5;
      for (let i = 0; i < 14; i++) {
        const a = (i / 14) * TAU + h.rot;
        ctx.beginPath(); ctx.moveTo(h.x + Math.cos(a) * h.r * 0.25, h.y + Math.sin(a) * h.r * 0.25);
        ctx.lineTo(h.x + Math.cos(a) * h.r * 0.95, h.y + Math.sin(a) * h.r * 0.95); ctx.stroke();
      }
      ctx.fillStyle = '#5e4521'; circle(ctx, h.x, h.y, h.r * 0.22); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1; circle(ctx, h.x, h.y, h.r); ctx.stroke();
    }
    const tt = s.totem;
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ellipse(ctx, tt.x + 3, tt.y + 6, 7, 4); ctx.fill();
    ctx.fillStyle = '#6b4a2a'; ctx.fillRect(tt.x - 3, tt.y - 14, 6, 18);
    ctx.fillStyle = '#d9d2bf'; circle(ctx, tt.x, tt.y - 16, 6); ctx.fill();
    ctx.fillStyle = '#2a1d14'; circle(ctx, tt.x - 2.2, tt.y - 17, 1.4); ctx.fill(); circle(ctx, tt.x + 2.2, tt.y - 17, 1.4); ctx.fill();
    for (const st of s.stakes) {
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; circle(ctx, st.x + 2, st.y + 3, 5); ctx.fill();
      ctx.fillStyle = alive ? '#6e4a26' : '#3a2c20'; circle(ctx, st.x, st.y, 5); ctx.fill();
      ctx.fillStyle = alive ? '#94683a' : '#4a3a2c'; circle(ctx, st.x - 1.2, st.y - 1.2, 2.3); ctx.fill();
    }
    if (b.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(0.4, b.flash * 3)})`; ellipse(ctx, 0, 0, 100, 74); ctx.fill(); }
  },

  orcFortress(ctx, b, t, rt) {
    const s = b.art, hw = 78, hh = 88, alive = b.alive;
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(-hw + 8, -hh + 10, hw * 2, hh * 2);
    ctx.fillStyle = '#2b231f';
    const spike = (x, y, dx, dy) => { ctx.beginPath(); ctx.moveTo(x - dy * 5, y - dx * 5); ctx.lineTo(x + dx * 11, y + dy * 11); ctx.lineTo(x + dy * 5, y + dx * 5); ctx.closePath(); ctx.fill(); };
    for (let x = -hw + 6; x <= hw - 6; x += 13) { spike(x, -hh, 0, -1); spike(x, hh, 0, 1); }
    for (let y = -hh + 6; y <= hh - 6; y += 13) { if (Math.abs(y - s.gateY) > 24) spike(-hw, y, -1, 0); spike(hw, y, 1, 0); }
    ctx.fillStyle = alive ? '#4a3e36' : '#2e2824'; ctx.fillRect(-hw, -hh, hw * 2, hh * 2);
    ctx.fillStyle = alive ? '#5c4f45' : '#38302b'; ctx.fillRect(-hw + 12, -hh + 12, hw * 2 - 24, hh * 2 - 24);
    ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1;
    for (let x = -hw; x < hw; x += 8) { ctx.beginPath(); ctx.moveTo(x, -hh); ctx.lineTo(x, -hh + 12); ctx.moveTo(x, hh - 12); ctx.lineTo(x, hh); ctx.stroke(); }
    ctx.fillStyle = '#1a1411'; ctx.fillRect(-hw - 2, s.gateY - 18, 16, 36);
    ctx.fillStyle = '#6b6560'; for (let i = 0; i < 4; i++) ctx.fillRect(-hw - 2, s.gateY - 15 + i * 9, 16, 2);
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(-26, -36, 64, 80);
    ctx.fillStyle = alive ? '#7a2c22' : '#3a2420'; ctx.fillRect(-32, -42, 64, 80);
    ctx.fillStyle = alive ? '#5e2119' : '#2c1c19'; ctx.fillRect(-32, -2, 64, 40);
    ctx.fillStyle = '#3d1510'; ctx.fillRect(-32, -4, 64, 4);
    for (const [cx, cy] of [[-hw, -hh], [hw, -hh], [-hw, hh], [hw, hh]]) {
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(cx - 13, cy - 11, 34, 34);
      ctx.fillStyle = '#3b312b'; ctx.fillRect(cx - 17, cy - 17, 34, 34);
      ctx.fillStyle = '#2a221e'; ctx.fillRect(cx - 11, cy - 11, 22, 22);
      ctx.fillStyle = '#d9d2bf'; circle(ctx, cx, cy, 4); ctx.fill();
    }
    if (alive) for (const [fx, fy] of s.flags) this.flag(ctx, fx, fy, '#a3271d', rt + fx * 0.01, 1);
    if (b.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(0.4, b.flash * 3)})`; ctx.fillRect(-hw, -hh, hw * 2, hh * 2); }
  },

  // 묘지: 철 울타리 + 납골당 + 비석 + 보랏빛 안개
  graveyard(ctx, b, t, rt) {
    const s = b.art, alive = b.alive;
    ctx.fillStyle = 'rgba(0,0,0,0.28)'; ellipse(ctx, 6, 18, 112, 72); ctx.fill();
    ctx.fillStyle = alive ? '#4a4238' : '#3e3830'; ellipse(ctx, 0, 10, 104, 68); ctx.fill();
    ctx.fillStyle = 'rgba(80,70,55,0.6)'; for (const d of s.dirt) { ellipse(ctx, d.x, d.y, d.r, d.r * 0.6); ctx.fill(); }
    for (const st of s.stones) {                                                   // 비석
      ctx.save(); ctx.translate(st.x, st.y); ctx.rotate(alive ? st.tilt : st.tilt * 4);
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(-6, 2, 13, 5);
      ctx.fillStyle = alive ? '#8e8c88' : '#6a6864'; rr(ctx, -6, -14, 12, 17, 5); ctx.fill();
      ctx.strokeStyle = 'rgba(40,38,34,0.7)'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(0, -11); ctx.lineTo(0, -3); ctx.moveTo(-3, -8); ctx.lineTo(3, -8); ctx.stroke();
      ctx.restore();
    }
    if (alive) {                                                                  // 납골당
      ctx.fillStyle = '#5a5a62'; ctx.fillRect(-34, -44, 68, 46);
      ctx.fillStyle = '#6e6e78'; ctx.fillRect(-30, -40, 60, 38);
      ctx.fillStyle = '#44444c'; ctx.beginPath(); ctx.moveTo(-40, -44); ctx.lineTo(0, -68); ctx.lineTo(40, -44); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#8a8a94'; for (const px of [-26, -12, 12, 26]) ctx.fillRect(px - 3, -40, 6, 38);
      const glow = 0.4 + 0.3 * Math.sin(rt * 3) + (b.enabled && b.spawnTimer < 1.4 ? 0.4 : 0);
      ctx.fillStyle = '#16121e'; rr(ctx, -10, -22, 20, 24, 9); ctx.fill();
      ctx.fillStyle = `rgba(170,110,255,${Math.min(0.9, glow)})`; rr(ctx, -7, -18, 14, 20, 7); ctx.fill();
      ctx.fillStyle = '#c8c8d0'; ctx.fillRect(-2, -64, 4, 12); ctx.fillRect(-6, -60, 12, 3);
    } else {
      ctx.fillStyle = '#4a4a52'; for (const r of s.rubble) { ellipse(ctx, r.x, r.y - 20, r.r * 1.3, r.r * 0.8, r.a); ctx.fill(); }
    }
    ctx.fillStyle = '#2a2a30';                                                    // 철 울타리
    for (const f of s.fence) { ctx.fillRect(f.x - 1, f.y - 9, 2.2, 10); circle(ctx, f.x, f.y - 9.5, 1.5); ctx.fill(); }
    ctx.strokeStyle = '#4a3a2c'; ctx.lineWidth = 3; ctx.lineCap = 'round';        // 죽은 나무
    ctx.beginPath(); ctx.moveTo(s.tree.x, s.tree.y); ctx.lineTo(s.tree.x - 4, s.tree.y - 30); ctx.lineTo(s.tree.x - 14, s.tree.y - 42);
    ctx.moveTo(s.tree.x - 3, s.tree.y - 22); ctx.lineTo(s.tree.x + 10, s.tree.y - 36); ctx.stroke();
    if (alive) for (let i = 0; i < 5; i++) {                                     // 안개
      const a = rt * 0.3 + i * 1.3; ctx.fillStyle = 'rgba(160,120,220,0.08)'; ellipse(ctx, Math.cos(a) * 60, 10 + Math.sin(a * 1.3) * 30, 34, 16); ctx.fill();
    }
    if (b.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(0.4, b.flash * 3)})`; ellipse(ctx, 0, 0, 100, 66); ctx.fill(); }
  },

  baseBar(ctx, b) {
    if (!b.enabled) return;
    const y = b.y - b.m.barOffset;
    txt(ctx, b.cfg.name + (b.protectedByBoss ? ' (드래곤 보호 중)' : ''), b.x, y - 11, 15, b.protectedByBoss ? '#ffae8a' : b.alive ? '#ffe7b8' : '#c8c8c8', 'center', { stroke: 'rgba(0,0,0,0.85)' });
    if (b.alive) {
      bar(ctx, b.x - 65, y, 130, 11, b.hp / b.maxHp, '#d9443a');
      if (CONFIG.debug.tapBaseDamage > 0 && G.state === 'playing') {
        ctx.globalAlpha = 0.65 + Math.sin(realTime * 4) * 0.3;
        txt(ctx, '탭하면 피해 (1단계 테스트)', b.x + 128, b.y + 8, 13, '#fff3c4', 'left', { stroke: 'rgba(0,0,0,0.85)' });
        ctx.globalAlpha = 1;
      }
    } else txt(ctx, '파괴됨', b.x, y + 6, 14, '#d0d0d0', 'center', { stroke: 'rgba(0,0,0,0.85)' });
  },

  spider(ctx, e) {
    const r = e.radius, lunge = e.lunge > 0 ? Math.sin((e.lunge / 0.15) * Math.PI) * 4 : 0;
    const x = e.x + Math.cos(e.face) * lunge, y = e.y + Math.sin(e.face) * lunge;
    ctx.fillStyle = 'rgba(0,0,0,0.28)'; ellipse(ctx, x, y + 3, r * 1.25, r * 0.7); ctx.fill();
    if (this.img(ctx, e.type, x, y, r * 2.8, r * 2.8, e.face)) return;
    ctx.save(); ctx.translate(x, y); ctx.rotate(e.face);
    const ph = e.anim * (e.state === 'attack' ? 6 : 18);
    ctx.strokeStyle = '#1e1622'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
    ctx.beginPath();                                                     // 다리 8개를 한 번에 그림 (성능)
    for (let side = -1; side <= 1; side += 2) for (let i = 0; i < 4; i++) {
      const wig = Math.sin(ph + i * 1.6 + (side > 0 ? 0 : Math.PI)) * 0.22;
      const a = side * (0.65 + i * 0.55) + wig;
      const kx = Math.cos(a) * r * 1.05, ky = Math.sin(a) * r * 1.05;
      const fa = a + side * (i < 2 ? -0.45 : 0.45);
      ctx.moveTo(0, 0); ctx.lineTo(kx, ky); ctx.lineTo(kx + Math.cos(fa) * r * 0.85, ky + Math.sin(fa) * r * 0.85);
    }
    ctx.stroke();
    const fl = e.flash > 0;
    const queen = e.type === 'spiderQueen';
    ctx.fillStyle = fl ? '#ffffff' : queen ? '#4a2a5a' : '#2d2333'; ellipse(ctx, -r * 0.55, 0, r * 0.82, r * 0.66); ctx.fill();
    ctx.fillStyle = '#b3262e';
    ctx.beginPath(); ctx.moveTo(-r * 0.95, 0); ctx.lineTo(-r * 0.6, -r * 0.2); ctx.lineTo(-r * 0.25, 0); ctx.lineTo(-r * 0.6, r * 0.2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = fl ? '#ffffff' : '#3b2e42'; circle(ctx, r * 0.35, 0, r * 0.5); ctx.fill();
    ctx.fillStyle = '#ff3b3b'; circle(ctx, r * 0.62, -r * 0.17, 1.6); ctx.fill(); circle(ctx, r * 0.62, r * 0.17, 1.6); ctx.fill();
    if (queen) {                                                           // 왕관 + 알주머니
      ctx.fillStyle = '#f2c94c'; ctx.beginPath(); ctx.moveTo(r * 0.15, -r * 0.3);
      for (let i = 0; i <= 4; i++) ctx.lineTo(r * 0.15 + (i % 2 ? r * 0.28 : r * 0.12), -r * 0.3 + i * r * 0.15);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(230,220,200,0.8)'; for (let i = 0; i < 4; i++) { circle(ctx, -r * 1.05 + (i % 2) * 4, -4 + i * 2.6, 2.4); ctx.fill(); }
    }
    ctx.restore();
  },

  // 고블린 / 고블린 궁수 / 오크 / 트롤 (위에서 본 모습, 오른쪽이 앞)
  humanoid(ctx, e) {
    const r = e.radius, lunge = e.lunge > 0 ? Math.sin((e.lunge / 0.15) * Math.PI) * 4 : 0;
    const bob = e.state === 'walk' || e.state === 'rejoin' || e.state === 'toGate' ? Math.sin(e.anim * 12) * 1 : 0;
    const x = e.x + Math.cos(e.face) * lunge, y = e.y + Math.sin(e.face) * lunge + bob;
    ctx.fillStyle = 'rgba(0,0,0,0.28)'; ellipse(ctx, e.x + 1, e.y + r * 0.45, r * 1.1, r * 0.55); ctx.fill();
    if (this.img(ctx, e.type, x, y, r * 3, r * 3, e.face)) return;
    const fl = e.flash > 0, T = e.type;
    ctx.save(); ctx.translate(x, y); ctx.rotate(e.face);
    const sc = e.cfg.drawScale || 1; if (sc !== 1) ctx.scale(sc, sc);
    if (T === 'goblinShaman') {                                                // 고블린 주술사: 보라 로브 + 해골 지팡이 + 뼈 가면
      ctx.fillStyle = `rgba(120,255,120,${0.18 + Math.sin(e.anim * 4) * 0.08})`; circle(ctx, 0, 0, 13); ctx.fill();
      ctx.fillStyle = fl ? '#fff' : '#5a3a7a'; ellipse(ctx, -1, 0, 7.5, 9); ctx.fill();
      ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(-4, 7); ctx.lineTo(12, 7); ctx.stroke();
      ctx.fillStyle = '#e8e2cc'; circle(ctx, 13, 7, 2.6); ctx.fill(); ctx.fillStyle = '#7dff6a'; circle(ctx, 13, 7, 1.1); ctx.fill();
      ctx.fillStyle = fl ? '#fff' : '#7aa84a';
      ctx.beginPath(); ctx.moveTo(-2, -3); ctx.lineTo(-5, -11); ctx.lineTo(2, -4); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-2, 3); ctx.lineTo(-5, 11); ctx.lineTo(2, 4); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ece6d2'; circle(ctx, 0.5, 0, 4.8); ctx.fill();
      ctx.fillStyle = '#2a1d14'; circle(ctx, 2.5, -1.7, 1); ctx.fill(); circle(ctx, 2.5, 1.7, 1); ctx.fill();
    } else if (T === 'goblin' || T === 'goblinArcher') {
      ctx.fillStyle = fl ? '#fff' : T === 'goblin' ? '#6b4a2a' : '#4a5a2a'; ellipse(ctx, -1, 0, 7, 8.5); ctx.fill();          // 몸 (조끼/두건)
      if (T === 'goblin') { ctx.fillStyle = '#a9adb3'; ctx.fillRect(4, 5, 8, 2); ctx.fillStyle = '#5a3a1c'; ctx.fillRect(2, 4.5, 3, 3); }   // 단검
      else {
        const pull = e.state === 'shoot' || e.state === 'siege' ? Math.max(0, e.lunge / 0.15) : 0;
        ctx.strokeStyle = '#6b4220'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(2, 0, 8, -1.1, 1.1); ctx.stroke();
        ctx.strokeStyle = '#ddd'; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.moveTo(2 + Math.cos(1.1) * 8, -Math.sin(1.1) * 8); ctx.lineTo(-2 - pull * 3, 0); ctx.lineTo(2 + Math.cos(1.1) * 8, Math.sin(1.1) * 8); ctx.stroke();
      }
      ctx.fillStyle = fl ? '#fff' : '#7aa84a';                                                                          // 머리 + 큰 귀
      ctx.beginPath(); ctx.moveTo(-2, -3); ctx.lineTo(-5, -11); ctx.lineTo(2, -4); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-2, 3); ctx.lineTo(-5, 11); ctx.lineTo(2, 4); ctx.closePath(); ctx.fill();
      circle(ctx, 0.5, 0, 4.8); ctx.fill();
      if (T === 'goblinArcher') { ctx.fillStyle = '#3a4a1e'; ctx.beginPath(); ctx.arc(0, 0, 5, Math.PI * 0.5, Math.PI * 1.5); ctx.fill(); }
      ctx.fillStyle = '#ffde3a'; circle(ctx, 3.4, -1.6, 1.1); ctx.fill(); circle(ctx, 3.4, 1.6, 1.1); ctx.fill();
    } else if (T === 'orc' || T === 'orcChief') {
      if (T === 'orcChief') { ctx.fillStyle = '#8a1a14'; ellipse(ctx, -7, 0, 8, 13); ctx.fill(); }                     // 족장 망토
      ctx.fillStyle = fl ? '#fff' : '#4d7436'; ellipse(ctx, 0, 0, 10, 13); ctx.fill();                                       // 어깨
      ctx.fillStyle = '#6b6560'; ellipse(ctx, -1, -9, 5, 4); ctx.fill(); ellipse(ctx, -1, 9, 5, 4); ctx.fill();          // 어깨 갑옷
      ctx.fillStyle = '#5a3a1c'; ctx.fillRect(-2, -3, 6, 6);
      ctx.save(); ctx.translate(3, 11); ctx.rotate(e.lunge > 0 ? -0.6 : 0.3);                                            // 도끼
      ctx.fillStyle = '#5a3a1c'; ctx.fillRect(0, -1.5, 16, 3); ctx.fillStyle = '#9aa0a8';
      ctx.beginPath(); ctx.moveTo(12, -1.5); ctx.quadraticCurveTo(18, -9, 21, -2); ctx.lineTo(16, -1.5); ctx.closePath(); ctx.fill(); ctx.restore();
      ctx.fillStyle = fl ? '#fff' : '#5c8a40'; circle(ctx, 2, 0, 6); ctx.fill();                                           // 머리
      ctx.fillStyle = '#f0ead6'; ctx.fillRect(6, -3.5, 2.5, 1.6); ctx.fillRect(6, 2, 2.5, 1.6);                          // 엄니
      ctx.fillStyle = '#ff4a2a'; circle(ctx, 5, -2, 1); ctx.fill(); circle(ctx, 5, 2, 1); ctx.fill();
      if (T === 'orcChief') {                                                                                           // 뿔 투구
        ctx.fillStyle = '#5a5650'; ctx.beginPath(); ctx.arc(1, 0, 6.3, Math.PI * 0.5, Math.PI * 1.5); ctx.fill();
        ctx.fillStyle = '#ece6d2';
        ctx.beginPath(); ctx.moveTo(0, -5); ctx.quadraticCurveTo(-3, -11, 3, -13); ctx.lineTo(2, -6); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(0, 5); ctx.quadraticCurveTo(-3, 11, 3, 13); ctx.lineTo(2, 6); ctx.closePath(); ctx.fill();
      }
    } else if (T === 'skeleton') {                                                                                       // 해골 병사: 뼈 몸 + 녹슨 칼 + 둥근 방패
      ctx.fillStyle = fl ? '#fff' : '#d6d0bc'; ellipse(ctx, -1, 0, 6, 8); ctx.fill();
      ctx.strokeStyle = '#7a7466'; ctx.lineWidth = 1; for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(-5, i * 2.6); ctx.lineTo(3, i * 2.6); ctx.stroke(); }
      ctx.save(); ctx.translate(2, 7); ctx.rotate(e.lunge > 0 ? -0.8 : 0.3);
      ctx.fillStyle = '#8a6a4a'; ctx.fillRect(3, -1.2, 13, 2.4); ctx.fillStyle = '#4a3a2a'; ctx.fillRect(1, -2.5, 2.5, 5); ctx.restore();
      ctx.fillStyle = '#6a5a44'; circle(ctx, 3, -8, 4.5); ctx.fill(); ctx.strokeStyle = '#4a3a2a'; ctx.lineWidth = 1.2; ctx.stroke();
      ctx.fillStyle = fl ? '#fff' : '#ece6d2'; circle(ctx, 1.5, 0, 5); ctx.fill();
      ctx.fillStyle = '#1e1a14'; circle(ctx, 3.6, -1.8, 1.3); ctx.fill(); circle(ctx, 3.6, 1.8, 1.3); ctx.fill();
      if (e.revived) { ctx.fillStyle = 'rgba(180,120,255,0.8)'; circle(ctx, 3.6, -1.8, 0.7); ctx.fill(); circle(ctx, 3.6, 1.8, 0.7); ctx.fill(); }
    } else if (T === 'skeletonMage' || T === 'lich') {                                                                   // 해골 마법사 / 리치: 어두운 로브 + 마법 지팡이
      const lich = T === 'lich';
      if (lich) { ctx.fillStyle = `rgba(170,90,255,${0.18 + Math.sin(e.anim * 4) * 0.08})`; circle(ctx, 0, 0, 15); ctx.fill(); ctx.fillStyle = '#2a1a3a'; ellipse(ctx, -7, 0, 7, 12); ctx.fill(); }
      ctx.fillStyle = fl ? '#fff' : lich ? '#3a2458' : '#3a3046'; ellipse(ctx, -1, 0, 7.5, 9); ctx.fill();
      ctx.strokeStyle = '#4a3a2a'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(-4, 7); ctx.lineTo(13, 7); ctx.stroke();
      ctx.fillStyle = `rgba(190,120,255,${0.5 + Math.sin(e.anim * 6) * 0.3})`; circle(ctx, 14, 7, 4); ctx.fill(); ctx.fillStyle = '#f0d8ff'; circle(ctx, 14, 7, 1.6); ctx.fill();
      ctx.fillStyle = fl ? '#fff' : '#ece6d2'; circle(ctx, 1, 0, 5); ctx.fill();
      ctx.fillStyle = '#b07aff'; circle(ctx, 3, -1.8, 1.2); ctx.fill(); circle(ctx, 3, 1.8, 1.2); ctx.fill();
      if (lich) { ctx.fillStyle = '#f2c94c'; ctx.beginPath(); ctx.moveTo(-2, -5); for (let i = 0; i <= 4; i++) ctx.lineTo(-4 + (i % 2 ? -2 : 0), -5 + i * 2.5); ctx.closePath(); ctx.fill(); }
    } else if (T === 'bomber') {                                                                                         // 폭탄 고블린: 큰 폭탄 + 불붙은 심지
      ctx.fillStyle = fl ? '#fff' : '#8a4a2a'; ellipse(ctx, -1, 0, 7, 8.5); ctx.fill();
      ctx.fillStyle = '#7aa84a';
      ctx.beginPath(); ctx.moveTo(-2, -3); ctx.lineTo(-5, -11); ctx.lineTo(2, -4); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-2, 3); ctx.lineTo(-5, 11); ctx.lineTo(2, 4); ctx.closePath(); ctx.fill();
      circle(ctx, 0.5, 0, 4.8); ctx.fill();
      ctx.fillStyle = '#26262a'; circle(ctx, 9, 0, 5.5); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,0.25)'; circle(ctx, 7.5, -1.8, 1.6); ctx.fill();
      ctx.strokeStyle = '#c8a060'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(13, 0); ctx.lineTo(16, -2); ctx.stroke();
      ctx.fillStyle = Math.sin(e.anim * 30) > 0 ? '#ffe04a' : '#ff7a2a'; circle(ctx, 16.5, -2.3, 1.8); ctx.fill();
      ctx.fillStyle = '#ffde3a'; circle(ctx, 3.4, -1.6, 1.1); ctx.fill(); circle(ctx, 3.4, 1.6, 1.1); ctx.fill();
    } else if (T === 'troll') {
      ctx.fillStyle = fl ? '#fff' : '#7a8a6a'; ellipse(ctx, -2, 0, 14, 17); ctx.fill();                                   // 큰 몸
      ctx.fillStyle = '#4a3a2a'; for (let i = -2; i <= 2; i++) { ellipse(ctx, -9, i * 5, 3.5, 2.2); ctx.fill(); }         // 등 털
      ctx.save(); ctx.translate(4, 15); ctx.rotate(e.lunge > 0 ? -0.8 : 0.25);                                            // 몽둥이
      ctx.fillStyle = '#6b4a2a'; ctx.fillRect(0, -3, 20, 6); ctx.fillStyle = '#5a3a1c'; circle(ctx, 20, 0, 6); ctx.fill();
      ctx.fillStyle = '#c8c2b0'; for (const a of [0, 1.6, 3.2, 4.8]) { circle(ctx, 20 + Math.cos(a) * 6, Math.sin(a) * 6, 1.3); ctx.fill(); }
      ctx.restore();
      ctx.fillStyle = fl ? '#fff' : '#8a9a78'; circle(ctx, 6, 0, 7); ctx.fill();                                           // 머리
      ctx.fillStyle = '#ffb83a'; circle(ctx, 10, -2.5, 1.4); ctx.fill(); circle(ctx, 10, 2.5, 1.4); ctx.fill();
    }
    ctx.restore();
  },

  // 늑대 / 늑대 왕 (네 발 짐승)
  wolf(ctx, e) {
    const r = e.radius, king = e.type === 'wolfKing', sc = e.cfg.drawScale || 1, fl = e.flash > 0;
    const lunge = e.lunge > 0 ? Math.sin((e.lunge / 0.15) * Math.PI) * 5 : 0, x = e.x + Math.cos(e.face) * lunge, y = e.y + Math.sin(e.face) * lunge;
    ctx.fillStyle = 'rgba(0,0,0,0.26)'; ellipse(ctx, e.x + 1, e.y + 4, r * 1.3, r * 0.55); ctx.fill();
    if (this.img(ctx, e.type, x, y, r * 3, r * 3, e.face)) return;
    const run = e.spd > 0 && e.state !== 'fight' && e.state !== 'attack', ph = e.anim * 16;
    ctx.save(); ctx.translate(x, y); ctx.rotate(e.face); ctx.scale(sc, sc);
    const fur = fl ? '#fff' : king ? '#d8dde4' : '#7a7f86', dark = king ? '#9aa2ac' : '#4e535a';
    ctx.strokeStyle = dark; ctx.lineWidth = 3; ctx.lineCap = 'round';                                      // 꼬리
    ctx.beginPath(); ctx.moveTo(-10, 0); ctx.quadraticCurveTo(-15, Math.sin(e.anim * 9) * 3, -19, Math.sin(e.anim * 9 + 1) * 4); ctx.stroke();
    ctx.fillStyle = dark;                                                                                  // 다리
    for (const [lx, ly, o] of [[6, -5, 0], [6, 5, Math.PI], [-6, -5, Math.PI], [-6, 5, 0]]) { const sw = run ? Math.sin(ph + o) * 3 : 0; ellipse(ctx, lx + sw, ly * 1.05, 2.6, 1.8); ctx.fill(); }
    ctx.fillStyle = fur; ellipse(ctx, -1, 0, 12.5, 7.5); ctx.fill();                                       // 몸
    ctx.fillStyle = dark; ellipse(ctx, -2, 0, 9, 2.8); ctx.fill();
    ctx.fillStyle = fur; circle(ctx, 11, 0, 6); ctx.fill(); ellipse(ctx, 15, 0, 4, 2.8); ctx.fill();       // 머리·주둥이
    ctx.fillStyle = dark; ctx.beginPath(); ctx.moveTo(8, -3); ctx.lineTo(6, -7); ctx.lineTo(10, -4); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(8, 3); ctx.lineTo(6, 7); ctx.lineTo(10, 4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#1a1a1a'; circle(ctx, 17.2, 0, 1.2); ctx.fill();
    ctx.fillStyle = king ? '#ff3a2a' : '#ffd23b'; circle(ctx, 12, -2.2, 1); ctx.fill(); circle(ctx, 12, 2.2, 1); ctx.fill();
    if (king) { ctx.fillStyle = '#f2c94c'; ctx.beginPath(); ctx.moveTo(7, -3); for (let i = 0; i <= 4; i++) ctx.lineTo(5 + (i % 2 ? -2.2 : 0), -3 + i * 1.5); ctx.closePath(); ctx.fill(); }
    ctx.restore();
  },
  // 슬라임 / 꼬마 슬라임 / 슬라임 왕 (말랑한 방울)
  slime(ctx, e) {
    const r = e.radius, king = e.type === 'slimeKing', fl = e.flash > 0, sq = Math.sin(e.anim * (king ? 4 : 7)) * 0.12;
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ellipse(ctx, e.x, e.y + r * 0.35, r * 1.1, r * 0.45); ctx.fill();
    if (this.img(ctx, e.type, e.x, e.y - r * 0.3, r * 2.6, r * 2.6)) return;
    const col = king ? ['rgba(150,80,210,0.85)', '#c8a0f0'] : ['rgba(90,200,70,0.82)', '#b8f0a0'];
    const w = r * (1 + sq), h = r * (0.85 - sq), cy = e.y - h * 0.55;
    ctx.fillStyle = fl ? '#ffffff' : col[0]; ctx.beginPath(); ctx.ellipse(e.x, cy, w, h, 0, Math.PI, 0); ctx.lineTo(e.x + w, cy + h * 0.55); ctx.quadraticCurveTo(e.x, cy + h * 0.85, e.x - w, cy + h * 0.55); ctx.closePath(); ctx.fill();
    ctx.fillStyle = col[1]; ctx.globalAlpha = 0.7; ellipse(ctx, e.x - w * 0.35, cy - h * 0.4, w * 0.25, h * 0.18); ctx.fill(); ctx.globalAlpha = 1;
    const ex = Math.cos(e.face) * w * 0.25;
    ctx.fillStyle = '#1a2a14'; circle(ctx, e.x + ex - w * 0.22, cy, Math.max(1.2, r * 0.12)); ctx.fill(); circle(ctx, e.x + ex + w * 0.22, cy, Math.max(1.2, r * 0.12)); ctx.fill();
    if (king) { ctx.fillStyle = '#f2c94c'; const bx = e.x, by = cy - h * 0.95; ctx.beginPath(); ctx.moveTo(bx - 10, by + 4); ctx.lineTo(bx - 10, by - 4); ctx.lineTo(bx - 5, by); ctx.lineTo(bx, by - 7); ctx.lineTo(bx + 5, by); ctx.lineTo(bx + 10, by - 4); ctx.lineTo(bx + 10, by + 4); ctx.closePath(); ctx.fill(); }
  },
  // 유령: 반투명하게 떠다님
  ghost(ctx, e) {
    const r = e.radius, bob = Math.sin(e.anim * 3) * 3, x = e.x, y = e.y - AIR_HEIGHT * 0.8 + bob, fl = e.flash > 0;
    if (this.img(ctx, 'ghost', x, y, r * 2.8, r * 2.8)) return;
    ctx.globalAlpha = 0.78;
    ctx.fillStyle = fl ? '#ffffff' : '#dbe8f4'; ctx.beginPath(); ctx.arc(x, y - 2, r * 0.9, Math.PI, 0);
    for (let i = 0; i <= 4; i++) { const px = x + r * 0.9 - (i / 4) * r * 1.8, py = y + r * 0.7 + Math.sin(e.anim * 8 + i) * 2.5; ctx.lineTo(px, py); }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(160,200,255,0.4)'; circle(ctx, x, y, r * 1.2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#1e2a3a'; ellipse(ctx, x - 3.5, y - 3, 1.8, 2.6); ctx.fill(); ellipse(ctx, x + 3.5, y - 3, 1.8, 2.6); ctx.fill();
    ellipse(ctx, x, y + 3, 2, 1.4); ctx.fill();
  },
  // 골렘 / 바위 거인: 돌덩이 몸 + 빛나는 눈
  golem(ctx, e) {
    const r = e.radius, giant = e.type === 'stoneGiant', sc = e.cfg.drawScale || 1, fl = e.flash > 0;
    const lunge = e.lunge > 0 ? Math.sin((e.lunge / 0.15) * Math.PI) * 4 : 0, x = e.x + Math.cos(e.face) * lunge, y = e.y + Math.sin(e.face) * lunge;
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ellipse(ctx, e.x + 2, e.y + r * 0.45, r * 1.15, r * 0.55); ctx.fill();
    if (this.img(ctx, e.type, x, y, r * 3, r * 3, e.face)) return;
    ctx.save(); ctx.translate(x, y); ctx.rotate(e.face); ctx.scale(sc, sc);
    const stone = fl ? '#fff' : giant ? '#7a7468' : '#8a857a', dark = giant ? '#5a554c' : '#6a655c';
    ctx.fillStyle = dark; circle(ctx, 0, -13, 7); ctx.fill(); circle(ctx, 0, 13, 7); ctx.fill();          // 팔(어깨 바위)
    ctx.fillStyle = stone; circle(ctx, 3, -14, 5); ctx.fill(); circle(ctx, 3, 14, 5); ctx.fill();
    ctx.fillStyle = stone; ellipse(ctx, -2, 0, 12, 13); ctx.fill();                                      // 몸
    ctx.strokeStyle = 'rgba(30,25,20,0.5)'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(-8, -6); ctx.lineTo(-2, 0); ctx.lineTo(-7, 7); ctx.moveTo(2, -9); ctx.lineTo(4, -2); ctx.stroke();
    if (giant) { ctx.fillStyle = 'rgba(85,125,55,0.75)'; circle(ctx, -6, -6, 3.5); ctx.fill(); circle(ctx, -8, 5, 3); ctx.fill(); circle(ctx, 0, 9, 2.5); ctx.fill(); }
    ctx.fillStyle = fl ? '#fff' : '#9a958a'; circle(ctx, 7, 0, 6); ctx.fill();                          // 머리
    ctx.fillStyle = giant ? '#ff9a3a' : '#5ae0ff'; ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 6;
    circle(ctx, 10, -2.4, 1.5); ctx.fill(); circle(ctx, 10, 2.4, 1.5); ctx.fill(); ctx.shadowBlur = 0;
    ctx.restore();
  },

  // 드래곤 (최종보스): 큰 날개, 꼬리, 화염 숨결
  dragon(ctx, e) {
    const r = e.radius, flap = Math.sin(e.anim * 4.5), bob = Math.sin(e.anim * 2) * 4;
    if (this.img(ctx, 'dragon', e.x, e.y - AIR_HEIGHT * 1.6 + bob, r * 4, r * 4, e.face)) return;
    const fl = e.flash > 0;
    ctx.save(); ctx.translate(e.x, e.y - AIR_HEIGHT * 1.6 + bob); ctx.rotate(e.face);
    ctx.strokeStyle = '#6a1510'; ctx.lineCap = 'round';                                     // 꼬리
    const tw = Math.sin(e.anim * 3) * r * 0.45;
    ctx.lineWidth = r * 0.3; ctx.beginPath(); ctx.moveTo(-r * 0.5, 0); ctx.quadraticCurveTo(-r * 1.3, tw, -r * 1.9, -tw * 0.6); ctx.stroke();
    ctx.fillStyle = '#4a0e0a'; ctx.beginPath(); ctx.moveTo(-r * 1.9, -tw * 0.6 - 6); ctx.lineTo(-r * 2.25, -tw * 0.6); ctx.lineTo(-r * 1.9, -tw * 0.6 + 6); ctx.closePath(); ctx.fill();
    for (const sd of [-1, 1]) {                                                              // 날개
      const span = r * (1.8 + 0.45 * flap);
      ctx.fillStyle = fl ? '#ffffff' : '#8a1f18'; ctx.strokeStyle = '#4a0e0a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(r * 0.25, sd * r * 0.25);
      ctx.quadraticCurveTo(r * 0.5, sd * span * 0.85, -r * 0.2, sd * span);
      ctx.quadraticCurveTo(-r * 0.5, sd * span * 0.62, -r * 0.8, sd * span * 0.8);
      ctx.quadraticCurveTo(-r * 0.75, sd * span * 0.45, -r * 1.1, sd * span * 0.5);
      ctx.quadraticCurveTo(-r * 0.75, sd * r * 0.5, -r * 0.45, sd * r * 0.25);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = 'rgba(40,5,3,0.6)'; ctx.lineWidth = 1.5;
      for (const [tx, ty] of [[-0.2, 1], [-0.8, 0.8], [-1.1, 0.5]]) { ctx.beginPath(); ctx.moveTo(r * 0.2, sd * r * 0.28); ctx.lineTo(r * tx, sd * span * ty); ctx.stroke(); }
    }
    ctx.fillStyle = fl ? '#ffffff' : '#a3271d'; ellipse(ctx, -r * 0.1, 0, r * 0.78, r * 0.42); ctx.fill();   // 몸
    ctx.fillStyle = '#d8a040'; ellipse(ctx, 0, 0, r * 0.45, r * 0.18); ctx.fill();
    ctx.fillStyle = '#4a0e0a'; for (let i = 0; i < 5; i++) { const px = -r * 0.6 + i * r * 0.28; ctx.beginPath(); ctx.moveTo(px - 4, 0); ctx.lineTo(px, -7); ctx.lineTo(px + 4, 0); ctx.closePath(); ctx.fill(); }
    ctx.fillStyle = fl ? '#ffffff' : '#a3271d'; ellipse(ctx, r * 0.78, 0, r * 0.32, r * 0.2); ctx.fill();        // 목·머리
    ellipse(ctx, r * 1.1, 0, r * 0.3, r * 0.19); ctx.fill();
    ctx.fillStyle = '#ece6d2';
    for (const sd of [-1, 1]) { ctx.beginPath(); ctx.moveTo(r * 0.98, sd * r * 0.12); ctx.lineTo(r * 0.75, sd * r * 0.38); ctx.lineTo(r * 1.05, sd * r * 0.18); ctx.closePath(); ctx.fill(); }
    ctx.fillStyle = '#ffd23b'; circle(ctx, r * 1.18, -r * 0.09, 2.4); ctx.fill(); circle(ctx, r * 1.18, r * 0.09, 2.4); ctx.fill();
    if (e.breathAnim > 0) { ctx.fillStyle = `rgba(255,150,40,${e.breathAnim})`; circle(ctx, r * 1.42, 0, 8 + e.breathAnim * 6); ctx.fill(); }
    ctx.restore();
  },

  // 바닥에 떨어진 아이템: 등급 색 빛기둥 + 떠 있는 아이콘
  drop(ctx, d, rt) {
    const col = rarityOf(d.item).color, bob = Math.sin(rt * 3 + d.x) * 3, pulse = 0.6 + Math.sin(rt * 4) * 0.25;
    const g = ctx.createLinearGradient(0, d.y - 110, 0, d.y);
    g.addColorStop(0, hexA(col, 0)); g.addColorStop(1, hexA(col, 0.5 * pulse));
    ctx.fillStyle = g; ctx.fillRect(d.x - 8, d.y - 110, 16, 110);
    ctx.fillStyle = hexA(col, 0.35 * pulse); ellipse(ctx, d.x, d.y, 22, 10); ctx.fill();
    ctx.fillStyle = 'rgba(25,18,10,0.9)'; circle(ctx, d.x, d.y - 22 + bob, 15); ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.stroke();
    Icon.item(ctx, d.item, G.heroType, d.x, d.y - 22 + bob, 22);
  },

  airShadow(ctx, e) {
    ctx.fillStyle = 'rgba(0,0,0,0.18)'; ellipse(ctx, e.x, e.y + 4, e.radius * 0.9, e.radius * 0.4); ctx.fill();
  },

  bat(ctx, e) {
    const r = e.radius, bob = Math.sin(e.anim * 5) * 3;
    const lunge = e.lunge > 0 ? Math.sin((e.lunge / 0.15) * Math.PI) * 5 : 0;
    const x = e.x + Math.cos(e.face) * lunge, y = e.y - AIR_HEIGHT + bob + Math.sin(e.face) * lunge;
    const flipX = Math.cos(e.face) < 0;
    const harpy = e.type === 'harpy';
    if (this.img(ctx, e.type, x, y, this.SIZES.bat, this.SIZES.bat, 0, flipX)) return;
    ctx.save(); ctx.translate(x, y); if (flipX) ctx.scale(-1, 1);
    const flap = Math.sin(e.anim * (harpy ? 11 : 16)), span = r * (harpy ? 1.5 : 1.25) * (1 + 0.36 * Math.abs(flap)), tipY = -r * 0.2 - flap * r * 0.7;
    const fl = e.flash > 0;
    for (const sd of [-1, 1]) {
      ctx.fillStyle = fl ? '#ffffff' : harpy ? '#8a5a34' : '#3a2b4d'; ctx.strokeStyle = harpy ? '#5a3a1e' : '#24192f'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(sd * 3, -2);
      ctx.quadraticCurveTo(sd * span * 0.6, -r * 0.9 - flap * r * 0.5, sd * span, tipY);
      ctx.quadraticCurveTo(sd * span * 0.8, r * 0.25, sd * span * 0.62, r * 0.05);
      ctx.quadraticCurveTo(sd * span * 0.45, r * 0.35, sd * span * 0.3, r * 0.1);
      ctx.quadraticCurveTo(sd * span * 0.15, r * 0.4, sd * 2, r * 0.3);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    if (harpy) {                                                       // 하피: 깃털 날개 + 사람 얼굴 + 붉은 머리칼
      ctx.fillStyle = fl ? '#ffffff' : '#c89a70'; ellipse(ctx, 0, 0, r * 0.42, r * 0.62); ctx.fill();
      ctx.fillStyle = '#a3271d'; ellipse(ctx, 0, -r * 0.42, r * 0.38, r * 0.26); ctx.fill();
      ctx.fillStyle = '#e8c8a0'; circle(ctx, 0, -r * 0.3, r * 0.24); ctx.fill();
      ctx.fillStyle = '#2a1408'; circle(ctx, 2, -r * 0.32, 1.1); ctx.fill(); circle(ctx, -2, -r * 0.32, 1.1); ctx.fill();
      ctx.fillStyle = '#e8b040'; ctx.fillRect(-3, r * 0.5, 2, 4); ctx.fillRect(1, r * 0.5, 2, 4);
    } else {
      ctx.fillStyle = fl ? '#ffffff' : '#4a3860'; ellipse(ctx, 0, 0, r * 0.45, r * 0.58); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-4, -r * 0.4); ctx.lineTo(-2.5, -r * 0.85); ctx.lineTo(-0.5, -r * 0.45);
      ctx.moveTo(4, -r * 0.4); ctx.lineTo(2.5, -r * 0.85); ctx.lineTo(0.5, -r * 0.45); ctx.fill();
      ctx.fillStyle = '#ffd23b'; circle(ctx, 2.6, -r * 0.18, 1.5); ctx.fill(); circle(ctx, -1.2, -r * 0.18, 1.5); ctx.fill();
    }
    ctx.restore();
  },

  enemy(ctx, e) {
    if (e.root > 0) {                                                       // 속박 표시
      ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 2.5; ellipse(ctx, e.x, e.y + 4, e.radius + 2, (e.radius + 2) * 0.5); ctx.stroke();
      ctx.strokeStyle = '#c9ccd2'; ctx.lineWidth = 1.5; ellipse(ctx, e.x, e.y + 4, e.radius + 6, (e.radius + 6) * 0.5); ctx.stroke();
    }
    if (e.slowTimer > 0) {                                                  // 둔화 표시
      ctx.strokeStyle = 'rgba(170,130,255,0.75)'; ctx.lineWidth = 2;
      ellipse(ctx, e.x, e.y + 3, e.radius + 4, (e.radius + 4) * 0.5); ctx.stroke();
    }
    if (e.post) { ctx.strokeStyle = 'rgba(200,40,30,0.75)'; ctx.lineWidth = 2; ellipse(ctx, e.x, e.y + 4, e.radius + 3, (e.radius + 3) * 0.5); ctx.stroke(); }   // 수비병 표시
    if (e.boss && !e.air) { ctx.strokeStyle = `rgba(255,200,80,${0.6 + Math.sin(e.anim * 5) * 0.3})`; ctx.lineWidth = 3; ellipse(ctx, e.x, e.y + 5, e.radius + 6, (e.radius + 6) * 0.5); ctx.stroke(); }
    if (e.auraT > 0 && !e.boss) { ctx.fillStyle = 'rgba(255,60,30,0.22)'; ellipse(ctx, e.x, e.y + 3, e.radius + 5, (e.radius + 5) * 0.55); ctx.fill(); }   // 족장 오라
    if (e.frenzyT > 0) { ctx.strokeStyle = `rgba(255,70,40,${0.55 + Math.sin(e.anim * 12) * 0.3})`; ctx.lineWidth = 2.5; ellipse(ctx, e.x, e.y + 3, e.radius + 7, (e.radius + 7) * 0.55); ctx.stroke(); }   // 광란
    const T = e.type;
    if (T === 'spider' || T === 'spiderQueen') this.spider(ctx, e);
    else if (T === 'bat' || T === 'harpy') this.bat(ctx, e);
    else if (T === 'dragon') this.dragon(ctx, e);
    else if (T === 'wolf' || T === 'wolfKing') this.wolf(ctx, e);
    else if (T === 'slime' || T === 'slimeling' || T === 'slimeKing') this.slime(ctx, e);
    else if (T === 'ghost') this.ghost(ctx, e);
    else if (T === 'golem' || T === 'stoneGiant') this.golem(ctx, e);
    else this.humanoid(ctx, e);
    const top = e.y - (e.air ? AIR_HEIGHT : 0) - e.radius - 14;
    if (e.stun > 0) this.stunStars(ctx, e.x, top + 2, e.anim);
    else if (e.taunt > 0) { ctx.fillStyle = '#ff4a3a'; circle(ctx, e.x, top - 2, 5.5); ctx.fill(); txt(ctx, '!', e.x, top - 1.5, 9, '#fff', 'center', { weight: 900 }); }
  },

  // ---- 보스 스킬 예고 표시 (바닥) ----
  telegraph(ctx, g, rt) {
    const p = clamp(g.t / g.delay, 0, 1), pulse = 0.5 + 0.5 * Math.sin(rt * 14);
    if (g.charge) { ctx.fillStyle = `rgba(${g.color},${0.2 + pulse * 0.25})`; circle(ctx, g.x, g.y - 24, g.r * (0.5 + p * 0.7)); ctx.fill(); return; }   // 시전 빛
    if (g.shape === 'line') {
      const a = Math.atan2(g.y2 - g.y, g.x2 - g.x), L = dist(g.x, g.y, g.x2, g.y2);
      ctx.save(); ctx.translate(g.x, g.y); ctx.rotate(a);
      ctx.fillStyle = `rgba(${g.color},${0.12 + pulse * 0.1})`; ctx.fillRect(0, -g.w / 2, L, g.w);
      ctx.fillStyle = `rgba(${g.color},0.32)`; ctx.fillRect(0, -g.w / 2, L * p, g.w);
      ctx.strokeStyle = `rgba(${g.color},0.9)`; ctx.lineWidth = 2.5; ctx.setLineDash([10, 7]); ctx.strokeRect(0, -g.w / 2, L, g.w); ctx.setLineDash([]);
      ctx.fillStyle = `rgba(${g.color},0.8)`;
      for (let i = 1; i <= 3; i++) { const x = L * i / 4; ctx.beginPath(); ctx.moveTo(x + 10, 0); ctx.lineTo(x - 6, -g.w * 0.3); ctx.lineTo(x - 6, g.w * 0.3); ctx.closePath(); ctx.fill(); }
      ctx.restore(); return;
    }
    ctx.fillStyle = `rgba(${g.color},${0.1 + pulse * 0.08})`; ellipse(ctx, g.x, g.y, g.r, g.r * 0.8); ctx.fill();
    ctx.fillStyle = `rgba(${g.color},0.3)`; ellipse(ctx, g.x, g.y, g.r * p, g.r * 0.8 * p); ctx.fill();
    ctx.strokeStyle = `rgba(${g.color},0.9)`; ctx.lineWidth = 2.5; ctx.setLineDash([9, 6]); ellipse(ctx, g.x, g.y, g.r, g.r * 0.8); ctx.stroke(); ctx.setLineDash([]);
    if (g.web) {
      ctx.strokeStyle = 'rgba(245,245,245,0.5)'; ctx.lineWidth = 1.2;
      for (let i = 0; i < 8; i++) { const a = i / 8 * TAU; ctx.beginPath(); ctx.moveTo(g.x, g.y); ctx.lineTo(g.x + Math.cos(a) * g.r, g.y + Math.sin(a) * g.r * 0.8); ctx.stroke(); }
    }
  },
  // 예고 표시 위에 그리는 것: 떨어지는 불덩이 / 날아가는 거미줄
  telegraphTop(ctx, g, rt) {
    const p = clamp(g.t / g.delay, 0, 1);
    if (g.meteor) {
      const z = (1 - p) * 360, mx = g.x + z * 0.35, my = g.y - z;
      ctx.fillStyle = 'rgba(255,140,40,0.35)'; circle(ctx, mx, my, 16); ctx.fill();
      ctx.fillStyle = '#ff7a2a'; circle(ctx, mx, my, 10); ctx.fill();
      ctx.fillStyle = '#ffe08a'; circle(ctx, mx - 2, my - 2, 5); ctx.fill();
    } else if (g.web && g.from && p < 0.75) {
      const q = p / 0.75, x = lerp(g.from.x, g.x, q), y = lerp(g.from.y, g.y, q) - Math.sin(q * Math.PI) * 50;
      ctx.strokeStyle = 'rgba(240,240,240,0.5)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(g.from.x, g.from.y); ctx.quadraticCurveTo((g.from.x + x) / 2, Math.min(g.from.y, y) - 30, x, y); ctx.stroke();
      ctx.fillStyle = '#f4f4f4'; circle(ctx, x, y, 7); ctx.fill();
      ctx.strokeStyle = '#bdbdbd'; ctx.lineWidth = 1; for (let i = 0; i < 4; i++) { const a = i / 4 * Math.PI; ctx.beginPath(); ctx.moveTo(x - Math.cos(a) * 9, y - Math.sin(a) * 9); ctx.lineTo(x + Math.cos(a) * 9, y + Math.sin(a) * 9); ctx.stroke(); }
    }
  },
  // 독 웅덩이 등 바닥 위험 지역
  hazard(ctx, z, rt) {
    const f = Math.min(1, z.t * 3) * Math.min(1, (z.dur - z.t) * 2);
    ctx.globalAlpha = f;
    ctx.fillStyle = `rgba(${z.color},0.32)`; ellipse(ctx, z.x, z.y, z.r, z.r * 0.8); ctx.fill();
    ctx.fillStyle = `rgba(${z.color},0.25)`; ellipse(ctx, z.x, z.y, z.r * 0.65, z.r * 0.5); ctx.fill();
    ctx.fillStyle = 'rgba(200,255,140,0.5)';
    for (let i = 0; i < 7; i++) { const a = i * 2.4 + rt * 0.6, r = z.r * (0.25 + (i % 3) * 0.2); circle(ctx, z.x + Math.cos(a) * r, z.y + Math.sin(a) * r * 0.8, 2 + ((rt * 3 + i) % 1) * 3); ctx.fill(); }
    ctx.globalAlpha = 1;
  },
  // 영웅 상태 표시 (묶임 / 기절)
  status(ctx, u, rt) {
    this.supAura(ctx, u, rt);
    if (u.root > 0) { ctx.strokeStyle = 'rgba(240,240,240,0.85)'; ctx.lineWidth = 1.4; for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.arc(u.x, u.y + 2, u.radius + 3 + i * 2.2, i * 1.3, i * 1.3 + 2.6); ctx.stroke(); } }
    if (u.stun > 0) this.stunStars(ctx, u.x, u._top != null ? u._top - 18 : u.y - u.radius - 22, rt);
  },

  stunStars(ctx, x, y, t) {
    for (let i = 0; i < 3; i++) {
      const a = t * 6 + (i / 3) * TAU, sx = x + Math.cos(a) * 9, sy = y + Math.sin(a) * 3;
      ctx.fillStyle = '#ffe25a'; ctx.beginPath();
      for (let j = 0; j < 10; j++) { const r = j % 2 ? 1.4 : 3.4, b = (j / 10) * TAU - Math.PI / 2; ctx.lineTo(sx + Math.cos(b) * r, sy + Math.sin(b) * r); }
      ctx.closePath(); ctx.fill();
    }
  },

  // ---------------- 영웅 ----------------
  hero(ctx, h, t) {
    if (h.dead) { this.tombstone(ctx, h); return; }
    const x = h.x, y = h.y;
    if (h.buffs.warcry > 0) {                                    // 도발의 함성 오라
      const p = 0.5 + Math.sin(t * 10) * 0.5;
      ctx.strokeStyle = `rgba(255,110,60,${0.45 + p * 0.35})`; ctx.lineWidth = 3;
      ellipse(ctx, x, y + 6, 31 + p * 3, 15 + p * 1.5); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(255,215,90,0.85)'; ctx.lineWidth = 2; ellipse(ctx, x, y + 9, 23, 10); ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ellipse(ctx, x + 2, y + 9, 19, 8); ctx.fill();
    const sp = Sprites.get('hero_' + h.type);
    if (sp) { const H = 74; this.sprite(ctx, sp, x, y + 9, H, this.spriteMotion(h, t)); h._top = y + 9 - H; return; }
    h._top = null;
    const bob = h.moving ? Math.sin(h.walkAnim * 12) * 1.4 : 0;
    if (h.type !== 'knight') {                                   // 궁사·마법사
      if (!this.img(ctx, h.type + 'Hero', x, y + bob, 50, 50, h.face)) (h.type === 'archer' ? this.heroArcher : this.heroMage).call(this, ctx, h, x, y + bob, t);
      return;
    }
    if (this.img(ctx, 'knight', x, y + bob, 50, 50, h.face)) return;
    ctx.save(); ctx.translate(x, y + bob); ctx.scale(1.25, 1.25); ctx.rotate(h.face);
    const fl = h.flash > 0;
    ctx.fillStyle = '#23407f'; ellipse(ctx, -8, 0, 9, 13.5); ctx.fill();                    // 망토
    ctx.fillStyle = fl ? '#ffffff' : '#c3c8d0'; ellipse(ctx, 0, 0, 11, 13.5); ctx.fill();   // 갑옷
    ctx.fillStyle = '#2f5fb3'; ctx.fillRect(-5, -9, 10, 18);                                 // 문장 겉옷
    ctx.fillStyle = '#f2c94c'; ctx.fillRect(-1, -6, 2, 12); ctx.fillRect(-4, -1, 8, 2);
    let sw;                                                                                   // 칼 휘두르기
    if (h.attackAnim > 0) sw = lerp(-1.7, 1.1, 1 - h.attackAnim / 0.25);
    else if (h.dash) sw = 0.9;
    else sw = 0.35 + (h.moving ? Math.sin(h.walkAnim * 12) * 0.15 : 0);
    ctx.save(); ctx.translate(3, 11); ctx.rotate(sw);
    ctx.fillStyle = '#d6dbe2'; ctx.beginPath(); ctx.moveTo(6, -1.6); ctx.lineTo(25, -1); ctx.lineTo(28, 0); ctx.lineTo(25, 1); ctx.lineTo(6, 1.6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#c9a23a'; ctx.fillRect(4, -4, 2.5, 8); ctx.fillStyle = '#5a3a1c'; ctx.fillRect(0, -1.3, 4.5, 2.6);
    ctx.restore();
    ctx.save(); ctx.translate(5, -11); ctx.rotate(h.attackAnim > 0 ? -0.2 : 0.15);       // 방패
    ctx.fillStyle = '#2a4f9e'; ctx.strokeStyle = '#e8c35a'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(-6, -4); ctx.lineTo(6, -4); ctx.lineTo(6, 3); ctx.quadraticCurveTo(0, 8, -6, 3); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = '#9aa1ab'; circle(ctx, 0, 0, 7.2); ctx.fill();                          // 투구
    ctx.fillStyle = '#c4c9d1'; circle(ctx, -1.5, -1.5, 3.2); ctx.fill();
    ctx.fillStyle = '#2b2e33'; ctx.fillRect(4, -3.2, 2.4, 6.4);
    ctx.fillStyle = '#c0392b'; ellipse(ctx, -7, 0, 6, 2.6); ctx.fill();                      // 깃털 장식
    ctx.restore();
  },

  heroArcher(ctx, h, x, y) {
    const fl = h.flash > 0, pull = h.attackAnim > 0 ? h.attackAnim / 0.25 : 0;
    ctx.save(); ctx.translate(x, y); ctx.scale(1.2, 1.2); ctx.rotate(h.face);
    ctx.fillStyle = '#25502a'; ellipse(ctx, -7, 0, 8, 12.5); ctx.fill();                                // 망토
    ctx.fillStyle = '#6b4220'; ctx.save(); ctx.translate(-6, -7); ctx.rotate(-0.5); ctx.fillRect(-2.5, -6, 5, 12);   // 화살통
    ctx.fillStyle = '#f2efe6'; ctx.fillRect(-2.5, -8, 1.6, 2.5); ctx.fillRect(0.8, -8, 1.6, 2.5); ctx.restore();
    ctx.fillStyle = fl ? '#ffffff' : '#3f7a3a'; ellipse(ctx, 0, 0, 9, 11.5); ctx.fill();                // 몸
    ctx.fillStyle = '#7a5a32'; ctx.fillRect(-2, -10, 3, 20);
    ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';                             // 장궁
    ctx.beginPath(); ctx.arc(3, 0, 15, -1.15, 1.15); ctx.stroke();
    const tipX = 3 + Math.cos(1.15) * 15, tipY = Math.sin(1.15) * 15, nock = tipX - 6 - pull * 6;
    ctx.strokeStyle = '#efe7d0'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(tipX, -tipY); ctx.lineTo(nock, 0); ctx.lineTo(tipX, tipY); ctx.stroke();
    if (pull > 0) { ctx.strokeStyle = '#5b3b1c'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(nock, 0); ctx.lineTo(20, 0); ctx.stroke(); }
    ctx.fillStyle = '#2f5a2a'; circle(ctx, -0.5, 0, 6.6); ctx.fill();                                    // 두건
    ctx.fillStyle = '#e2b48c'; circle(ctx, 2.6, 0, 3.2); ctx.fill();
    ctx.restore();
  },

  heroMage(ctx, h, x, y, t) {
    const fl = h.flash > 0, glow = 0.6 + Math.sin(t * 5) * 0.2 + (h.attackAnim > 0 ? h.attackAnim * 2 : 0);
    ctx.save(); ctx.translate(x, y); ctx.scale(1.2, 1.2); ctx.rotate(h.face);
    ctx.fillStyle = fl ? '#ffffff' : '#3a3f9e'; ellipse(ctx, -1, 0, 10.5, 13); ctx.fill();             // 로브
    ctx.strokeStyle = '#e8c35a'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';                             // 지팡이
    ctx.beginPath(); ctx.moveTo(-6, 10); ctx.lineTo(16, 10); ctx.stroke();
    ctx.fillStyle = `rgba(127,208,255,${0.35 * glow})`; circle(ctx, 17, 10, 6 + glow * 3); ctx.fill();
    ctx.fillStyle = '#bfe8ff'; circle(ctx, 17, 10, 3.4); ctx.fill();
    ctx.fillStyle = '#26296e'; circle(ctx, 0, 0, 10); ctx.fill();                                        // 모자 챙
    ctx.fillStyle = '#3a3f9e'; circle(ctx, -1.5, 0, 6.6); ctx.fill();                                    // 뾰족 모자 (위에서 본 모습)
    ctx.fillStyle = '#4a50b8'; circle(ctx, -3, 0, 3.2); ctx.fill();
    ctx.fillStyle = '#ffe08a'; ctx.beginPath();
    for (let j = 0; j < 10; j++) { const r = j % 2 ? 1 : 2.6, b = (j / 10) * TAU; ctx.lineTo(3 + Math.cos(b) * r, -3 + Math.sin(b) * r); }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  },

  // ---------------- 영웅 스킬 효과 ----------------
  zoneGround(ctx, z) {
    const fade = clamp(Math.min((z.dur - z.t) / 0.4, z.t / 0.15), 0, 1);
    ctx.save(); ctx.globalAlpha = fade;
    if (z.kind === 'arrowRain') {
      ctx.fillStyle = 'rgba(120,80,40,0.14)'; ellipse(ctx, z.x, z.y, z.r, z.r * 0.8); ctx.fill();
      ctx.setLineDash([8, 6]); ctx.strokeStyle = 'rgba(255,220,140,0.85)'; ctx.lineWidth = 2; ctx.stroke();
    } else {
      const g = ctx.createRadialGradient(z.x, z.y, z.r * 0.1, z.x, z.y, z.r);
      g.addColorStop(0, 'rgba(210,240,255,0.42)'); g.addColorStop(1, 'rgba(140,200,255,0.14)');
      ctx.fillStyle = g; ellipse(ctx, z.x, z.y, z.r, z.r * 0.8); ctx.fill();
      ctx.strokeStyle = 'rgba(210,245,255,0.8)'; ctx.lineWidth = 2; ctx.stroke();
      for (let i = 0; i < 7; i++) {                                                  // 얼음 결정
        const a = i * 2.399 + z.seed, r = ((i * 0.618 + z.seed) % 1) * z.r * 0.85, px = z.x + Math.cos(a) * r, py = z.y + Math.sin(a) * r * 0.8;
        ctx.fillStyle = 'rgba(230,248,255,0.7)'; ctx.beginPath(); ctx.moveTo(px, py - 6); ctx.lineTo(px + 3, py); ctx.lineTo(px, py + 6); ctx.lineTo(px - 3, py); ctx.closePath(); ctx.fill();
      }
    }
    ctx.restore();
  },
  zoneTop(ctx, z) {
    const fade = clamp(Math.min((z.dur - z.t) / 0.4, z.t / 0.15), 0, 1);
    ctx.save(); ctx.globalAlpha = fade;
    if (z.kind === 'arrowRain') {                                                    // 떨어지는 화살들
      ctx.strokeStyle = '#4a3018'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
      for (let i = 0; i < 22; i++) {
        const ph = (z.t * 2.4 + i * 0.137 + z.seed) % 1, a = (i * 2.399 + z.seed) % TAU, r = Math.sqrt((i * 0.618 + z.seed) % 1) * z.r;
        const gx = z.x + Math.cos(a) * r, gy = z.y + Math.sin(a) * r * 0.8, hgt = (1 - ph) * 140;
        ctx.beginPath(); ctx.moveTo(gx - hgt * 0.12, gy - hgt - 12); ctx.lineTo(gx - hgt * 0.12 + 1.5, gy - hgt); ctx.stroke();
      }
    } else {                                                                          // 휘날리는 눈
      for (let i = 0; i < 30; i++) {
        const a = i * 2.399 + z.t * (0.8 + (i % 3) * 0.35), r = ((i * 0.618 + z.seed) % 1) * z.r;
        const px = z.x + Math.cos(a) * r, py = z.y + Math.sin(a) * r * 0.8 - ((z.t * 35 + i * 13) % 34);
        ctx.fillStyle = 'rgba(255,255,255,0.85)'; circle(ctx, px, py, 1.4 + (i % 3) * 0.6); ctx.fill();
      }
    }
    ctx.restore();
  },
  trap(ctx, tr) {
    ctx.save(); if (tr.life < 4) ctx.globalAlpha = 0.5 + Math.sin(tr.anim * 10) * 0.3;
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ellipse(ctx, tr.x + 1, tr.y + 2, tr.r * 0.8, tr.r * 0.45); ctx.fill();
    ctx.strokeStyle = '#6f727a'; ctx.lineWidth = 3; ellipse(ctx, tr.x, tr.y, tr.r * 0.72, tr.r * 0.44); ctx.stroke();
    ctx.fillStyle = '#c9ccd2';
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * TAU, ox = tr.x + Math.cos(a) * tr.r * 0.72, oy = tr.y + Math.sin(a) * tr.r * 0.44;
      ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox - Math.cos(a) * 6 - Math.sin(a) * 2, oy - Math.sin(a) * 4 + Math.cos(a) * 1.5); ctx.lineTo(ox - Math.cos(a) * 6 + Math.sin(a) * 2, oy - Math.sin(a) * 4 - Math.cos(a) * 1.5); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = '#5a5650'; circle(ctx, tr.x, tr.y, 3.5); ctx.fill();
    ctx.restore();
  },
  fireball(ctx, p) {
    if (p.landed) return;
    ctx.fillStyle = 'rgba(0,0,0,0.2)'; ellipse(ctx, p.x, p.y + 3, 7, 3); ctx.fill();
    const y = p.y - p.z;
    ctx.fillStyle = 'rgba(255,140,40,0.45)'; circle(ctx, p.x, y, 12); ctx.fill();
    ctx.fillStyle = '#ff8a2a'; circle(ctx, p.x, y, 7); ctx.fill();
    ctx.fillStyle = '#ffe27a'; circle(ctx, p.x, y, 3.8); ctx.fill();
  },

  tombstone(ctx, h) {
    const x = h.deathX, y = h.deathY;
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ellipse(ctx, x + 2, y + 8, 13, 5); ctx.fill();
    ctx.fillStyle = '#8d8a84'; ctx.beginPath(); ctx.moveTo(x - 9, y + 8); ctx.lineTo(x - 9, y - 6); ctx.arc(x, y - 6, 9, Math.PI, 0); ctx.lineTo(x + 9, y + 8); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#6c6963'; ctx.fillRect(x - 1.2, y - 10, 2.4, 11); ctx.fillRect(x - 4.5, y - 7, 9, 2.4);
    txt(ctx, Math.ceil(h.respawnTimer) + '', x, y - 26, 16, '#ffd36b', 'center', { stroke: 'rgba(0,0,0,0.85)', weight: 900 });
  },

  heroBar(ctx, h) {
    if (h.dead) return;
    const w = 44, x = h.x - w / 2 + 7, y = h._top != null ? h._top - 12 : h.y - 40;
    bar(ctx, x, y, w, 6, h.hp / h.maxHp, '#5cd04a');
    if (h.maxMana) bar(ctx, x, y + 6, w, 4, h.mana / h.maxMana, '#4a8cff');
    ctx.fillStyle = '#2a1d10'; circle(ctx, x - 7, y + 3, 7.5); ctx.fill();
    ctx.strokeStyle = '#e8c35a'; ctx.lineWidth = 1.2; ctx.stroke();
    txt(ctx, h.level + '', x - 7, y + 3.5, 10, '#ffe7a8', 'center', { weight: 900 });
  },

  rallyFlag(ctx, p, t) {
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ellipse(ctx, p.x, p.y + 2, 7, 3); ctx.fill();
    ctx.strokeStyle = '#4a3220'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(p.x, p.y + 2); ctx.lineTo(p.x, p.y - 22); ctx.stroke();
    const w = Math.sin(t * 6) * 2;
    ctx.fillStyle = '#ffd36b'; ctx.beginPath(); ctx.moveTo(p.x, p.y - 22); ctx.lineTo(p.x + 14, p.y - 18 + w); ctx.lineTo(p.x, p.y - 13); ctx.closePath(); ctx.fill();
  },

  // 방향 지정 스킬 조준 미리보기
  aimPreview(ctx, h, aim, hover, t) {
    const sk = h.cfg.skills[aim.skill], R = sk.distance || sk.range || 200;
    if (sk.target === 'point') {                                                     // 위치 지정: 사거리 원 + 효과 범위
      ctx.save();
      ctx.setLineDash([8, 8]); ctx.lineDashOffset = -t * 30; ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,220,120,0.6)';
      circle(ctx, h.x, h.y, sk.range); ctx.stroke();
      if (hover) {
        let px = hover.x, py = hover.y; const d = dist(h.x, h.y, px, py);
        if (d > sk.range) { px = h.x + (px - h.x) / d * sk.range; py = h.y + (py - h.y) / d * sk.range; }
        if (sk.id === 'trap') { const q = nearestPathPoint(px, py); px = q.x; py = q.y; }
        const col = { fireball: '255,140,60', blizzard: '160,220,255', arrowRain: '255,210,140', trap: '220,220,220' }[sk.id] || '255,220,120';
        ctx.setLineDash([]); ctx.fillStyle = `rgba(${col},0.22)`; ellipse(ctx, px, py, sk.radius, sk.radius * (sk.id === 'trap' ? 0.6 : 0.8)); ctx.fill();
        ctx.strokeStyle = `rgba(${col},0.95)`; ctx.lineWidth = 2.5; ctx.stroke();
      }
      ctx.restore();
      return;
    }
    ctx.save();
    ctx.setLineDash([8, 8]); ctx.lineDashOffset = -t * 30; ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255,220,120,0.7)'; circle(ctx, h.x, h.y, R); ctx.stroke();
    ctx.fillStyle = 'rgba(255,220,120,0.07)'; ctx.fill();
    if (hover) {
      const a = Math.atan2(hover.y - h.y, hover.x - h.x), ex = h.x + Math.cos(a) * R, ey = h.y + Math.sin(a) * R;
      ctx.setLineDash([]); ctx.strokeStyle = 'rgba(255,200,80,0.85)'; ctx.lineWidth = (sk.width || 20);
      ctx.globalAlpha = 0.25; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(h.x, h.y); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.globalAlpha = 1; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(h.x, h.y); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.fillStyle = '#ffc850'; ctx.beginPath();
      ctx.moveTo(ex + Math.cos(a) * 12, ey + Math.sin(a) * 12);
      ctx.lineTo(ex + Math.cos(a + 2.4) * 12, ey + Math.sin(a + 2.4) * 12);
      ctx.lineTo(ex + Math.cos(a - 2.4) * 12, ey + Math.sin(a - 2.4) * 12); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  },

  enemyBar(ctx, e) {
    if (e.hp >= e.maxHp || e.boss) return;          // 보스는 화면 위 큰 체력바
    const w = e.radius * 2.4, y = e.y - (e.air ? AIR_HEIGHT : 0) - e.radius - 10;
    bar(ctx, e.x - w / 2, y, w, 5, e.hp / e.maxHp, '#e04a3a');
  },

  carpenter(ctx, c) {
    ctx.fillStyle = 'rgba(0,0,0,0.28)'; ellipse(ctx, c.x + 1, c.y + 8, 12, 5); ctx.fill();
    if (this.img(ctx, 'carpenter', c.x, c.y, this.SIZES.carpenter, this.SIZES.carpenter, c.face)) return;
    ctx.save(); ctx.translate(c.x, c.y); ctx.scale(1.35, 1.35); ctx.rotate(c.face);
    let arm;
    if (c.state === 'work') {
      const s = ((c.phase * 9) % TAU) / TAU;
      arm = s < 0.75 ? lerp(0.35, -1.4, s / 0.75) : lerp(-1.4, 0.35, (s - 0.75) / 0.25);
    } else arm = Math.sin(c.walk * 10) * 0.4 - 0.3;
    ctx.fillStyle = '#8b6a3e'; ellipse(ctx, 0, 0, 8, 10); ctx.fill();
    ctx.fillStyle = '#c9b48a'; ellipse(ctx, 2.5, 0, 4.5, 7); ctx.fill();
    ctx.save(); ctx.translate(1, 7); ctx.rotate(arm);
    ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(13, 0); ctx.stroke();
    ctx.fillStyle = '#7d8088'; ctx.fillRect(11, -4.5, 5, 9);
    ctx.restore();
    ctx.fillStyle = '#e2b48c'; circle(ctx, -0.5, 0, 5.5); ctx.fill();
    ctx.fillStyle = '#5a3d22'; ctx.beginPath(); ctx.arc(-0.5, 0, 5.6, Math.PI * 0.55, Math.PI * 1.45); ctx.fill();
    ctx.restore();
  },

  wallArcher(ctx, a) {
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ellipse(ctx, a.x + 2, a.y + 4, 10, 6); ctx.fill();
    if (this.img(ctx, 'wallArcher', a.x, a.y, this.SIZES.wallArcher, this.SIZES.wallArcher, a.aim)) return;
    this.archerFigure(ctx, a.x, a.y, a.aim, a.shootAnim > 0 ? a.shootAnim / 0.18 : 0, '#2f5fa8', 1);
  },

  // 활 든 궁수 (성벽 궁수·궁수탑 공용)
  archerFigure(ctx, x, y, aim, pull, color, s) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(aim);
    ctx.fillStyle = color; ellipse(ctx, 0, 0, 8, 10.5); ctx.fill();
    ctx.fillStyle = '#e8c35a'; ctx.fillRect(-2, -10, 3, 20);
    ctx.strokeStyle = '#7a4a1f'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(3, 0, 11, -1.15, 1.15); ctx.stroke();
    const tipX = 3 + Math.cos(1.15) * 11, tipY = Math.sin(1.15) * 11;
    ctx.strokeStyle = '#efe7d0'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(tipX, -tipY); ctx.lineTo(tipX - 5 - (1 - pull) * 4, 0); ctx.lineTo(tipX, tipY); ctx.stroke();
    ctx.fillStyle = '#b9bcc2'; circle(ctx, -1, 0, 6); ctx.fill();
    ctx.fillStyle = '#8d9097'; ctx.fillRect(2.5, -1, 3.5, 2);
    ctx.restore();
  },

  soldier(ctx, s, rt) {
    const L = s.level, bob = s.moving ? Math.sin(s.walkAnim * (s.kind === 'knight' ? 16 : 12)) * 1.2 : 0;
    const horse = s.kind === 'knight';
    ctx.fillStyle = 'rgba(0,0,0,0.26)'; ellipse(ctx, s.x + 1, s.y + 6, s.radius * (horse ? 1.5 : 1.05), s.radius * 0.55); ctx.fill();
    if (s.root > 0) { ctx.strokeStyle = 'rgba(235,235,235,0.8)'; ctx.lineWidth = 1.2; for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(s.x, s.y + 2, s.radius + 2 + i * 2, i, i + 2.4); ctx.stroke(); } }
    this.supAura(ctx, s, rt);
