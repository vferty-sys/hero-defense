    const sp = Sprites.unit(s.kind, s.level);
    s._top = null;
    if (sp) { const H = s.kind === 'knight' ? 58 : 46; this.sprite(ctx, sp, s.x, s.y + 6, H, this.spriteMotion(s, rt)); s._top = s.y + 6 - H; }
    else if (!this.img(ctx, s.kind + L, s.x, s.y + bob, s.radius * 3, s.radius * 3, s.face)) {
      if (s.kind === 'archer') {
        const L = tierOf(s.level);
        const cloak = ['#6b7f3a', '#3f6a3a', '#2c5b45'][L - 1];
        this.archerFigure(ctx, s.x, s.y + bob, s.face, s.attackAnim > 0 ? s.attackAnim / 0.25 : 0, s.flash > 0 ? '#ffffff' : cloak, 0.85);
        if (L === 3) { ctx.fillStyle = '#e8c35a'; circle(ctx, s.x, s.y + bob, 2); ctx.fill(); }
      } else if (s.kind === 'mage') this.mageSoldier(ctx, s, s.x, s.y + bob, rt);
      else if (s.kind === 'cleric') this.clericSoldier(ctx, s, s.x, s.y + bob, rt);
      else this.swordsman(ctx, s, s.x, s.y + bob, horse);
    }
    const stars = s.level >= CONFIG.army.passiveLevel ? 2 : s.level >= CONFIG.army.skillLevel ? 1 : 0;   // 5레벨 ★ (자동 스킬) / 10레벨 ★★ (패시브)
    for (let i = 0; i < stars; i++) {
      const px = s.x - (stars - 1) * 4 + i * 8, py = s._top != null ? s._top - 3 : s.y - s.radius - 7;
      ctx.fillStyle = '#ffd84a'; ctx.strokeStyle = 'rgba(60,30,0,0.8)'; ctx.lineWidth = 1; ctx.beginPath();
      for (let j = 0; j < 10; j++) { const a = -Math.PI / 2 + j * Math.PI / 5, r = j % 2 ? 1.6 : 3.8; ctx.lineTo(px + Math.cos(a) * r, py + Math.sin(a) * r); }
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    if (s.stun > 0) this.stunStars(ctx, s.x, s._top != null ? s._top - 8 : s.y - s.radius - 8, rt);
  },
  // 보병 / 기사(말 탄 모습): 레벨에 따라 장비가 바뀜 (가죽 → 사슬 → 판금·금장식)
  swordsman(ctx, s, x, y, horse) {
    const L = tierOf(s.level), sc = horse ? 1.05 : 1;
    ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc); ctx.rotate(s.face);
    if (horse) {                                                                                         // 말
      const coat = s.flash > 0 ? '#ffffff' : ['#7a5230', '#4a3628', '#e6e0d4'][L - 1], mane = ['#3a2614', '#1e140c', '#b8b0a0'][L - 1];
      const gait = s.moving ? Math.sin(s.walkAnim * 16) * 1.5 : 0;
      ctx.fillStyle = coat; ellipse(ctx, -2, 0, 15, 7.5); ctx.fill();                                     // 몸통
      ellipse(ctx, 14 + gait * 0.4, 0, 6.5, 4); ctx.fill();                                                // 머리
      ctx.fillStyle = mane; ctx.fillRect(4, -1.4, 9, 2.8); ellipse(ctx, -17, 0, 4, 2 + Math.abs(gait) * 0.3); ctx.fill();   // 갈기·꼬리
      ctx.fillStyle = L === 3 ? '#e8c35a' : '#a3271d'; ctx.fillRect(-9, -8, 9, 16);                       // 안장 천
      ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(-9, -8, 9, 2); ctx.fillRect(-9, 6, 9, 2);
      ctx.translate(-4, 0);
    }
    const armor = horse ? ['#b8bec7', '#c9ced6', '#e2c46a'][L - 1] : ['#8a6a3e', '#a2a8b0', '#d0d5dc'][L - 1];
    const tabard = horse ? '#a3271d' : L >= 2 ? '#2f5fb3' : null;
    ctx.fillStyle = s.flash > 0 ? '#ffffff' : armor; ellipse(ctx, 0, 0, 8, 10); ctx.fill();
    if (tabard) { ctx.fillStyle = tabard; ctx.fillRect(-4, -7, 8, 14); }
    if (horse || L === 3) { ctx.fillStyle = '#f2c94c'; ctx.fillRect(-0.8, -5, 1.6, 10); }
    const sw = s.attackAnim > 0 ? lerp(-1.6, 1.0, 1 - s.attackAnim / 0.25) : 0.35;                   // 칼 / 기사는 창
    ctx.save(); ctx.translate(2, 8); ctx.rotate(horse ? sw * 0.5 : sw);
    ctx.fillStyle = horse ? '#8a6a3a' : '#d6dbe2'; ctx.fillRect(4, -1.2, horse ? 24 : 14, 2.4);
    if (horse) { ctx.fillStyle = '#d6dbe2'; ctx.beginPath(); ctx.moveTo(28, -2.6); ctx.lineTo(34, 0); ctx.lineTo(28, 2.6); ctx.closePath(); ctx.fill(); }
    ctx.fillStyle = '#8a6a2a'; ctx.fillRect(2, -3, 2, 6); ctx.restore();
    ctx.save(); ctx.translate(4, -8);                                                                   // 방패
    if (horse) { ctx.fillStyle = '#a3271d'; ctx.strokeStyle = '#f2c94c'; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.moveTo(-5, -3.5); ctx.lineTo(5, -3.5); ctx.lineTo(5, 2); ctx.quadraticCurveTo(0, 7, -5, 2); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    else { ctx.fillStyle = ['#7a5230', '#6e5034', '#2f5fb3'][L - 1]; circle(ctx, 0, 0, 5.2); ctx.fill(); ctx.strokeStyle = ['#4a3018', '#9aa0a8', '#f2c94c'][L - 1]; ctx.lineWidth = 1.5; ctx.stroke(); }
    ctx.restore();
    const helm = horse ? '#9aa1ab' : ['#6b4a2a', '#8d939b', '#aab0b8'][L - 1];                         // 투구
    ctx.fillStyle = helm; circle(ctx, 0, 0, 5.6); ctx.fill();
    if (horse || L >= 2) { ctx.fillStyle = '#2b2e33'; ctx.fillRect(3, -2.4, 1.8, 4.8); }
    if (horse || L === 3) { ctx.fillStyle = horse && L === 3 ? '#f2c94c' : '#c0392b'; ellipse(ctx, -5, 0, 4.5, 1.9); ctx.fill(); }
    ctx.restore();
  },
  // 성직자: 흰 로브 + 금빛 장식 + 빛나는 성표 지팡이
  clericSoldier(ctx, s, x, y, rt) {
    const L = tierOf(s.level), cast = s.attackAnim > 0 ? s.attackAnim / 0.4 : 0;
    if (cast > 0) { ctx.fillStyle = `rgba(255,240,170,${cast * 0.35})`; circle(ctx, x, y, 16 + (1 - cast) * 10); ctx.fill(); }
    ctx.save(); ctx.translate(x, y); ctx.rotate(s.face);
    ctx.fillStyle = s.flash > 0 ? '#ffffff' : ['#e8e4d8', '#f2eee2', '#fbf8ee'][L - 1]; ellipse(ctx, -1, 0, 7.5, 8.5); ctx.fill();
    ctx.fillStyle = ['#c8a050', '#d8b050', '#f2c94c'][L - 1]; ctx.fillRect(-1.2, -7, 2.4, 14); ctx.fillRect(-5, -1.2, 9, 2.4);   // 금빛 띠
    ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(1, 7); ctx.lineTo(13, 7); ctx.stroke();       // 지팡이
    ctx.fillStyle = `rgba(255,240,160,${0.45 + 0.3 * Math.sin(rt * 4 + s.walkAnim) + cast * 0.3})`; circle(ctx, 14, 7, 4 + cast * 2); ctx.fill();
    ctx.strokeStyle = '#ffe08a'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(14, 4.5); ctx.lineTo(14, 9.5); ctx.moveTo(11.5, 7); ctx.lineTo(16.5, 7); ctx.stroke();
    ctx.fillStyle = '#d8d2c2'; circle(ctx, 0, 0, 5.4); ctx.fill();                                                        // 두건
    ctx.fillStyle = '#f0d8b8'; circle(ctx, 2.2, 0, 2.8); ctx.fill();
    ctx.restore();
  },
  // 성직자 강화를 받는 중: 발밑에 색깔 고리 (노랑 공격 속도 · 파랑 방어력 · 빨강 공격력)
  supAura(ctx, u, rt) {
    const S = u.sup; if (!S) return;
    let i = 0;
    for (const [k, , col] of SUP_TYPES) {
      if (S[k] <= 0) continue;
      ctx.strokeStyle = `rgba(${col},${0.55 + Math.sin(rt * 5 + i) * 0.2})`; ctx.lineWidth = 1.8;
      ellipse(ctx, u.x, u.y + 5, u.radius + 3 + i * 3, (u.radius + 3 + i * 3) * 0.45); ctx.stroke(); i++;
    }
  },
  // 마법사 병사: 로브 + 뾰족 모자 + 빛나는 지팡이 (레벨에 따라 로브 색)
  mageSoldier(ctx, s, x, y, rt) {
    const L = tierOf(s.level), cast = s.attackAnim > 0 ? s.attackAnim / 0.25 : 0;
    ctx.save(); ctx.translate(x, y); ctx.rotate(s.face);
    ctx.fillStyle = s.flash > 0 ? '#ffffff' : ['#5a3f9e', '#3f4fb0', '#2a2f7a'][L - 1]; ellipse(ctx, -1, 0, 7.5, 8.5); ctx.fill();   // 로브
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ellipse(ctx, 1, -2, 4, 5); ctx.fill();
    ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.moveTo(1, 7); ctx.lineTo(13 + cast * 3, 6); ctx.stroke();   // 지팡이
    const glow = 0.5 + 0.5 * Math.sin(rt * 5 + s.walkAnim) + cast;
    ctx.fillStyle = `rgba(190,150,255,${0.25 + glow * 0.2})`; circle(ctx, 14 + cast * 3, 6, 4.5 + cast * 3); ctx.fill();
    ctx.fillStyle = L === 3 ? '#ffe08a' : '#d6b8ff'; circle(ctx, 14 + cast * 3, 6, 2.3); ctx.fill();
    ctx.fillStyle = ['#3e2a70', '#2c3888', '#1c2058'][L - 1]; circle(ctx, 0, 0, 6.2); ctx.fill();          // 모자 챙
    ctx.fillStyle = ['#5a3f9e', '#3f4fb0', '#2a2f7a'][L - 1]; circle(ctx, -1, 0, 3.8); ctx.fill();          // 모자 꼭대기
    if (L >= 2) { ctx.fillStyle = '#e8c35a'; circle(ctx, -1, 0, 1.3); ctx.fill(); }
    ctx.restore();
  },

  soldierBar(ctx, s) {
    if (s.hp >= s.maxHp) return;
    const w = s.radius * 2.6;
    bar(ctx, s.x - w / 2, s._top != null ? s._top - 7 : s.y - s.radius - 12, w, 4, s.hp / s.maxHp, '#6fd0ff');
  },

  projectile(ctx, p) {
    if (p instanceof Fireball) this.fireball(ctx, p);
    else if (p instanceof MagicBolt) this.bolt(ctx, p);
    else this.arrow(ctx, p);
  },
  bolt(ctx, p) {
    const c = p.color === 'fire' ? ['255,140,40', '#ffd08a'] : p.color ? ['127,208,255', '#bfe8ff'] : ['180,140,255', '#c9a8ff'];
    p.trail.forEach((q, i) => { ctx.fillStyle = `rgba(${c[0]},${(i + 1) / p.trail.length * 0.35})`; circle(ctx, q.x, q.y, 2 + i * 0.6); ctx.fill(); });
    ctx.fillStyle = `rgba(${c[0]},0.45)`; circle(ctx, p.x, p.y, 9); ctx.fill();
    ctx.fillStyle = c[1]; circle(ctx, p.x, p.y, 5); ctx.fill();
    ctx.fillStyle = '#ffffff'; circle(ctx, p.x, p.y, 2.2); ctx.fill();
  },

  rangeCircle(ctx, x, y, r, t, color = '255,230,140') {
    ctx.save();
    ctx.fillStyle = `rgba(${color},0.10)`; circle(ctx, x, y, r); ctx.fill();
    ctx.setLineDash([10, 8]); ctx.lineDashOffset = -t * 20; ctx.lineWidth = 2; ctx.strokeStyle = `rgba(${color},0.75)`; ctx.stroke();
    ctx.restore();
  },

  cauldron(ctx, gate, rt) {
    const x = MAP.castle.wallX + MAP.castle.wallW / 2 - 2, y = MAP.gate.y;
    ctx.fillStyle = '#26221f'; circle(ctx, x, y, 9); ctx.fill();
    const ready = gate.oilTimer < 1.2;
    ctx.fillStyle = ready ? '#ff9a3a' : '#c0602a'; circle(ctx, x, y, 6); ctx.fill();
    ctx.fillStyle = 'rgba(255,230,150,0.7)'; circle(ctx, x - 1.5, y - 1.5, 2 + Math.sin(rt * 8) * 0.6); ctx.fill();
  },

  arrow(ctx, p) {
    const x = p.x, y = p.y - p.z;
    if (this.img(ctx, 'arrow', x, y, this.SIZES.arrow, this.SIZES.arrow * 0.35, p.angle)) return;
    ctx.save(); ctx.translate(x, y); ctx.rotate(p.angle);
    ctx.strokeStyle = p.hostile ? '#2a1a10' : '#5b3b1c'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-9, 0); ctx.lineTo(6, 0); ctx.stroke();
    ctx.fillStyle = '#d8d8d8'; ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(5, -2.8); ctx.lineTo(5, 2.8); ctx.closePath(); ctx.fill();
    ctx.fillStyle = p.hostile ? '#c0392b' : '#f2efe6'; ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(-13, -3); ctx.lineTo(-7, 0); ctx.lineTo(-13, 3); ctx.closePath(); ctx.fill();
    ctx.restore();
  },
};

// UI 아이콘 (이모지 대신 도형 → 기기마다 모양이 같음)
const Icon = {
  castle(ctx, x, y, s) {
    const u = s / 12;
    ctx.fillStyle = '#bdb6a6'; ctx.fillRect(x - 5 * u, y - 3 * u, 10 * u, 8 * u);
    ctx.fillStyle = '#d6cfbe'; ctx.fillRect(x - 7 * u, y - 6 * u, 3.2 * u, 11 * u); ctx.fillRect(x + 3.8 * u, y - 6 * u, 3.2 * u, 11 * u);
    ctx.fillRect(x - 7 * u, y - 7.5 * u, 1.2 * u, 2 * u); ctx.fillRect(x - 5 * u, y - 7.5 * u, 1.2 * u, 2 * u);
    ctx.fillRect(x + 3.8 * u, y - 7.5 * u, 1.2 * u, 2 * u); ctx.fillRect(x + 5.8 * u, y - 7.5 * u, 1.2 * u, 2 * u);
    ctx.fillStyle = '#6b4424'; ctx.beginPath(); ctx.moveTo(x - 2.2 * u, y + 5 * u); ctx.lineTo(x - 2.2 * u, y + 0.5 * u);
    ctx.arc(x, y + 0.5 * u, 2.2 * u, Math.PI, 0); ctx.lineTo(x + 2.2 * u, y + 5 * u); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#3f74d0'; ctx.beginPath(); ctx.moveTo(x, y - 9 * u); ctx.lineTo(x + 4 * u, y - 7.5 * u); ctx.lineTo(x, y - 6 * u); ctx.fill();
    ctx.fillStyle = '#3a2a1a'; ctx.fillRect(x - 0.4 * u, y - 9 * u, 0.8 * u, 6 * u);
  },
  cave(ctx, x, y, s, alive = true) {
    const u = s / 12;
    ctx.fillStyle = alive ? '#8b867b' : '#555'; ctx.beginPath(); ctx.ellipse(x, y + 4 * u, 7 * u, 8 * u, 0, Math.PI, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#120e0b'; ctx.beginPath(); ctx.ellipse(x, y + 4 * u, 2.8 * u, 4 * u, 0, Math.PI, 0); ctx.closePath(); ctx.fill();
  },
  hut(ctx, x, y, s, alive = true) {
    const u = s / 12;
    ctx.fillStyle = alive ? '#c9a659' : '#555'; ctx.beginPath(); ctx.moveTo(x - 7 * u, y + 4 * u); ctx.lineTo(x, y - 6 * u); ctx.lineTo(x + 7 * u, y + 4 * u); ctx.closePath(); ctx.fill();
    ctx.fillStyle = alive ? '#4f8a3a' : '#333'; ctx.fillRect(x - 2 * u, y + 0.5 * u, 4 * u, 3.5 * u);
  },
  fort(ctx, x, y, s, alive = true) {
    const u = s / 12;
    ctx.fillStyle = alive ? '#5c4f45' : '#444'; ctx.fillRect(x - 6 * u, y - 4 * u, 12 * u, 9 * u);
    ctx.fillStyle = alive ? '#2b231f' : '#333';
    for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(x - 6 * u + i * 4 * u, y - 4 * u); ctx.lineTo(x - 4 * u + i * 4 * u, y - 8 * u); ctx.lineTo(x - 2 * u + i * 4 * u, y - 4 * u); ctx.fill(); }
    ctx.fillStyle = alive ? '#a3271d' : '#555'; ctx.fillRect(x - 2 * u, y, 4 * u, 5 * u);
  },
  base(ctx, key, x, y, s, alive) { ({ cave: this.cave, goblin: this.hut, orc: this.fort, graveyard: this.tomb })[key].call(this, ctx, x, y, s, alive); },
  tomb(ctx, x, y, s, alive = true) {
    const u = s / 12;
    ctx.fillStyle = alive ? '#8e8c88' : '#555'; rr(ctx, x - 4.5 * u, y - 6 * u, 9 * u, 11 * u, 4 * u); ctx.fill();
    ctx.strokeStyle = alive ? '#3a3834' : '#333'; ctx.lineWidth = 1.4 * u; ctx.beginPath(); ctx.moveTo(x, y - 4 * u); ctx.lineTo(x, y + 2 * u); ctx.moveTo(x - 2.5 * u, y - 2 * u); ctx.lineTo(x + 2.5 * u, y - 2 * u); ctx.stroke();
  },
  clock(ctx, x, y, s, col = '#f3e3bf') {
    ctx.strokeStyle = col; ctx.lineWidth = s * 0.12; circle(ctx, x, y, s * 0.42); ctx.stroke();
    ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - s * 0.26); ctx.moveTo(x, y); ctx.lineTo(x + s * 0.2, y + s * 0.08); ctx.stroke();
  },
  hammer(ctx, x, y, s, col = '#7dff6a') {
    ctx.save(); ctx.translate(x, y); ctx.rotate(-0.7);
    ctx.fillStyle = col; ctx.fillRect(-s * 0.08, -s * 0.15, s * 0.16, s * 0.6); ctx.fillRect(-s * 0.3, -s * 0.4, s * 0.6, s * 0.26);
    ctx.restore();
  },
  warn(ctx, x, y, s) {
    ctx.fillStyle = '#e2463a'; ctx.beginPath(); ctx.moveTo(x, y - s * 0.45); ctx.lineTo(x + s * 0.5, y + s * 0.4); ctx.lineTo(x - s * 0.5, y + s * 0.4); ctx.closePath(); ctx.fill();
    txt(ctx, '!', x, y + s * 0.08, s * 0.6, '#fff', 'center', { weight: 900 });
  },
  knightHead(ctx, x, y, s) {
    const u = s / 20;
    ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.moveTo(x - 1 * u, y - 9 * u); ctx.quadraticCurveTo(x + 9 * u, y - 16 * u, x + 10 * u, y - 4 * u); ctx.quadraticCurveTo(x + 5 * u, y - 10 * u, x + 1 * u, y - 7 * u); ctx.fill();
    const g = ctx.createLinearGradient(x - 8 * u, 0, x + 8 * u, 0); g.addColorStop(0, '#d9dde3'); g.addColorStop(1, '#8a919b');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x - 8 * u, y + 9 * u); ctx.lineTo(x - 8 * u, y - 2 * u); ctx.quadraticCurveTo(x - 8 * u, y - 10 * u, x, y - 10 * u);
    ctx.quadraticCurveTo(x + 8 * u, y - 10 * u, x + 8 * u, y - 2 * u); ctx.lineTo(x + 8 * u, y + 9 * u); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1 * u; ctx.stroke();
    ctx.fillStyle = '#1d1f24'; ctx.fillRect(x - 6 * u, y - 2 * u, 12 * u, 2.2 * u); ctx.fillRect(x - 0.9 * u, y - 2 * u, 1.8 * u, 8 * u);
    ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(x - 6 * u, y - 7 * u, 2 * u, 12 * u);
  },
  archerHead(ctx, x, y, s) {
    const u = s / 20;
    ctx.fillStyle = '#2f5a2a'; ctx.beginPath(); ctx.moveTo(x, y - 12 * u); ctx.quadraticCurveTo(x + 10 * u, y - 6 * u, x + 9 * u, y + 9 * u);
    ctx.lineTo(x - 9 * u, y + 9 * u); ctx.quadraticCurveTo(x - 10 * u, y - 6 * u, x, y - 12 * u); ctx.closePath(); ctx.fill();   // 두건
    ctx.fillStyle = '#e2b48c'; ellipse(ctx, x, y + 2 * u, 5.5 * u, 6.5 * u); ctx.fill();
    ctx.fillStyle = '#1e3a1e'; ctx.fillRect(x - 6 * u, y - 3 * u, 12 * u, 2.4 * u);                                     // 두건 그림자
    ctx.fillStyle = '#2a4a8a'; circle(ctx, x - 2.2 * u, y + 1.5 * u, 0.9 * u); ctx.fill(); circle(ctx, x + 2.2 * u, y + 1.5 * u, 0.9 * u); ctx.fill();
    ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 1.6 * u; ctx.beginPath(); ctx.arc(x + 12 * u, y + 2 * u, 9 * u, -1.3, 1.3); ctx.stroke();   // 활
  },
  mageHead(ctx, x, y, s) {
    const u = s / 20;
    ctx.fillStyle = '#eeeeee'; ctx.beginPath(); ctx.moveTo(x - 5 * u, y + 3 * u); ctx.lineTo(x + 5 * u, y + 3 * u); ctx.lineTo(x, y + 12 * u); ctx.closePath(); ctx.fill();   // 수염
    ctx.fillStyle = '#e2b48c'; ellipse(ctx, x, y + 1 * u, 5 * u, 5 * u); ctx.fill();
    ctx.fillStyle = '#26296e'; ellipse(ctx, x, y - 3 * u, 11 * u, 3 * u); ctx.fill();                                    // 챙
    ctx.fillStyle = '#3a3f9e'; ctx.beginPath(); ctx.moveTo(x - 7 * u, y - 4 * u); ctx.lineTo(x + 7 * u, y - 4 * u); ctx.lineTo(x + 3 * u, y - 15 * u); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffe08a'; circle(ctx, x + 0.5 * u, y - 8 * u, 1.6 * u); ctx.fill();
    ctx.fillStyle = '#7fd0ff'; circle(ctx, x + 11 * u, y - 4 * u, 2.4 * u); ctx.fill();                                   // 지팡이 수정
    ctx.strokeStyle = '#6b4a2a'; ctx.lineWidth = 1.5 * u; ctx.beginPath(); ctx.moveTo(x + 11 * u, y - 2 * u); ctx.lineTo(x + 11 * u, y + 12 * u); ctx.stroke();
  },
  heroHead(ctx, type, x, y, s) {
    const sp = Sprites.get('hero_' + type);
    if (sp) {                                                       // 그림 파일이 있으면 얼굴 부분을 잘라서 초상화로
      const im = sp.img, cs = im.height * 0.34, sx = clamp(im.width * sp.headX - cs / 2, 0, Math.max(0, im.width - cs));
      ctx.save(); circle(ctx, x, y - s * 0.06, s * 0.79); ctx.clip();
      ctx.drawImage(im, sx, 0, cs, cs, x - s * 0.82, y - s * 0.9, s * 1.64, s * 1.64);
      ctx.restore(); return;
    }
    (type === 'archer' ? this.archerHead : type === 'mage' ? this.mageHead : this.knightHead).call(this, ctx, x, y, s);
  },
  skill(ctx, id, x, y, s) {
    const u = s / 20;
    ctx.save(); ctx.translate(x, y);
    const arrow = (x0, y0, a, L) => {
      ctx.strokeStyle = '#e9e0c8'; ctx.lineWidth = 1.8 * u; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + Math.cos(a) * L, y0 + Math.sin(a) * L); ctx.stroke();
      const hx = x0 + Math.cos(a) * L, hy = y0 + Math.sin(a) * L; ctx.fillStyle = '#cfd3d8';
      ctx.beginPath(); ctx.moveTo(hx + Math.cos(a) * 4 * u, hy + Math.sin(a) * 4 * u); ctx.lineTo(hx + Math.cos(a + 2.3) * 3.5 * u, hy + Math.sin(a + 2.3) * 3.5 * u); ctx.lineTo(hx + Math.cos(a - 2.3) * 3.5 * u, hy + Math.sin(a - 2.3) * 3.5 * u); ctx.closePath(); ctx.fill();
    };
    if (id === 'multiShot') { for (const a of [-0.35, 0, 0.35]) arrow(-12 * u, 0, a, 20 * u); }
    else if (id === 'arrowStorm') {                                   // 폭풍 화살: 사방으로 퍼지는 화살
      ctx.strokeStyle = 'rgba(255,240,180,0.6)'; ctx.lineWidth = 1.5 * u; ctx.beginPath(); ctx.arc(0, 0, 13 * u, 0, TAU); ctx.stroke();
      for (let i = 0; i < 6; i++) { const a = (i / 6) * TAU - 0.3; arrow(Math.cos(a) * 3 * u, Math.sin(a) * 3 * u, a, 13 * u); }
    } else if (id === 'judgment') {                                   // 심판의 일격: 빛나는 검이 땅에 꽂힘
      ctx.fillStyle = 'rgba(255,225,120,0.35)'; circle(ctx, 0, 6 * u, 13 * u); ctx.fill();
      ctx.strokeStyle = '#ffe08a'; ctx.lineWidth = 1.6 * u; for (let i = 0; i < 8; i++) { const a = (i / 8) * TAU; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 9 * u, 6 * u + Math.sin(a) * 6 * u); ctx.lineTo(Math.cos(a) * 15 * u, 6 * u + Math.sin(a) * 10 * u); ctx.stroke(); }
      ctx.fillStyle = '#e8ecf2'; ctx.beginPath(); ctx.moveTo(-2.5 * u, -12 * u); ctx.lineTo(2.5 * u, -12 * u); ctx.lineTo(2.5 * u, 6 * u); ctx.lineTo(0, 10 * u); ctx.lineTo(-2.5 * u, 6 * u); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#f2c94c'; ctx.fillRect(-7 * u, -12 * u, 14 * u, 3 * u); ctx.fillRect(-1.5 * u, -18 * u, 3 * u, 6 * u);
    } else if (id === 'meteor') {                                     // 메테오: 꼬리 달린 운석
      const g = ctx.createLinearGradient(-14 * u, -14 * u, 4 * u, 4 * u); g.addColorStop(0, 'rgba(255,200,80,0)'); g.addColorStop(1, 'rgba(255,140,40,0.9)');
      ctx.strokeStyle = g; ctx.lineWidth = 9 * u; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-14 * u, -14 * u); ctx.lineTo(2 * u, 2 * u); ctx.stroke();
      ctx.fillStyle = '#8a3a14'; circle(ctx, 4 * u, 4 * u, 8 * u); ctx.fill(); ctx.fillStyle = '#ff8a2a'; circle(ctx, 3 * u, 3 * u, 5.5 * u); ctx.fill(); ctx.fillStyle = '#ffe08a'; circle(ctx, 2 * u, 2 * u, 2.5 * u); ctx.fill();
    }
    else if (id === 'arrowRain') {
      ctx.fillStyle = '#9aa0a8'; ellipse(ctx, 0, -10 * u, 12 * u, 4 * u); ctx.fill();
      for (const xo of [-8, -1, 6]) arrow(xo * u - 3 * u, -6 * u, 1.25, 16 * u);
      ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 1.5 * u; ctx.beginPath(); ctx.moveTo(-13 * u, 12 * u); ctx.lineTo(13 * u, 12 * u); ctx.stroke();
    } else if (id === 'trap') {
      ctx.strokeStyle = '#9aa0a8'; ctx.lineWidth = 2.5 * u; ctx.beginPath(); ctx.arc(0, 2 * u, 11 * u, Math.PI, 0); ctx.stroke(); ctx.beginPath(); ctx.arc(0, 2 * u, 11 * u, 0.15, Math.PI - 0.15); ctx.stroke();
      ctx.fillStyle = '#e0e3e8';
      for (let i = 0; i < 7; i++) { const a = Math.PI + (i + 0.5) * Math.PI / 7; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 11 * u, 2 * u + Math.sin(a) * 11 * u); ctx.lineTo(Math.cos(a) * 6 * u, 2 * u + Math.sin(a) * 6 * u); ctx.lineTo(Math.cos(a + 0.2) * 11 * u, 2 * u + Math.sin(a + 0.2) * 11 * u); ctx.fill(); }
      ctx.fillStyle = '#6b6f75'; circle(ctx, 0, 2 * u, 3 * u); ctx.fill();
    } else if (id === 'fireball') {
      ctx.fillStyle = '#c8402a'; ctx.beginPath(); ctx.moveTo(-14 * u, -8 * u); ctx.quadraticCurveTo(-2 * u, -6 * u, 2 * u, -7 * u); ctx.lineTo(2 * u, 7 * u); ctx.quadraticCurveTo(-4 * u, 6 * u, -14 * u, 8 * u); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ff8a2a'; circle(ctx, 4 * u, 0, 8 * u); ctx.fill(); ctx.fillStyle = '#ffe27a'; circle(ctx, 5 * u, -1 * u, 4 * u); ctx.fill();
    } else if (id === 'heal') {
      ctx.fillStyle = 'rgba(140,255,140,0.35)'; circle(ctx, 0, 0, 13 * u); ctx.fill();
      ctx.fillStyle = '#7dff6a'; ctx.fillRect(-3 * u, -10 * u, 6 * u, 20 * u); ctx.fillRect(-10 * u, -3 * u, 20 * u, 6 * u);
      ctx.fillStyle = '#e8ffe0'; ctx.fillRect(-1.2 * u, -8 * u, 2.4 * u, 16 * u);
    } else if (id === 'blizzard') {
      ctx.strokeStyle = '#bfe8ff'; ctx.lineWidth = 2 * u; ctx.lineCap = 'round';
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * TAU, c = Math.cos(a), sn = Math.sin(a);
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(c * 13 * u, sn * 13 * u);
        ctx.moveTo(c * 8 * u, sn * 8 * u); ctx.lineTo(c * 8 * u + Math.cos(a + 0.8) * 4 * u, sn * 8 * u + Math.sin(a + 0.8) * 4 * u);
        ctx.moveTo(c * 8 * u, sn * 8 * u); ctx.lineTo(c * 8 * u + Math.cos(a - 0.8) * 4 * u, sn * 8 * u + Math.sin(a - 0.8) * 4 * u); ctx.stroke();
      }
    }
    if (id === 'shieldBash') {
      ctx.strokeStyle = '#ffe08a'; ctx.lineWidth = 1.6 * u; ctx.lineCap = 'round';
      for (const a of [-0.5, 0, 0.5]) { ctx.beginPath(); ctx.moveTo(Math.cos(a) * 9 * u, Math.sin(a) * 9 * u - 1 * u); ctx.lineTo(Math.cos(a) * 14 * u, Math.sin(a) * 14 * u - 1 * u); ctx.stroke(); }
      ctx.fillStyle = '#3561b8'; ctx.strokeStyle = '#f2c94c'; ctx.lineWidth = 1.8 * u;
      ctx.beginPath(); ctx.moveTo(-8 * u, -9 * u); ctx.lineTo(6 * u, -9 * u); ctx.lineTo(6 * u, 1 * u); ctx.quadraticCurveTo(-1 * u, 11 * u, -8 * u, 1 * u); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#f2c94c'; ctx.fillRect(-2 * u, -7 * u, 2 * u, 11 * u); ctx.fillRect(-6 * u, -3 * u, 10 * u, 2 * u);
    } else if (id === 'warcry') {
      ctx.strokeStyle = '#ff8a5a'; ctx.lineWidth = 1.8 * u; ctx.lineCap = 'round';
      for (const r of [7, 11, 15]) { ctx.beginPath(); ctx.arc(-3 * u, 0, r * u, -0.75, 0.75); ctx.stroke(); }
      ctx.fillStyle = '#e8c35a'; ctx.beginPath(); ctx.moveTo(-11 * u, -3 * u); ctx.lineTo(-4 * u, -7 * u); ctx.lineTo(-4 * u, 7 * u); ctx.lineTo(-11 * u, 3 * u); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#a3271d'; ctx.fillRect(-14 * u, -3 * u, 3 * u, 6 * u);
    } else if (id === 'charge') {
      ctx.strokeStyle = '#ffe08a'; ctx.lineWidth = 1.8 * u; ctx.lineCap = 'round';
      for (const [yy, l] of [[-6, 8], [0, 11], [6, 8]]) { ctx.beginPath(); ctx.moveTo(-13 * u, yy * u); ctx.lineTo((-13 + l) * u, yy * u); ctx.stroke(); }
      ctx.fillStyle = '#e9edf2'; ctx.beginPath(); ctx.moveTo(-2 * u, -6 * u); ctx.lineTo(7 * u, -6 * u); ctx.lineTo(7 * u, -10 * u); ctx.lineTo(14 * u, 0); ctx.lineTo(7 * u, 10 * u); ctx.lineTo(7 * u, 6 * u); ctx.lineTo(-2 * u, 6 * u); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1 * u; ctx.stroke();
    }
    ctx.restore();
  },
  coin(ctx, x, y, s) {
    const r = s / 2;
    ctx.fillStyle = '#b07a12'; circle(ctx, x, y + r * 0.12, r); ctx.fill();
    ctx.fillStyle = '#f2c230'; circle(ctx, x, y, r); ctx.fill();
    ctx.strokeStyle = '#c9901a'; ctx.lineWidth = Math.max(1, r * 0.16); circle(ctx, x, y, r * 0.68); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.55)'; ellipse(ctx, x - r * 0.35, y - r * 0.38, r * 0.28, r * 0.16, -0.6); ctx.fill();
  },
  lock(ctx, x, y, s) {
    const u = s / 12;
    ctx.strokeStyle = '#d8ccb0'; ctx.lineWidth = 1.8 * u; ctx.beginPath(); ctx.arc(x, y - 2 * u, 3.4 * u, Math.PI, 0); ctx.stroke();
    ctx.fillStyle = '#d8ccb0'; rr(ctx, x - 5 * u, y - 2 * u, 10 * u, 8 * u, 1.5 * u); ctx.fill();
    ctx.fillStyle = '#3a2a1a'; circle(ctx, x, y + 1.5 * u, 1.2 * u); ctx.fill();
  },
  // 병사 아이콘 (아래 병력 칸): 실제 병사 그림을 크게
  unit(ctx, kind, level, x, y, s) {
    const sp = Sprites.unit(kind, level);
    if (sp) { const H = s * 1.18; Art.sprite(ctx, sp, x, y + H * 0.5, H, { flip: false }); return; }
    const c = CONFIG.soldiers[kind], u = s / (c.radius * (kind === 'knight' ? 3.4 : 2.6));
    const fake = { kind, level, x: 0, y: 0, radius: c.radius, face: kind === 'knight' ? -0.35 : -0.6, moving: false, walkAnim: 0, attackAnim: 0, flash: 0, stun: 0, root: 0 };
    ctx.save(); ctx.translate(x - (kind === 'knight' ? 2 * u : 0), y); ctx.scale(u, u); Art.soldier(ctx, fake, realTime); ctx.restore();
  },
  // 아이템 아이콘: 직업·슬롯별 모양, 등급별 색 (일반 은색 / 희귀 파랑 / 전설 주황)
  item(ctx, item, heroType, x, y, s) {
    const u = s / 20, col = { common: '#cfd3d8', rare: '#6ab4ff', legendary: '#ffaa3a' }[item.rarity], dark = 'rgba(0,0,0,0.45)';
    ctx.save(); ctx.translate(x, y); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (item.slot === 'weapon') {
      if (heroType === 'archer') {
        ctx.strokeStyle = col; ctx.lineWidth = 2.6 * u; ctx.beginPath(); ctx.arc(-4 * u, 0, 10 * u, -1.25, 1.25); ctx.stroke();
        ctx.strokeStyle = '#efe7d0'; ctx.lineWidth = 0.9 * u; ctx.beginPath(); ctx.moveTo(-4 * u + Math.cos(1.25) * 10 * u, -Math.sin(1.25) * 10 * u); ctx.lineTo(-4 * u + Math.cos(1.25) * 10 * u, Math.sin(1.25) * 10 * u); ctx.stroke();
      } else if (heroType === 'mage') {
        ctx.strokeStyle = '#7a5530'; ctx.lineWidth = 2.4 * u; ctx.beginPath(); ctx.moveTo(-7 * u, 9 * u); ctx.lineTo(5 * u, -5 * u); ctx.stroke();
        ctx.fillStyle = col; circle(ctx, 6 * u, -7 * u, 4.2 * u); ctx.fill(); ctx.fillStyle = '#fff'; circle(ctx, 5 * u, -8 * u, 1.4 * u); ctx.fill();
      } else {
        ctx.rotate(-0.78);
        ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(-2 * u, -12 * u); ctx.lineTo(2 * u, -12 * u); ctx.lineTo(2 * u, 4 * u); ctx.lineTo(-2 * u, 4 * u); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-2 * u, -12 * u); ctx.lineTo(0, -15 * u); ctx.lineTo(2 * u, -12 * u); ctx.fill();
        ctx.fillStyle = '#c9a23a'; ctx.fillRect(-6 * u, 4 * u, 12 * u, 2.4 * u); ctx.fillStyle = '#5a3a1c'; ctx.fillRect(-1.3 * u, 6 * u, 2.6 * u, 6 * u);
      }
    } else if (item.slot === 'armor') {
      ctx.fillStyle = col; ctx.beginPath();
      if (heroType === 'knight') { ctx.moveTo(-9 * u, -8 * u); ctx.lineTo(-4 * u, -10 * u); ctx.lineTo(0, -7 * u); ctx.lineTo(4 * u, -10 * u); ctx.lineTo(9 * u, -8 * u); ctx.lineTo(7 * u, 9 * u); ctx.lineTo(-7 * u, 9 * u); }
      else { ctx.moveTo(-4 * u, -10 * u); ctx.lineTo(4 * u, -10 * u); ctx.lineTo(10 * u, 10 * u); ctx.lineTo(-10 * u, 10 * u); }   // 망토·로브
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = dark; ctx.lineWidth = 1.2 * u; ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, -7 * u); ctx.lineTo(0, 9 * u); ctx.stroke();
    } else {
      if (heroType === 'mage') { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, -11 * u); ctx.lineTo(6 * u, -2 * u); ctx.lineTo(0, 11 * u); ctx.lineTo(-6 * u, -2 * u); ctx.closePath(); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.moveTo(0, -9 * u); ctx.lineTo(3 * u, -2 * u); ctx.lineTo(0, 2 * u); ctx.closePath(); ctx.fill(); }
      else { ctx.strokeStyle = col; ctx.lineWidth = 3 * u; circle(ctx, 0, 3 * u, 7 * u); ctx.stroke(); ctx.fillStyle = heroType === 'archer' ? '#7dff6a' : '#ff5a4a'; circle(ctx, 0, -5 * u, 3.4 * u); ctx.fill(); }
    }
    ctx.restore();
  },
  speaker(ctx, x, y, s, on) {
    const u = s / 20;
    ctx.fillStyle = '#fff8e6';
    ctx.beginPath(); ctx.moveTo(x - 9 * u, y - 4 * u); ctx.lineTo(x - 4 * u, y - 4 * u); ctx.lineTo(x + 2 * u, y - 9 * u); ctx.lineTo(x + 2 * u, y + 9 * u); ctx.lineTo(x - 4 * u, y + 4 * u); ctx.lineTo(x - 9 * u, y + 4 * u); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = on ? '#fff8e6' : '#ff8a6a'; ctx.lineWidth = 2 * u; ctx.lineCap = 'round';
    if (on) { for (const r of [5, 9]) { ctx.beginPath(); ctx.arc(x + 3 * u, y, r * u, -0.8, 0.8); ctx.stroke(); } }
    else { ctx.beginPath(); ctx.moveTo(x + 5 * u, y - 5 * u); ctx.lineTo(x + 12 * u, y + 5 * u); ctx.moveTo(x + 12 * u, y - 5 * u); ctx.lineTo(x + 5 * u, y + 5 * u); ctx.stroke(); }
  },
  skull(ctx, x, y, s) {
    const u = s / 20;
    ctx.fillStyle = '#ece6d2'; circle(ctx, x, y - 2 * u, 8 * u); ctx.fill(); ctx.fillRect(x - 5 * u, y + 3 * u, 10 * u, 5 * u);
    ctx.fillStyle = '#2a1d14'; circle(ctx, x - 3 * u, y - 2 * u, 2.4 * u); ctx.fill(); circle(ctx, x + 3 * u, y - 2 * u, 2.4 * u); ctx.fill();
    ctx.fillRect(x - 2.5 * u, y + 4 * u, 1.2 * u, 4 * u); ctx.fillRect(x + 1.3 * u, y + 4 * u, 1.2 * u, 4 * u);
  },
  focus(ctx, x, y, s) {
    ctx.strokeStyle = '#fff8e6'; ctx.lineWidth = s * 0.09; ctx.lineCap = 'round';
    circle(ctx, x, y, s * 0.3); ctx.stroke();
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { ctx.beginPath(); ctx.moveTo(x + dx * s * 0.36, y + dy * s * 0.36); ctx.lineTo(x + dx * s * 0.5, y + dy * s * 0.5); ctx.stroke(); }
    ctx.fillStyle = '#fff8e6'; circle(ctx, x, y, s * 0.1); ctx.fill();
  },
  pause(ctx, x, y, s) { ctx.fillStyle = '#fff8e6'; ctx.fillRect(x - s * 0.28, y - s * 0.32, s * 0.2, s * 0.64); ctx.fillRect(x + s * 0.08, y - s * 0.32, s * 0.2, s * 0.64); },
  play(ctx, x, y, s) { ctx.fillStyle = '#fff8e6'; ctx.beginPath(); ctx.moveTo(x - s * 0.25, y - s * 0.34); ctx.lineTo(x + s * 0.34, y); ctx.lineTo(x - s * 0.25, y + s * 0.34); ctx.closePath(); ctx.fill(); },
};

// ==========================================================================
// 5. FX — 이펙트 / 파티클
// ==========================================================================
const FX = {
  add(p) { G.fx.push(p); if (G.fx.length > 600) G.fx.splice(0, G.fx.length - 600); return p; },
  text(x, y, str, color = '#fff', size = 20, life = 0.9) { this.add({ k: 'text', x, y, vx: 0, vy: -38, g: 0, life, max: life, str, color, size }); },
  dmg(x, y, str, color, size) { this.add({ k: 'text', x: x + rand(-8, 8), y, vx: rand(-10, 10), vy: -55, g: 60, life: 0.7, max: 0.7, str: String(str), color, size }); },
  spark(x, y, color = '#ffe9a0', n = 5) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = rand(60, 160);
      this.add({ k: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: 0, life: 0.22, max: 0.22, color, size: rand(4, 7) });
    }
  },
  puff(x, y, color, size, life, vx = 0, vy = -10, alpha = 0.6, grow = 1.2) { this.add({ k: 'puff', x, y, vx, vy, g: 0, life, max: life, color, size, alpha, grow }); },
  poof(x, y, r = 10) { for (let i = 0; i < 5; i++) { const a = Math.random() * TAU; this.puff(x, y, '#d8d4cc', r * rand(0.5, 0.9), 0.45, Math.cos(a) * 30, Math.sin(a) * 30 - 10); } },
  dust(x, y) { for (let i = 0; i < 3; i++) this.puff(x + rand(-6, 6), y + rand(-6, 6), '#b49a72', rand(4, 8), 0.5, rand(-25, 25), rand(-25, 10), 0.55); },
  ring(x, y, size = 24, color = '255,255,255', life = 0.35) { this.add({ k: 'ring', x, y, vx: 0, vy: 0, g: 0, life, max: life, size, color }); },
  zap(x1, y1, x2, y2, color) {                                  // 번개 (지그재그 선)
    const pts = [[x1, y1]], n = 7, nx = -(y2 - y1), ny = x2 - x1, L = Math.hypot(nx, ny) || 1;
    for (let i = 1; i < n; i++) { const t = i / n, o = rand(-14, 14); pts.push([lerp(x1, x2, t) + nx / L * o, lerp(y1, y2, t) + ny / L * o]); }
    pts.push([x2, y2]);
    this.add({ k: 'zap', x: 0, y: 0, vx: 0, vy: 0, g: 0, life: 0.28, max: 0.28, pts, color: color || '120,180,255' });
  },
  arc(x, y, a, r, arc, color = '255,235,170', life = 0.25) { this.add({ k: 'arc', x, y, vx: 0, vy: 0, g: 0, life, max: life, a, size: r, arc, color }); },
  explosion(x, y, s = 1) {
    this.ring(x, y, 110 * s, '255,220,140', 0.55);
    for (let i = 0; i < 28 * s; i++) {
      const a = rand(0, TAU), v = rand(40, 220) * s;
      this.add({ k: 'flame', x: x + rand(-20, 20) * s, y: y + rand(-20, 20) * s, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, g: 60, drag: 2.2, life: rand(0.4, 0.9), max: 0.9, size: rand(8, 18) * s });
    }
    for (let i = 0; i < 18 * s; i++) {
      const a = rand(0, TAU), v = rand(80, 260) * s;
      this.add({ k: 'debris', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 0, drag: 2.5, life: rand(0.6, 1.1), max: 1.1, size: rand(4, 8), color: Math.random() < 0.5 ? '#6f6a61' : '#5a3b22', rot: rand(0, TAU), spin: rand(-10, 10) });
    }
    for (let i = 0; i < 14 * s; i++) this.puff(x + rand(-50, 50) * s, y + rand(-40, 30) * s, '#4a4540', rand(14, 26) * s, rand(1.2, 2), rand(-15, 15), rand(-35, -15), 0.55, 1.5);
  },
  update(dt) {
    for (const p of G.fx) {
      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt;
      if (p.drag) { const d = Math.max(0, 1 - p.drag * dt); p.vx *= d; p.vy *= d; }
    }
    compact(G.fx, p => p.life > 0);
  },
  draw(ctx) {
    for (const p of G.fx) {
      const f = clamp(p.life / p.max, 0, 1);
      switch (p.k) {
        case 'text':
          ctx.globalAlpha = Math.min(1, f * 2.5);
          txt(ctx, p.str, p.x, p.y, p.size, p.color, 'center', { stroke: 'rgba(0,0,0,0.8)', weight: 800 });
          break;
        case 'spark': {
          ctx.globalAlpha = f; ctx.strokeStyle = p.color; ctx.lineWidth = 2; ctx.lineCap = 'round';
          const sp = Math.hypot(p.vx, p.vy) || 1;
          ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - (p.vx / sp) * p.size * f, p.y - (p.vy / sp) * p.size * f); ctx.stroke();
          break;
        }
        case 'puff':
          ctx.globalAlpha = f * p.alpha; ctx.fillStyle = p.color;
          circle(ctx, p.x, p.y, p.size * (1 + (1 - f) * p.grow)); ctx.fill();
          break;
        case 'flame':
          ctx.globalAlpha = Math.min(1, f * 1.6); ctx.fillStyle = f > 0.6 ? '#ffe27a' : f > 0.3 ? '#ff9a3a' : '#c8402a';
          circle(ctx, p.x, p.y, p.size * (0.5 + f * 0.5)); ctx.fill();
          break;
        case 'ring':
          ctx.globalAlpha = f; ctx.strokeStyle = `rgb(${p.color})`; ctx.lineWidth = 3 * f + 1;
          circle(ctx, p.x, p.y, p.size * (1 - f) + 2); ctx.stroke();
          break;
        case 'arc': {
          ctx.globalAlpha = f * 0.8; ctx.fillStyle = `rgb(${p.color})`;
          const r = p.size * (0.7 + (1 - f) * 0.35);
          ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.arc(p.x, p.y, r, p.a - p.arc / 2, p.a + p.arc / 2); ctx.closePath(); ctx.fill();
          ctx.globalAlpha = f; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(p.x, p.y, r, p.a - p.arc / 2, p.a + p.arc / 2); ctx.stroke();
          break;
        }
        case 'zap':
          ctx.globalAlpha = f; ctx.lineJoin = 'round';
          for (const [wd, col] of [[7, `rgba(${p.color},0.45)`], [2.5, '#eef6ff']]) {
            ctx.strokeStyle = col; ctx.lineWidth = wd; ctx.beginPath();
            p.pts.forEach((q, i) => (i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]))); ctx.stroke();
          }
          break;
        case 'bones':                                              // 쓰러진 해골 (다시 일어나기 전)
          ctx.globalAlpha = 1; ctx.strokeStyle = '#ddd6c2'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
          for (const [a, l] of [[0.3, 9], [2.1, 8], [4.0, 7], [5.2, 6]]) { ctx.beginPath(); ctx.moveTo(p.x - Math.cos(a) * l * 0.5, p.y + 3 - Math.sin(a) * l * 0.3); ctx.lineTo(p.x + Math.cos(a) * l * 0.5, p.y + 3 + Math.sin(a) * l * 0.3); ctx.stroke(); }
          ctx.fillStyle = '#ece6d2'; circle(ctx, p.x + 4, p.y, 3.5); ctx.fill();
          if (f < 0.35) { ctx.globalAlpha = (0.35 - f) * 2; ctx.fillStyle = '#b28aff'; circle(ctx, p.x, p.y, 10 * (1 - f)); ctx.fill(); }
          break;
        case 'debris':
          ctx.globalAlpha = Math.min(1, f * 2); ctx.fillStyle = p.color;
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot + (1 - f) * p.spin); ctx.fillRect(-p.size / 2, -p.size * 0.3, p.size, p.size * 0.6); ctx.restore();
          break;
      }
    }
    ctx.globalAlpha = 1;
  },
};

// ==========================================================================
// 5-1. 소리 — Web Audio API로 효과음·배경음악을 직접 합성 (외부 파일 없음)
//      실제 음원으로 바꾸려면 SOUND_SOURCES 에 경로만 넣으세요.
//      키: 효과음 이름(아래 SFX 목록) / 배경음악: music_calm, music_battle, music_boss
// ==========================================================================
const SOUND_SOURCES = {
  // bow: 'sounds/bow.mp3', explosion: 'sounds/explosion.mp3', music_battle: 'music/battle.mp3',
};

const Sound = {
  ctx: null, master: null, sfxBus: null, musicBus: null, noiseBuf: null,
  unlocked: false, voices: 0, last: {}, files: {}, duckLevel: 1,

  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const c = this.ctx = new AC();
    const comp = c.createDynamicsCompressor();                 // 소리가 많이 겹쳐도 찢어지지 않게
    comp.threshold.value = -16; comp.ratio.value = 6; comp.connect(c.destination);
    this.master = c.createGain(); this.master.connect(comp);
    this.sfxBus = c.createGain(); this.sfxBus.connect(this.master);
    this.musicBus = c.createGain(); this.musicBus.connect(this.master);
    const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = buf;
    for (const k in SOUND_SOURCES) { const a = new Audio(SOUND_SOURCES[k]); a.preload = 'auto'; this.files[k] = a; }
    this.applyVolumes();
  },
  // 휴대폰은 사용자가 처음 화면을 누를 때 소리를 켤 수 있음
  unlock() {
    this.init(); if (!this.ctx) return;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    if (!this.unlocked) {
      const s = this.ctx.createBufferSource(); s.buffer = this.ctx.createBuffer(1, 1, 22050); s.connect(this.ctx.destination); s.start(0);
      this.unlocked = true; Music.start();
    }
  },
  applyVolumes() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime, m = SETTINGS.muted ? 0 : 1;
    this.sfxBus.gain.setTargetAtTime(m * SETTINGS.sfxVolume, t, 0.05);
    this.musicBus.gain.setTargetAtTime(m * SETTINGS.musicVolume * 0.65 * this.duckLevel, t, 0.2);
  },
  duck(on) { const v = on ? 0.35 : 1; if (v !== this.duckLevel) { this.duckLevel = v; this.applyVolumes(); } },

  // 화면 위치에 따른 크기·좌우 (화면 밖이면 작게)
  posAtten(x, y) {
    const vw = Camera.viewW(), vh = Camera.viewH(), cx = Camera.x + vw / 2, cy = Camera.y + vh / 2;
    const dx = Math.max(0, Math.abs(x - cx) - vw / 2), dy = Math.max(0, Math.abs(y - cy) - vh / 2), d = Math.hypot(dx, dy);
    return { g: d <= 0 ? 1 : clamp(1 - d / 700, 0, 1) * 0.5, pan: clamp(((x - cx) / (vw / 2)) * 0.55, -0.7, 0.7) };
  },
  play(name, x, y, vol = 1) {
    if (!this.ctx || !this.unlocked || SETTINGS.muted || SETTINGS.sfxVolume <= 0 || this.ctx.state !== 'running') return;
    const def = SFX[name]; if (!def) return;
    const now = this.ctx.currentTime;
    if (now - (this.last[name] || -9) < (def.gap || 0.03)) return;     // 같은 소리가 너무 촘촘하면 생략
    if (this.voices > 26) return;                                        // 동시에 너무 많으면 생략
    let g = vol * (def.vol || 1), pan = 0;
    if (x != null) { const a = this.posAtten(x, y); if (a.g < 0.06) return; g *= a.g; pan = a.pan; }
    this.last[name] = now;
    if (this.files[name]) { const a = this.files[name].cloneNode(); a.volume = clamp(g * SETTINGS.sfxVolume, 0, 1); a.play().catch(() => {}); return; }
    const out = this.ctx.createGain(); out.gain.value = g;
    if (this.ctx.createStereoPanner) { const p = this.ctx.createStereoPanner(); p.pan.value = pan; out.connect(p); p.connect(this.sfxBus); } else out.connect(this.sfxBus);
    this.voices++; setTimeout(() => { this.voices--; out.disconnect(); }, (def.dur || 0.5) * 1000 + 100);
    def.fn(this, out, now + 0.005);
  },

  // ---- 합성 재료 ----
  // 음: type(sine/triangle/square/sawtooth), f0→f1 Hz, dur초, vol, attack, filter {type, f, q}
  tone(out, t, o) {
    const c = this.ctx, osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f0, t);
    if (o.f1 && o.f1 !== o.f0) osc.frequency.exponentialRampToValueAtTime(o.f1, t + o.dur);
    if (o.vib) { const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = o.vib; lg.gain.value = o.f0 * 0.008; l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + o.dur + 0.05); }
    const a = o.attack || 0.005, v = o.vol == null ? 1 : o.vol;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    let node = osc;
    if (o.filter) { const f = c.createBiquadFilter(); f.type = o.filter.type || 'lowpass'; f.frequency.value = o.filter.f; f.Q.value = o.filter.q || 0.7; node.connect(f); node = f; }
    node.connect(g); g.connect(out);
    osc.start(t); osc.stop(t + o.dur + 0.05);
  },
  // 잡음: filter 종류, f0→f1 Hz, q, dur, vol
  noise(out, t, o) {
    const c = this.ctx, src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = this.noiseBuf; src.playbackRate.value = o.rate || 1;
    f.type = o.filter || 'lowpass'; f.Q.value = o.q || 0.8;
    f.frequency.setValueAtTime(o.f0 || 1000, t);
    if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t + o.dur);
    const a = o.attack || 0.003, v = o.vol == null ? 1 : o.vol;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    src.connect(f); f.connect(g); g.connect(out);
    src.start(t, Math.random() * 1.5); src.stop(t + o.dur + 0.05);
  },
};
const midiHz = m => 440 * Math.pow(2, (m - 69) / 12);

// ---- 배경음악: 중세풍 (D 단조, 류트 + 피리 + 저음 + 북). 화면에 따라 calm / battle / boss ----
const Music = {
  mode: 'none', pending: 'none', step: 0, nextTime: 0, timer: null, audio: null,
  chords: [[50, 53, 57], [48, 52, 55], [46, 50, 53], [45, 49, 52], [50, 53, 57], [53, 57, 60], [48, 52, 55], [45, 49, 52]],   // Dm C B♭ A Dm F C A
  melody: [                                                                                       // 마디별 [음, 길이(8분음표)]
    [[74, 2], [77, 1], [76, 1], [74, 2], [69, 2]], [[72, 2], [76, 1], [74, 1], [72, 2], [67, 2]],
    [[70, 2], [74, 1], [72, 1], [70, 2], [65, 2]], [[69, 3], [73, 1], [76, 4]],
    [[74, 1], [76, 1], [77, 2], [76, 1], [74, 1], [72, 2]], [[72, 1], [74, 1], [77, 2], [81, 2], [77, 2]],
    [[79, 2], [76, 2], [72, 2], [76, 2]], [[73, 2], [76, 2], [69, 4]],
  ],
  bpm: { calm: 76, battle: 104, boss: 126 },
  start() { if (!this.timer) this.timer = setInterval(() => this.schedule(), 60); },
  setMode(m) { this.pending = m; },
  schedule() {
    const S = Sound; if (!S.ctx || !S.unlocked || S.ctx.state !== 'running') return;
    if (this.pending !== this.mode && (this.step % 4 === 0 || this.mode === 'none')) {     // 반 마디 단위로 분위기 전환
      this.mode = this.pending; this.step = 0; this.nextTime = Math.max(this.nextTime, S.ctx.currentTime + 0.05); this.useFile();
    }
    if (this.mode === 'none' || this.audio) return;
    const ahead = S.ctx.currentTime + 0.2;
    if (this.nextTime < S.ctx.currentTime - 0.5) this.nextTime = S.ctx.currentTime + 0.05;  // 탭 전환 등으로 밀렸으면 다시 맞춤
    while (this.nextTime < ahead) { this.playStep(this.step, this.nextTime); this.nextTime += 60 / this.bpm[this.mode] / 2; this.step++; }
  },
  useFile() {                                                    // SOUND_SOURCES에 음악 파일이 있으면 그것을 재생
    if (this.audio) { this.audio.pause(); this.audio = null; }
    const src = SOUND_SOURCES['music_' + this.mode]; if (!src) return;
    this.audio = new Audio(src); this.audio.loop = true; this.audio.volume = clamp(SETTINGS.musicVolume * (SETTINGS.muted ? 0 : 1), 0, 1); this.audio.play().catch(() => {});
  },
  // 악기
  lute(t, m, v) { const S = Sound, o = S.musicBus; S.tone(o, t, { type: 'triangle', f0: midiHz(m), dur: 0.55, vol: v, filter: { f: 2200 } }); S.tone(o, t, { f0: midiHz(m + 12), dur: 0.25, vol: v * 0.25 }); },
  flute(t, m, len, v) { Sound.tone(Sound.musicBus, t, { f0: midiHz(m), dur: len * 0.95, vol: v, attack: 0.05, vib: 5 }); },
  bass(t, m, len, v) { Sound.tone(Sound.musicBus, t, { type: 'sawtooth', f0: midiHz(m), dur: len, vol: v, attack: 0.08, filter: { f: 320 } }); },
  kick(t, v) { Sound.tone(Sound.musicBus, t, { f0: 120, f1: 45, dur: 0.22, vol: v }); },
  drum(t, v) { const S = Sound; S.noise(S.musicBus, t, { dur: 0.12, filter: 'lowpass', f0: 900, vol: v }); S.tone(S.musicBus, t, { f0: 200, f1: 130, dur: 0.1, vol: v * 0.6 }); },
  tamb(t, v) { Sound.noise(Sound.musicBus, t, { dur: 0.045, filter: 'highpass', f0: 6500, vol: v }); },
  playStep(i, t) {
    const mode = this.mode, bar = Math.floor(i / 8) % 8, s = i % 8, ch = this.chords[bar], e8 = 60 / this.bpm[mode] / 2;
    const arp = [ch[0], ch[1], ch[2], ch[0] + 12, ch[2], ch[1], ch[2], ch[0] + 12];
    if (s === 0) this.bass(t, ch[0] - 12, e8 * 8, mode === 'calm' ? 0.12 : 0.16);
    if (mode === 'calm') {
      if (s % 2 === 0) this.lute(t, arp[s] + 12, 0.16);
      if (Math.floor(i / 64) % 2 === 1) this.melodyAt(bar, s, t, e8, 0.09);   // 잔잔: 피리는 한 바퀴 걸러
      return;
    }
    this.lute(t, arp[s] + 12, mode === 'boss' ? 0.13 : 0.15);
    this.melodyAt(bar, s, t, e8, mode === 'boss' ? 0.1 : 0.11, mode === 'boss' ? 0 : 0);
    if (s === 0 || s === 4) this.kick(t, 0.55);
    if (s === 2 || s === 6) this.drum(t, 0.3);
    if (s % 2 === 1) this.tamb(t, 0.12);
    if (mode === 'boss') {
      if (s === 3 || s === 7) this.kick(t, 0.4);
      this.tamb(t + e8 / 2, 0.08);
      if (s === 0) Sound.tone(Sound.musicBus, t, { type: 'sawtooth', f0: midiHz(ch[0]), dur: e8 * 1.5, vol: 0.1, filter: { f: 900 } });
    }
  },
  melodyAt(bar, s, t, e8, v) {
    let pos = 0;
    for (const [m, len] of this.melody[bar]) { if (pos === s) { this.flute(t, m, len * e8, v); return; } pos += len; }
  },
  // 매 프레임: 게임 상태에 맞춰 분위기 선택
  update() {
    if (!Sound.unlocked) return;
    let m = 'calm';
    if (G.state === 'playing') m = G.enemies.some(e => e.alive && e.boss) ? 'boss' : 'battle';
    else if (G.state === 'lost') m = 'none';
    if (m !== this.pending) this.setMode(m);
    Sound.duck(G.paused || !!G.itemPrompt);
    if (this.audio) this.audio.volume = clamp(SETTINGS.musicVolume * (SETTINGS.muted ? 0 : 1) * Sound.duckLevel, 0, 1);
  },
};

// ---------- 성문 ----------
class Gate {
  constructor() {
    this.level = 1; this.maxHp = 0; this.hp = 0;
    this.lastHit = -999; this.flash = 0; this.destroyed = false; this.openAnim = 0;
    this.carpenters = []; this.archers = [];
    this.repairing = false; this.repairAccum = 0; this.repairTextTimer = 0; this.oilTimer = 0;
    this.slots = Gate.buildSlots();
    this.cracks = [];
    for (let i = 0; i < 7; i++) {
      let x = rand(0.15, 0.85), y = rand(0.08, 0.92), a = rand(0, TAU); const pts = [[x, y]];
      for (let j = 0; j < 4; j++) { a += rand(-0.9, 0.9); x = clamp(x + Math.cos(a) * 0.16, 0, 1); y = clamp(y + Math.sin(a) * 0.12, 0, 1); pts.push([x, y]); }
      this.cracks.push(pts);
    }
    this.applyLevel(true);
  }
  get cfg() { return CONFIG.gate.levels[this.level - 1]; }
  get underAttack() { return G.time - this.lastHit < 1.0; }
  // 성문 앞 공격 자리 (반원 모양으로 여러 줄)
  static buildSlots() {
    const cx = MAP.castle.wallX + MAP.castle.wallW, cy = MAP.gate.y, slots = [];
    for (const r of [22, 46, 70, 94, 118, 142]) {
      const arc = Math.PI * 0.85, n = Math.max(1, Math.floor((r * arc) / 24));
      for (let i = 0; i < n; i++) {
        const a = -arc / 2 + arc * (n === 1 ? 0.5 : i / (n - 1));
        slots.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r, r, ground: null, air: null });
      }
    }
    return slots;
  }
  claimSlot(e) {
    const key = e.air ? 'air' : 'ground';
    let best = null, bc = Infinity;
    for (const s of this.slots) {
      if (s[key]) continue;
      const c = s.r * 2 + Math.hypot(s.x - e.x, s.y - e.y);
      if (c < bc) { bc = c; best = s; }
    }
    if (best) best[key] = e;
    return best;
  }

  applyLevel(fill) {
    const c = this.cfg, prevMax = this.maxHp;
    this.maxHp = c.maxHp;
    this.hp = fill ? c.maxHp : Math.min(c.maxHp, this.hp + (c.maxHp - prevMax));
    while (this.archers.length < c.archers) {
      const s = MAP.wallArcherSpots[this.archers.length];
      this.archers.push(new WallArcher(s[0], s[1]));
    }
  }

  takeDamage(amount) {
    if (this.destroyed) return;
    this.hp -= amount; this.lastHit = G.time; this.flash = 0.12;
    Sound.play('gateHit', MAP.gate.x, MAP.gate.y);
    for (const k of this.carpenters) k.goHome();       // 공격받으면 목수는 성 안으로
    if (Math.random() < 0.35) FX.dust(MAP.castle.wallX + MAP.castle.wallW + 4, MAP.gate.y + rand(-30, 30));
    if (this.hp <= 0) {
      this.hp = 0; this.destroyed = true;
      FX.explosion(MAP.gate.x + 10, MAP.gate.y, 0.9); shake(10, 0.6); Sound.play('explosion');
      showBanner('성문이 무너졌습니다!', '#ff6a55', 3);
      if (!G.pendingResult) { G.pendingResult = 'lost'; G.endTimer = 1.8; }
    }
  }

  update(dt) {
    if (this.flash > 0) this.flash -= dt;
    if (this.openAnim > 0) this.openAnim -= dt;
    const c = this.cfg;
    for (const a of this.archers) a.update(dt, c);

    // 3레벨: 성문에 붙은 적에게 끓는 기름 (광역 피해)
    if (c.oilDamage && !this.destroyed) {
      this.oilTimer -= dt;
      if (this.oilTimer <= 0) {
        const ox = MAP.castle.wallX + MAP.castle.wallW, oy = MAP.gate.y;
        if (G.enemies.some(e => e.alive && e.state === 'attack' && !e.air)) {
          this.oilTimer = c.oilInterval;
          for (const e of G.enemies) if (e.alive && !e.air && dist(e.x, e.y, ox, oy) <= c.oilRadius) e.takeDamage(c.oilDamage, 'tower', true);
          for (let i = 0; i < 16; i++) {
            const a = rand(-1.3, 1.3), r = rand(10, c.oilRadius * 0.8);
            FX.puff(ox + Math.cos(a) * r, oy + Math.sin(a) * r, '#6b3510', rand(8, 15), 0.9, 0, 0, 0.7, 0.4);
            FX.add({ k: 'flame', x: ox + Math.cos(a) * r, y: oy + Math.sin(a) * r, vx: 0, vy: -20, g: 0, life: rand(0.3, 0.6), max: 0.6, size: rand(6, 11) });
            if (i % 2) FX.puff(ox + Math.cos(a) * r, oy + Math.sin(a) * r, '#efe8dc', rand(8, 14), 1.4, rand(-6, 6), -30, 0.4, 1.4);
          }
          FX.text(ox + 50, oy - 70, '끓는 기름!', '#ffae5a', 20, 1.2); Sound.play('sizzle', ox, oy);
        } else this.oilTimer = 0.3;
      }
    }

    // 자동 수리: repairDelay초 동안 공격이 없으면 목수 출동
    if (!this.destroyed) {
      const needRepair = this.hp < this.maxHp - 0.01;
      const idle = G.time - this.lastHit;
      if (needRepair && idle >= CONFIG.gate.repairDelay) {
        for (const k of this.carpenters) k.goOut();
        const used = new Set(this.carpenters.map(k => k.idx));
        for (let i = 0; i < c.carpenters; i++) if (!used.has(i)) this.carpenters.push(new Carpenter(i, c.carpenters));
      } else if (!needRepair) {
        for (const k of this.carpenters) k.goHome();
      }
    } else for (const k of this.carpenters) k.goHome();

    let working = 0;
    for (const k of this.carpenters) { k.update(dt); if (k.state === 'work') working++; }
    compact(this.carpenters, k => !k.done);
    this.repairing = working > 0;
    if (working > 0) {
      const before = this.hp;
      this.hp = Math.min(this.maxHp, this.hp + working * c.repairPerCarpenter * dt);
      this.repairAccum += this.hp - before;
      this.repairTextTimer -= dt;
      if (this.repairTextTimer <= 0) {
        this.repairTextTimer = 1;
        if (this.repairAccum >= 1) FX.text(MAP.castle.wallX + MAP.castle.wallW + 40, MAP.gate.y - 58, '+' + Math.round(this.repairAccum), '#7dff6a', 18);
        this.repairAccum = 0;
      }
    } else this.repairTextTimer = 0.3;
  }
}

// ---------- 목수 ----------
class Carpenter {
  constructor(idx, total) {
    const offs = total <= 2 ? [-20, 20] : [-30, 0, 30];
    const oy = offs[idx] != null ? offs[idx] : (idx - (total - 1) / 2) * 26;
    const c = MAP.castle;
    this.idx = idx;
    this.home = { x: c.wallX + c.wallW / 2, y: MAP.gate.y + oy * 0.4 };
    this.work = { x: c.wallX + c.wallW + 18 + (idx % 2) * 4, y: MAP.gate.y + oy };
    this.x = this.home.x; this.y = this.home.y;
    this.state = 'out'; this.face = 0; this.walk = 0; this.done = false;
    this.phase = Math.random() * 3; this.swings = Math.floor((this.phase * 9) / TAU);
  }
  goHome() { if (this.state !== 'in') this.state = 'in'; }
  goOut() { if (this.state === 'in') this.state = 'out'; }
  moveTo(t, dt) {
    const dx = t.x - this.x, dy = t.y - this.y, d = Math.hypot(dx, dy), s = CONFIG.gate.carpenterSpeed * dt;
    this.walk += dt;
    if (d <= s) { this.x = t.x; this.y = t.y; return true; }
    this.x += (dx / d) * s; this.y += (dy / d) * s; this.face = Math.atan2(dy, dx);
    return false;
  }
  update(dt) {
    if (this.state === 'out') { if (this.moveTo(this.work, dt)) { this.state = 'work'; this.face = Math.PI; } }
    else if (this.state === 'work') {
      this.face = Math.PI; this.phase += dt;
      const sw = Math.floor((this.phase * 9) / TAU);
      if (sw !== this.swings) { this.swings = sw; Sound.play('hammer', this.x, this.y); FX.spark(MAP.castle.wallX + MAP.castle.wallW + 1, this.y + rand(-4, 4), '#ffe6a0', 3); }
    } else if (this.state === 'in') { if (this.moveTo(this.home, dt)) this.done = true; }
  }
}

// ---------- 성벽 궁수 ----------
class WallArcher {
  constructor(x, y) { this.x = x; this.y = y; this.cd = rand(0.2, 1); this.aim = 0; this.shootAnim = 0; }
  findTarget(range) {
    let best = null, bs = -Infinity; const r2 = range * range;
    for (const e of G.enemies) {
      if (!e.alive) continue;
      const dx = e.x - this.x, dy = e.y - this.y, d2 = dx * dx + dy * dy;
      if (d2 > r2) continue;
      const score = (e.post ? -1 : e.state === 'walk' ? e.dist / e.route.length : 2) - Math.sqrt(d2) * 0.001;   // 성문에 붙은 적 우선
      if (score > bs) { bs = score; best = e; }
    }
    return best;
  }
  update(dt, gcfg) {
    if (this.shootAnim > 0) this.shootAnim -= dt;
    this.cd -= dt;
    const target = this.findTarget(gcfg.archerRange);
    if (target) this.aim = Math.atan2(target.y - (target.air ? AIR_HEIGHT : 0) - this.y, target.x - this.x);
    if (this.cd <= 0) {
      if (target) {
        this.cd = gcfg.archerInterval * rand(0.9, 1.1); this.shootAnim = 0.18;
        G.projectiles.push(new Arrow(this.x + Math.cos(this.aim) * 10, this.y + Math.sin(this.aim) * 10, target, gcfg.archerDamage));
        Sound.play('bow', this.x, this.y, 0.6);
      } else this.cd = 0;
    }
  }
}

// ---------- 화살 (목표를 따라가며 포물선) ----------
class Arrow {
  constructor(x, y, target, damage, speed, source) {
    this.x = x; this.y = y; this.target = target; this.damage = damage; this.source = source || 'tower';
    this.hostile = source instanceof Enemy;
    this.tx = target.x; this.ty = target.y - (target.air ? AIR_HEIGHT : 0);
    this.speed = speed || CONFIG.wallArcher.arrowSpeed; this.traveled = 0;
    this.total = Math.max(1, dist(x, y, this.tx, this.ty));
    this.z = 0; this.angle = Math.atan2(this.ty - y, this.tx - x); this.done = false;
  }
  update(dt) {
    if (this.target && this.target.alive) { this.tx = this.target.x; this.ty = this.target.y - (this.target.air ? AIR_HEIGHT : 0); }
    const px = this.x, py = this.y - this.z;
    const dx = this.tx - this.x, dy = this.ty - this.y, d = Math.hypot(dx, dy), step = this.speed * dt;
    if (d <= step + 2) {
      this.done = true;
      if (this.target && this.target.alive) { this.target.takeDamage(this.damage, this.source, false, this.crit); FX.spark(this.tx, this.ty, '#fff3b0', 4); if (!this.hostile) Sound.play('hit', this.tx, this.ty, 0.7); }
      return;
    }
    this.x += (dx / d) * step; this.y += (dy / d) * step; this.traveled += step;
    const p = clamp(this.traveled / (this.traveled + d), 0, 1);
    this.z = Math.sin(p * Math.PI) * Math.min(40, this.total * 0.15);
    this.angle = Math.atan2(this.y - this.z - py, this.x - px);
  }
}

// ---------- 병력 생산: 성문에서 고른 병사가 일정 시간마다 1명씩 나옴 ----------
function armyCap() { return CONFIG.army.popCap; }
function popOf(kind) { return CONFIG.army[kind].pop || 1; }
function armyPop() { let n = 0; for (const u of G.soldiers) n += popOf(u.kind); return n; }   // 지금 쓰는 인구
function unitStats(kind) { const L = G.army.lv[kind]; return L ? CONFIG.army[kind].levels[L - 1] : null; }
function updateArmy(dt) {
  const A = G.army, s = unitStats(A.sel);
  A.full = armyPop() + popOf(A.sel) > armyCap();
  if (!s || G.gate.destroyed) return;
  if (A.timer > 0) A.timer = Math.max(0, A.timer - dt);
  if (A.timer <= 0 && !A.full) { A.timer = s.spawnTime; spawnSoldier(A.sel); }
}
function spawnSoldier(kind) {
  const u = new Soldier(kind);
  G.soldiers.push(u); G.stats.trained++;
  FX.dust(u.x, u.y); FX.ring(u.x, u.y, 18, '255,240,180', 0.3);
  G.gate.openAnim = 0.7;
  return u;
}
// 생산할 병사 고르기 (진행 중이던 생산 비율은 유지)
function selectUnit(kind) {
  const A = G.army; if (!A.lv[kind] || A.sel === kind) return;
  const prev = unitStats(A.sel), next = unitStats(kind);
  A.timer = prev ? next.spawnTime * clamp(A.timer / prev.spawnTime, 0, 1) : next.spawnTime;
  A.sel = kind;
}
// 훈련 시설 건설(레벨 0 → 1) / 강화
function upgradeFacility(kind) {
  const A = G.army, c = CONFIG.army[kind], L = A.lv[kind];
  if (L >= c.levels.length || G.state !== 'playing') return;
  const cost = c.levels[L].cost;
  if (G.gold < cost) { notEnoughGold(); return; }
  G.gold -= cost; A.lv[kind] = L + 1; G.stats.built++;
  const st = unitStats(kind), name = CONFIG.soldiers[kind].name;
  for (const u of G.soldiers) if (u.kind === kind) u.applyStats(A.lv[kind], st);
  const gx = MAP.castle.wallX + MAP.castle.wallW / 2;
  FX.ring(gx, MAP.gate.y, 70, '255,215,90', 0.5); FX.spark(gx, MAP.gate.y - 20, '#ffe08a', 10);
  if (L === 0) { selectUnit(kind); showBanner(`${c.facility} 건설! 이제 성문에서 ${josa(name, '이', '가')} 나옵니다`, '#ffe08a', 2.6); Sound.play('build'); }
  else { toast(`${c.facility} Lv.${L + 1} — ${name} 강화!`, '#ffd36b'); Sound.play('upgrade'); }
}

// 대형: 앞쪽(적이 있는 방향)을 정하고, 근접 병사는 영웅 앞줄 · 원거리 병사는 영웅 뒷줄에 자리를 배정
function updateFormation(dt) {
  const h = G.hero, F = CONFIG.formation, alive = h && !h.dead;
  const cx = alive ? h.x : MAP.heroSpawn.x + 70, cy = alive ? h.y : MAP.heroSpawn.y;
  let want = null;                                       // 앞쪽: 이동 중이면 가는 쪽 → 기지 공격 중이면 기지 쪽 → 가까운 적 쪽
  if (alive && h.mode === 'move' && h.path.length) { const wp = h.path[h.path.length - 1]; if (dist(cx, cy, wp.x, wp.y) > 40) want = Math.atan2(wp.y - cy, wp.x - cx); }
  if (want == null && alive && h.siegeTarget) want = Math.atan2(h.siegeTarget.y - cy, h.siegeTarget.x - cx);
  if (want == null) {
    let bd = 380, be = null;
    for (const e of G.enemies) { if (!e.alive) continue; const d = dist(cx, cy, e.x, e.y); if (d < bd) { bd = d; be = e; } }
    if (be) want = Math.atan2(be.y - cy, be.x - cx); else if (!alive) want = 0;
  }
  if (want != null) { const d = Math.atan2(Math.sin(want - G.front), Math.cos(want - G.front)); G.front += clamp(d, -F.turnRate * dt, F.turnRate * dt); }
  let fi = 0, bi = 0;                                    // 앞줄: 기사 → 보병 / 뒷줄: 궁수 → 마법사 → 성직자
  for (const kind of ['knight', 'footman', 'archer', 'mage', 'cleric']) for (const u of G.soldiers) if (!u.dead && u.kind === kind) u.fIdx = u.cfg.line === 'front' ? fi++ : bi++;
  G.fCount = fi; G.bCount = bi; G.fCenter = { x: cx, y: cy };
}

// ---------- 병사 ----------
// 행동 우선순위: 1) 주변 적과 싸움  2) 영웅이 적 기지를 공격 중이면 함께 공격
//               3) 영웅 앞(근접) / 뒤(원거리)에 줄을 맞춰 대형 유지  4) 영웅 사망 중이면 성문 앞에 모임
class Soldier {
  constructor(kind) {
    this.kind = kind; this.cfg = CONFIG.soldiers[kind];
    this.radius = this.cfg.radius; this.maxBlock = this.cfg.maxBlock;
    this.applyStats(G.army.lv[kind], unitStats(kind), true);
    this.x = MAP.castle.wallX + MAP.castle.wallW + 16 + rand(0, 8); this.y = MAP.gate.y + rand(-16, 16); this.face = 0;
    this.engaged = new Set(); this.target = null; this.retarget = 0; this.fIdx = 0;
    this.atkTimer = rand(0, 0.5); this.attackAnim = 0; this.flash = 0;
    this.stun = 0; this.root = 0; this.push = null;      // 보스 스킬: 기절 / 묶임 / 밀려남
    this.rush = null; this.skillT = 3 + Math.random() * 5;   // 5레벨 자동 스킬 (기사 돌격 중 / 다음 사용까지)
    this.sup = newSup(); this.castT = 1 + Math.random() * 2;    // 성직자 강화 효과 / 성직자 다음 시전까지
    this.lastHit = -999; this.dead = false; this.moving = false; this.walkAnim = Math.random() * 3;
  }
  applyStats(level, s, fresh) {
    const ratio = fresh ? 1 : this.hp / this.maxHp;
    this.level = level; this.stats = s; this.maxHp = s.hp; this.hp = this.maxHp * ratio; this.damage = s.damage; this.armor = s.armor;
    this.range = s.range || this.cfg.range;                       // 궁수·마법사: 레벨이 오를수록 사거리 증가
  }
  get dash() { return this.rush; }                                // 돌격 중에는 붙잡히지 않음
  get maxLevel() { return this.level >= CONFIG.army[this.kind].levels.length; }
  get passive() { return this.level >= CONFIG.army.passiveLevel ? CONFIG.army[this.kind].passive : null; }   // 10레벨 패시브
  atkMul() { const p = this.passive; return supHaste(this) * (p && p.attackSpeed ? 1 - p.attackSpeed : 1); }     // 공격 간격 배율
  outDamage() { const p = this.passive; return this.damage * supMight(this) * (p && p.damage ? 1 + p.damage : 1); }
  get alive() { return !this.dead; }
  takeDamage(amount) {
    if (this.dead) return;
    const p = this.passive, stal = p && p.hpRatio && this.hp <= this.maxHp * p.hpRatio ? p.armor : 0;   // 보병 불굴
    this.hp -= amount * (1 - Math.min(0.85, this.armor + supGuard(this) + stal)); this.lastHit = G.time; this.flash = 0.1;
    if (this.hp <= 0) this.die();
  }
  releaseAll() { for (const e of [...this.engaged]) e.release(); this.engaged.clear(); }
  die() { this.dead = true; this.hp = 0; this.releaseAll(); FX.poof(this.x, this.y, 10); }

  // 대형 자리: 앞쪽 방향(G.front) 기준으로 근접은 영웅 앞, 원거리는 영웅 뒤에 가로줄
  formationPos() {
    const F = CONFIG.formation, c = G.fCenter || { x: MAP.heroSpawn.x + 70, y: MAP.heroSpawn.y }, ca = Math.cos(G.front), sa = Math.sin(G.front);
    const front = this.cfg.line === 'front', n = front ? G.fCount : G.bCount;
    const row = Math.floor(this.fIdx / F.perRow), rowN = Math.min(F.perRow, n - row * F.perRow), col = this.fIdx % F.perRow;
    const side = (col - (rowN - 1) / 2) * F.spacing + (row % 2 ? F.spacing * 0.5 : 0);
    const fwd = front ? F.frontDist + row * F.rowGap - Math.abs(side) * 0.15 : -(F.backDist + row * F.rowGap) + Math.abs(side) * 0.1;
    return Nav.clampTarget(c.x + ca * fwd - sa * side, c.y + sa * fwd + ca * side);
  }
  anchorCenter() { const h = G.hero; return h && !h.dead ? h : { x: MAP.heroSpawn.x + 70, y: MAP.heroSpawn.y }; }

  stepToward(tx, ty, dt) {
    if (this.root > 0) return;
    const wp = Nav.route(this, { x: tx, y: ty })[0];
    const dx = wp.x - this.x, dy = wp.y - this.y, d = Math.hypot(dx, dy);
    if (d < 0.8) return;
    const k = Math.min(1, (this.cfg.speed * dt) / d), nx = this.x + dx * k, ny = this.y + dy * k;
    this.face = Math.atan2(dy, dx); this.moving = true; this.walkAnim += dt;
    if (!Nav.blocked(nx, ny)) { this.x = nx; this.y = ny; }
  }

  get detect() { return this.cfg.ranged ? Math.max(this.cfg.detect, this.range + 15) : this.cfg.detect; }
  // 싸울 적: 나를 붙잡은 적 → 내 근처(탐지 범위)의 적. 영웅과 멀리 떨어져 있어도 근처 적은 무시하지 않음
  findEnemy() {
    const c = this.cfg, det = this.detect; let best = null, bd = Infinity;
    for (const e of this.engaged) { if (!e.alive) continue; const d = dist(this.x, this.y, e.x, e.y); if (d < bd) { bd = d; best = e; } }
    if (best) return best;
    for (const e of G.enemies) {
      if (!e.alive || (e.air && !c.canHitAir && !e.cfg.lowFly)) continue;
      const d = dist(this.x, this.y, e.x, e.y) - (e.post ? 30 : 0);       // 기지 수비병은 조금 덜 우선
      if (d > det) continue;
      if (d < bd) { bd = d; best = e; }
    }
    return best;
  }

  hit(t, isBase) {
    this.face = Math.atan2(t.y - this.y, t.x - this.x);
    if (this.atkTimer > 0) return;
    const c = this.cfg, dmg = this.outDamage(), P = this.passive;
    this.atkTimer = c.attackInterval * this.atkMul(); this.attackAnim = 0.25;
    if (c.ranged) {
      if (isBase) { const d = Math.round(dmg * c.baseDamageMul); t.takeDamage(d); FX.spark(t.x + rand(-30, 30), t.y + rand(-20, 20), c.magic ? '#d6b8ff' : '#fff3b0', 2); }
      else if (c.magic) G.projectiles.push(new MagicBolt(this.x, this.y - 8, t, { damage: dmg, splash: c.splash * (P && P.splash ? 1 + P.splash : 1), splashRatio: P && P.ratio, slow: this.stats.slow, slowTime: this.stats.slowTime }, c, this));
      else G.projectiles.push(new Arrow(this.x, this.y - 4, t, dmg, 650, this));
      Sound.play(c.magic ? 'magic' : 'bow', this.x, this.y, c.magic ? 0.35 : 0.45);
    } else if (isBase) {
      const d = Math.round(dmg * c.baseDamageMul); t.takeDamage(d); Sound.play('thud', t.x, t.y, 0.5);
      FX.spark(this.x + Math.cos(this.face) * 16, this.y + Math.sin(this.face) * 16, '#ffe08a', 2);
    } else { t.takeDamage(dmg, this); FX.spark(t.x, t.y, '#ffffff', 2); FX.arc(t.x, t.y, this.face, 11, 1.2, '255,255,255', 0.12); Sound.play('sword', t.x, t.y, 0.5); }
  }

  update(dt, idx) {
    if (this.attackAnim > 0) this.attackAnim -= dt;
    if (this.flash > 0) this.flash -= dt;
    if (this.root > 0) this.root -= dt;
    this.atkTimer -= dt; this.moving = false;
    const c = this.cfg, S = CONFIG.soldiers;
    if (G.time - this.lastHit >= S.regenDelay && this.hp < this.maxHp) this.hp = Math.min(this.maxHp, this.hp + this.maxHp * S.regenRate * dt);
    if (this.push) { pushStep(this, dt); return; }                 // 밀려나는 중
    if (this.rush) { this.updateRush(dt); return; }                 // 기사 돌격 중
    if (this.stun > 0) { this.stun -= dt; return; }                 // 기절
    const a = this.anchorCenter();
    tickSup(this, dt);
    if (this.level >= CONFIG.army.skillLevel && CONFIG.army[this.kind].skill) {   // 5레벨부터: 자동 스킬
      this.skillT -= dt;
      if (this.skillT <= 0) this.skillT = this.useSkill(CONFIG.army[this.kind].skill) ? CONFIG.army[this.kind].skill.cooldown * rand(0.9, 1.15) : 0.5;   // 병사마다 조금씩 다르게
      if (this.rush) return;
    }

    if (c.support) { this.supportUpdate(dt, idx); return; }         // 성직자: 싸우지 않고 강화 마법

    // 1) 적과 싸움 (영웅에게서 너무 멀어진 적은 내 근처에 없을 때만 포기)
    if (this.target && (!this.target.alive || (dist(this.target.x, this.target.y, a.x, a.y) > S.leash + 30 && dist(this.target.x, this.target.y, this.x, this.y) > this.detect + 40))) this.target = null;
    this.retarget -= dt;
    if (!this.target || this.retarget <= 0) { this.retarget = 0.3; this.target = this.findEnemy(); }
    const e = this.target;
    if (e) {
      const d = dist(this.x, this.y, e.x, e.y);
      const reach = c.ranged ? this.range : this.radius + e.radius + c.range;
      if (d > reach) this.stepToward(e.x, e.y, dt); else this.hit(e, false);
      return;
    }
    // 2) 영웅이 적 기지를 공격 중이면 함께 공격
    const h = G.hero, b = h && !h.dead ? h.siegeTarget : null;
    if (b && b.alive) {
      const bodyR = b.m.hitRadius * 0.8;
      const ang = Math.atan2(this.y - b.y, this.x - b.x);
      const want = c.ranged ? bodyR + this.range * 0.7 : bodyR + this.radius + 4;
      const d = dist(this.x, this.y, b.x, b.y);
      if (d > want + (c.ranged ? 20 : 6)) {
        const spread = ((idx % 7) - 3) * 0.18;
        this.stepToward(b.x + Math.cos(ang + spread) * want, b.y + Math.sin(ang + spread) * want, dt);
      } else this.hit(b, true);
      return;
    }
    // 3, 4) 대형 유지 (영웅 앞·뒤 / 영웅 사망 시 성문 앞)
    const f = this.formationPos();
    if (dist(this.x, this.y, f.x, f.y) > 4) this.stepToward(f.x, f.y, dt);
    else this.face = G.front;
  }
}

// ---------- 성직자 강화 효과 (병사·영웅 공통) ----------
// haste: 공격 간격 -v / guard: 방어력 +v / might: 공격력 +v. 각각 남은 시간(t)과 세기(v)
function newSup() { return { haste: 0, hasteV: 0, guard: 0, guardV: 0, might: 0, mightV: 0 }; }
function tickSup(u, dt) { const S = u.sup; if (S.haste > 0) S.haste -= dt; if (S.guard > 0) S.guard -= dt; if (S.might > 0) S.might -= dt; }
function supHaste(u) { return u.sup.haste > 0 ? 1 - u.sup.hasteV : 1; }
function supGuard(u) { return u.sup.guard > 0 ? u.sup.guardV : 0; }
function supMight(u) { return u.sup.might > 0 ? 1 + u.sup.mightV : 1; }
const SUP_TYPES = [['haste', '공격 속도', '255,220,90'], ['guard', '방어력', '120,190,255'], ['might', '공격력', '255,110,80']];
Soldier.prototype.supportUpdate = function (dt, idx) {
  const st = this.stats, h = G.hero;
  this.castT -= dt;
  if (this.castT <= 0) {
    const near = [];
    if (h && !h.dead && dist(h.x, h.y, this.x, this.y) <= st.radius) near.push(h);
    for (const u of G.soldiers) if (!u.dead && u !== this && dist(u.x, u.y, this.x, this.y) <= st.radius) near.push(u);
    const fighting = near.some(u => u === h ? G.enemies.some(e => e.alive && dist(e.x, e.y, h.x, h.y) < 260) : u.target || u.engaged.size);
    if (near.length && fighting) {                                 // 싸우고 있는 아군이 있을 때만 시전
      this.castT = st.interval;
      const types = SUP_TYPES.slice().sort(() => Math.random() - 0.5).slice(0, this.passive ? 2 : 1);   // 10레벨 축복: 두 가지
      for (const [k, , col] of types) {
        const v = k === 'guard' ? st.power * 0.8 : st.power;
        for (const u of near) { u.sup[k] = st.duration; u.sup[k + 'V'] = v; }
        FX.ring(this.x, this.y, st.radius, col, 0.5);
      }
      for (const u of near) FX.spark(u.x, u.y - 10, `rgb(${types[0][2]})`, 2);
      this.attackAnim = 0.4; Sound.play('heal', this.x, this.y, 0.18);
    } else this.castT = 0.5;
  }
  // 이동: 영웅이 기지를 공격 중이면 조금 떨어진 곳, 아니면 뒷줄 대형
  const b = h && !h.dead ? h.siegeTarget : null;
  if (b && b.alive) {
    const ang = Math.atan2(this.y - b.y, this.x - b.x), want = b.m.hitRadius * 0.8 + 150, spread = ((idx % 5) - 2) * 0.25;
    if (dist(this.x, this.y, b.x, b.y) > want + 25 || dist(this.x, this.y, b.x, b.y) < want - 40) this.stepToward(b.x + Math.cos(ang + spread) * want, b.y + Math.sin(ang + spread) * want, dt);
    return;
  }
  const f = this.formationPos();
  if (dist(this.x, this.y, f.x, f.y) > 4) this.stepToward(f.x, f.y, dt); else this.face = G.front;
};

// 병사 자동 스킬 (5레벨부터) — Soldier에 붙임
Soldier.prototype.useSkill = function (sk) {
  const ground = e => e.alive && (!e.air || e.cfg.lowFly);
  switch (sk.id) {
    case 'prayer': {                                                 // 성직자: 치유의 기도 (주변 아군 회복)
      const h = G.hero, list = [];
      if (h && !h.dead && h.hp < h.maxHp * 0.9 && dist(h.x, h.y, this.x, this.y) <= sk.radius) list.push(h);
      for (const u of G.soldiers) if (!u.dead && u.hp < u.maxHp * 0.9 && dist(u.x, u.y, this.x, this.y) <= sk.radius) list.push(u);
      if (!list.length) return false;
      for (const u of list) { const n = u.maxHp * sk.heal; u.hp = Math.min(u.maxHp, u.hp + n); FX.spark(u.x, u.y - 8, '#9dff8a', 3); }
      FX.ring(this.x, this.y, sk.radius, '140,255,140', 0.5); Sound.play('heal', this.x, this.y, 0.3);
      return true;
    }
    case 'bash': {                                                   // 보병: 방패 강타 (주변 적 기절 + 큰 피해)
      const list = G.enemies.filter(e => ground(e) && dist(e.x, e.y, this.x, this.y) <= sk.radius + e.radius);
      if (!list.length) return false;
      for (const e of list) { e.takeDamage(this.outDamage() * sk.damageMul, this); e.stun = Math.max(e.stun, sk.stun); }
      this.attackAnim = 0.25; FX.ring(this.x, this.y, sk.radius, '255,230,150', 0.35); FX.spark(this.x, this.y, '#ffe08a', 5); Sound.play('bash', this.x, this.y, 0.35);
      return true;
    }
    case 'volley': {                                                 // 궁수: 연속 사격 (여러 적에게 화살)
      const list = G.enemies.filter(e => e.alive && dist(e.x, e.y, this.x, this.y) <= this.range).sort((p, q) => dist(p.x, p.y, this.x, this.y) - dist(q.x, q.y, this.x, this.y));
      if (!list.length) return false;
      for (let i = 0; i < sk.arrows; i++) { const t = list[i % list.length]; G.projectiles.push(new Arrow(this.x + rand(-4, 4), this.y - 4 + rand(-4, 4), t, this.outDamage() * sk.damageMul, 700 + i * 40, this)); }
      this.attackAnim = 0.25; Sound.play('rain', this.x, this.y, 0.3);
      return true;
    }
    case 'charge': {                                                 // 기사: 돌격 (적에게 달려가며 길 위의 적을 밀쳐냄)
      let t = null, bd = sk.range;
      for (const e of G.enemies) { if (!ground(e) || e.post) continue; const d = dist(e.x, e.y, this.x, this.y); if (d > 50 && d < bd) { bd = d; t = e; } }
      if (!t) return false;
      const a = Math.atan2(t.y - this.y, t.x - this.x), L = bd + 30;
      this.releaseAll(); this.face = a;
      this.rush = { vx: Math.cos(a) * sk.speed, vy: Math.sin(a) * sk.speed, t: L / sk.speed, hit: new Set(), sk };
      Sound.play('charge', this.x, this.y, 0.35);
      return true;
    }
    case 'fireball': {                                               // 마법사: 화염구 (적이 가장 많이 모인 곳)
      let t = null, bn = 0;
      for (const e of G.enemies) {
        if (!e.alive || dist(e.x, e.y, this.x, this.y) > this.range) continue;
        let n = 0; for (const o of G.enemies) if (o.alive && dist(o.x, o.y, e.x, e.y) <= sk.radius) n++;

      }

Soldier.prototype.updateRush = function (dt) {

function isBaseTarget(t) { return t instanceof EnemyBase; }
// 밀려남 (영웅·병사 공통, 보스 스킬): 벽·강에 막히면 멈춤

}

// ---------- 보스 등장 ----------

const STAT_LABEL = { damage: '공격력', hp: '체력', armor: '방어력', cdr: '스킬 쿨타임', range: '사거리', speed: '이동 속도', attackSpeed: '공격 속도', crit: '치명타 확률', spellPower: '마법 피해', mana: '최대 마나', manaRegen: '마나 회복' };
const PCT_STATS = new Set(['armor', 'cdr', 'attackSpeed', 'crit', 'spellPower']);
function fmtStat(k, v) {

  return `${STAT_LABEL[k]} +${Math.round(v * 10) / 10}${k === 'manaRegen' ? '/초' : ''}`;

function rarityOf(item) { return CONFIG.items.rarities.find(r => r.id === item.rarity); }

// 영웅 장비 보관: 직업별로 저장 → 다음 스테이지 · 다시 하기에서도 그대로 착용 (브라우저에 저장)
const SavedGear = {

// 바닥에 떨어진 아이템: 영웅이 위로 지나가면 획득

// ---------- 영웅 스킬 효과 ----------
function nearestPathPoint(x, y) {
  let best = null, bd = Infinity;
  for (const k in MAPDATA.seg) for (const q of MAPDATA.seg[k]) { const d = (q.x - x) ** 2 + (q.y - y) ** 2; if (d < bd) { bd = d; best = q; } }

// 일정 시간 지속되는 범위 효과: 화살비(물리 지속 피해), 얼음 폭풍(마법 지속 피해 + 둔화)
class Zone {
  constructor(kind, x, y, r, dur, o) {
    this.kind = kind; this.x = x; this.y = y; this.r = r; this.dur = dur; this.o = o;

        if (this.kind === 'arrowRain') e.takeDamage(this.o.dps * 0.25, this.o.src);

}

// 궁사 덫: 처음 밟은 순간 근처 지상 적 모두 속박 + 지속 피해, 한 번 쓰면 사라짐
class Trap {
  constructor(x, y, sk, dps, src) {

    this.life = sk.life; this.done = false; this.anim = 0;
  }
  update(dt) {
    this.life -= dt; this.anim += dt;
    if (this.life <= 0) { this.done = true; return; }
    const hit = G.enemies.filter(e => e.alive && !e.air && !e.post && dist(e.x, e.y, this.x, this.y) <= this.r + e.radius * 0.6);
    if (!hit.length) return;
    for (const e of G.enemies) {
      if (!e.alive || e.air || dist(e.x, e.y, this.x, this.y) > this.r + 14) continue;
      e.root = Math.max(e.root, this.rootTime); e.dot = { dps: this.dps, t: this.rootTime, src: this.src };
    }
    this.done = true;
    FX.spark(this.x, this.y, '#d0d0d0', 8); FX.ring(this.x, this.y, this.r + 10, '230,230,230', 0.3);
    FX.text(this.x, this.y - 30, '속박!', '#e8e0c8', 16, 0.9); Sound.play('trapSnap', this.x, this.y);
