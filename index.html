const Camera = {
  x: 0, y: 0, zoom: 1, topPad: 0, botPad: 0, inited: false,
  viewW() { return CONFIG.view.width / this.zoom; },
  viewH() { return CONFIG.view.height / this.zoom; },
  minZoom() { return Math.max(CONFIG.view.width / CONFIG.world.width, CONFIG.view.height / CONFIG.world.height); },   // 지도 전체가 보이는 배율
  canPan() { return this.viewW() < CONFIG.world.width - 0.5 || this.viewH() < CONFIG.world.height - 0.5; },
  clamp() {
    const W = CONFIG.world.width, H = CONFIG.world.height, vw = this.viewW(), vh = this.viewH();
    const tp = this.topPad / this.zoom, bp = this.botPad / this.zoom;   // 위·아래 HUD에 가리지 않도록 여유
    this.x = vw >= W ? (W - vw) / 2 : clamp(this.x, 0, W - vw);
    this.y = vh >= H + tp + bp ? (H - vh) / 2 + (bp - tp) / 2 : clamp(this.y, -tp, H - vh + bp);
  },
  setZoom(z) {
    const cx = this.x + this.viewW() / 2, cy = this.y + this.viewH() / 2;
    this.zoom = clamp(z, this.minZoom(), CONFIG.view.maxZoom);
    this.x = cx - this.viewW() / 2; this.y = cy - this.viewH() / 2; this.clamp();
  },
  // 화면 좌표 (sx, sy) 아래의 지도 지점을 고정한 채 확대/축소
  zoomAt(z, sx, sy) {
    this.goal = null;
    const w = this.toWorld(sx, sy);
    this.zoom = clamp(z, this.minZoom(), CONFIG.view.maxZoom);
    this.x = w.x - sx / this.zoom; this.y = w.y - sy / this.zoom; this.clamp();
  },
  centerOn(wx, wy) { this.goal = null; this.x = wx - this.viewW() / 2; this.y = wy - this.viewH() / 2; this.clamp(); },
  // 부드럽게 이동 (메뉴가 대상을 가리지 않도록 화면을 옮길 때)
  goal: null,
  glideTo(x, y) { this.goal = { x, y }; },
  glide(dt) {
    if (!this.goal) return;
    const k = Math.min(1, dt * 8), ox = this.x, oy = this.y;
    this.x += (this.goal.x - this.x) * k; this.y += (this.goal.y - this.y) * k; this.clamp();
    if (Math.abs(this.x - ox) < 0.3 && Math.abs(this.y - oy) < 0.3) this.goal = null;   // 도착(또는 가장자리에 막힘)
  },
  toWorld(sx, sy) { return { x: sx / this.zoom + this.x, y: sy / this.zoom + this.y }; },
};

const Input = {
  pointers: new Map(),
  init(cv) {
    cv.addEventListener('pointerdown', e => this.down(e));
    cv.addEventListener('pointermove', e => this.move(e));
    cv.addEventListener('pointerup', e => this.up(e));
    cv.addEventListener('pointercancel', e => this.cancel(e));
    cv.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('gesturestart', e => e.preventDefault());
    window.addEventListener('keydown', e => this.key(e));
    window.addEventListener('keyup', e => this.keys.delete(e.code));
    window.addEventListener('blur', () => this.keys.clear());
    cv.addEventListener('wheel', e => {                                    // 마우스 휠: 확대/축소
      e.preventDefault();
      const v = this.toVirtual(e);
      Camera.zoomAt(Camera.zoom * Math.exp(-e.deltaY * 0.0015), v.x, v.y);
    }, { passive: false });
  },
  grabFocus() {
    if (document.activeElement === canvas && document.hasFocus()) return;
    try { window.focus(); canvas.focus({ preventScroll: true }); } catch (_) {}
  },
  keys: new Set(),     // 누르고 있는 키 (방향키 화면 이동)
  pinch: null,         // 두 손가락 확대/축소 상태
  toVirtual(e) {
    const r = canvas.getBoundingClientRect();
    return { x: ((e.clientX - r.left) * CONFIG.view.width) / r.width, y: ((e.clientY - r.top) * CONFIG.view.height) / r.height };
  },
  threshold() { return (10 * CONFIG.view.width) / canvas.getBoundingClientRect().width; },   // 10 CSS px
  down(e) {
    e.preventDefault();
    this.grabFocus();                                        // 키보드 단축키가 먹도록 (웹페이지 안에 끼워 넣어 실행할 때 필요)
    Sound.unlock();                                          // 첫 터치/클릭에 소리 켜기 (휴대폰 정책)
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (_) {} }
    const v = this.toVirtual(e), item = UI.hit(v.x, v.y);
    this.hoverScreen = v;
    const p = { sx: v.x, sy: v.y, lx: v.x, ly: v.y, moved: false, item };
    this.pointers.set(e.pointerId, p);
    if (item && item.id === 'minimap') { p.mini = item; p.moved = true; minimapJump(v.x, v.y, item); return; }   // 미니맵: 누른 곳으로 화면 이동
    if (item && item.id) UI.pressed = item.id;
    const free = [...this.pointers.values()].filter(q => !q.item);
    if (free.length === 2) {                                                // 두 손가락 → 확대/축소 시작
      const [a, b] = free;
      this.pinch = { d0: Math.max(10, Math.hypot(a.lx - b.lx, a.ly - b.ly)), z0: Camera.zoom };
      a.moved = b.moved = true;
    }
  },
  hover: null,      // 마우스 위치(지도 좌표) — 조준 미리보기용
  hoverScreen: null, // 마우스 위치(화면 좌표)
  move(e) {
    const v = this.toVirtual(e);
    this.hover = Camera.toWorld(v.x, v.y); this.hoverScreen = v;
    const p = this.pointers.get(e.pointerId); if (!p) return;
    if (p.mini) { minimapJump(v.x, v.y, p.mini); return; }
    if (!p.moved && Math.hypot(v.x - p.sx, v.y - p.sy) > this.threshold()) {
      p.moved = true;
      if (p.item && UI.pressed === p.item.id) UI.pressed = null;
    }
    const free = [...this.pointers.values()].filter(q => !q.item);
    if (this.pinch && free.length === 2 && !p.item) {                      // 두 손가락: 가운데 지점을 고정하고 확대/축소 + 이동
      const [a, b] = free, oldMx = (a.lx + b.lx) / 2, oldMy = (a.ly + b.ly) / 2;
      p.lx = v.x; p.ly = v.y;
      const mx = (a.lx + b.lx) / 2, my = (a.ly + b.ly) / 2, d = Math.hypot(a.lx - b.lx, a.ly - b.ly);
      Camera.x -= (mx - oldMx) / Camera.zoom; Camera.y -= (my - oldMy) / Camera.zoom;
      Camera.zoomAt(this.pinch.z0 * d / this.pinch.d0, mx, my);
      return;
    }
    if (p.moved && !p.item && free.length === 1 && Camera.canPan()) {      // 드래그로 화면 이동
      Camera.goal = null;
      Camera.x -= (v.x - p.lx) / Camera.zoom; Camera.y -= (v.y - p.ly) / Camera.zoom; Camera.clamp();
    }
    p.lx = v.x; p.ly = v.y;
  },
  up(e) {
    const p = this.pointers.get(e.pointerId); if (!p) return;
    this.pointers.delete(e.pointerId);
    if (this.pinch && [...this.pointers.values()].filter(q => !q.item).length < 2) this.pinch = null;
    const v = this.toVirtual(e);
    if (!p.moved) {
      if (p.item) { if (p.item.id) { const it = UI.hit(v.x, v.y); if (it && it.id === p.item.id && it.onTap) { Sound.play('click'); it.onTap(); } } }
      else onWorldTap(Camera.toWorld(v.x, v.y));
    }
    UI.pressed = null;
  },
  cancel(e) { this.pointers.delete(e.pointerId); this.pinch = null; UI.pressed = null; },
  key(e) {   // 키보드는 보조 단축키
    Sound.unlock();
    if (e.code.startsWith('Arrow')) { this.keys.add(e.code); e.preventDefault(); return; }
    if (e.repeat) return;
    if (G.itemPrompt) { if (e.code === 'Enter' || e.code === 'NumpadEnter') resolveItemPrompt(true); else if (e.code === 'Escape') resolveItemPrompt(false); e.preventDefault(); return; }
    switch (e.code) {
      case 'Space': case 'Enter': case 'NumpadEnter':
        e.preventDefault();
        if (G.state === 'title') openSelect();
        else if (G.state === 'select') startGame(selectedHero);
        else if (G.state === 'won' && G.stageIdx < CONFIG.stages.length - 1) nextStage();
        else if (G.state === 'won' || G.state === 'lost') startGame(G.heroType, G.stageIdx);
        else if (e.code === 'Space') togglePause();
        break;
      case 'Digit1': case 'Digit2': case 'Digit3': case 'Digit4': case 'Digit5': case 'Numpad1': case 'Numpad2': case 'Numpad3': case 'Numpad4': case 'Numpad5': {
        const n = +e.code.slice(-1) - 1;
        if (G.state === 'select') { if (HERO_ORDER[n]) pickHero(HERO_ORDER[n]); }
        else if (G.state === 'playing' && !G.paused) armyCardTap(CONFIG.army.order[n], true);
        break;
      }
      case 'Escape': if (G.aim) G.aim = null; else if (G.sel) G.sel = null; else togglePause(); break;
      case 'KeyP': togglePause(); break;
      case 'KeyF': toggleSpeed(); break;
      case 'KeyQ': useSkill(0); break;
      case 'KeyW': useSkill(1); break;
      case 'KeyE': useSkill(2); break;
      case 'KeyR': useSkill(3); break;
      case 'KeyH': focusHero(); break;
      case 'Minus': case 'NumpadSubtract': Camera.setZoom(Camera.zoom / 1.2); break;
      case 'Equal': case 'NumpadAdd': Camera.setZoom(Camera.zoom * 1.2); break;
    }
  },
  // 방향키로 화면 이동 (매 프레임)
  panKeys(dt) {
    if (!this.keys.size) return;
    const sp = 700 * dt / Camera.zoom;
    if (this.keys.has('ArrowLeft')) Camera.x -= sp;
    if (this.keys.has('ArrowRight')) Camera.x += sp;
    if (this.keys.has('ArrowUp')) Camera.y -= sp;
    if (this.keys.has('ArrowDown')) Camera.y += sp;
    Camera.clamp();
  },
};

function onWorldTap(w) {
  if (G.state !== 'playing' || G.paused) return;
  const h = G.hero;
  G.itemInfo = null;                                       // 아이템 정보창 닫기
  // 방향/지점 지정 스킬 조준 중이면 → 그 방향으로 스킬 사용
  if (G.aim) { const i = G.aim.skill; G.aim = null; if (h) h.cast(i, w.x, w.y); return; }
  if (G.sel) { G.sel = null; return; }   // 메뉴가 열려 있으면 빈 곳 탭은 메뉴 닫기만
  // 테스트 옵션: 기지 탭 → 바로 피해
  if (CONFIG.debug.tapBaseDamage > 0) {
    for (const b of G.bases) {
      if (!b.enabled || !b.alive) continue;
      if (dist(w.x, w.y, b.x, b.y) <= b.m.hitRadius) {
        b.takeDamage(CONFIG.debug.tapBaseDamage);
        FX.text(w.x, w.y - 20, '-' + CONFIG.debug.tapBaseDamage, '#ffdd55', 24);
        FX.spark(w.x, w.y, '#ffd36b', 8);
        return;
      }
    }
  }
  if (!h || h.dead) { FX.ring(w.x, w.y, 18, '255,255,255', 0.3); return; }
  // 적 기지를 탭 → 영웅이 달려가서 기지 공격
  for (const b of G.bases) {
    if (b.enabled && b.alive && dist(w.x, w.y, b.x, b.y) <= b.m.hitRadius) {
      if (b.protectedByBoss) FX.text(b.x, b.y - 60, `${josa(G.finalBoss.cfg.name, '을', '를')} 먼저 처치하세요!`, '#ff8a6a', 20, 1.4);
      h.commandAttackBase(b); return;
    }
  }
  h.commandMove(w.x, w.y);   // 빈 곳 탭 → 이동
}

function useSkill(i) {
  const h = G.hero;
  if (!h || G.state !== 'playing' || G.paused) return;
  const sk = h.cfg.skills[i]; if (!sk) return;
  if (sk.minLevel && h.level < sk.minLevel) { toast(`${sk.name}: 영웅 ${sk.minLevel}레벨부터 쓸 수 있어요`, '#ffb09a'); Sound.play('error'); return; }
  if (sk.target !== 'none') {                       // 버튼 → 지도에서 방향/위치 탭
    if (G.aim && G.aim.skill === i) { G.aim = null; return; }
    if (h.canCast(i)) { G.aim = { skill: i }; G.sel = null; }
    return;
  }
  G.aim = null;
  h.cast(i);
}
// ---------- 골드 부족 알림 ----------
function notEnoughGold() {
  toast('골드가 부족합니다', '#ff8a75'); Sound.play('error');
  G.goldFlashUntil = realTime + 0.7;
}
function toast(text, color = '#ffe7a8') { G.toast = { text, color, until: realTime + 1.8 }; }

function focusHero() {
  const h = G.hero; if (!h) return;
  if (h.dead) Camera.centerOn(MAP.heroSpawn.x + 200, MAP.heroSpawn.y); else Camera.centerOn(h.x, h.y);
}

// ==========================================================================
// 8. UI — HUD, 버튼, 오버레이 (즉시 모드: 매 프레임 그리면서 버튼 영역 등록)
// ==========================================================================
const UI = {
  k: 1,                // 작은 화면에서 버튼을 손가락 크기로 키우는 배율
  kt: 1,               // 상단 줄 전용 배율 (화면 폭에 맞춰 k보다 작아질 수 있음)
  items: [], pressed: null,
  begin() { this.items.length = 0; },
  block(x, y, w, h) { this.items.push({ x, y, w, h, id: null }); },
  button(id, x, y, w, h, onTap) { this.items.push({ x, y, w, h, id, onTap }); return this.pressed === id; },
  hit(px, py) {
    for (let i = this.items.length - 1; i >= 0; i--) {
      const it = this.items[i];
      if (px >= it.x && px <= it.x + it.w && py >= it.y && py <= it.y + it.h) return it;
    }
    return null;
  },
};

function panel(ctx, x, y, w, h, k) {
  rr(ctx, x, y, w, h, 10 * k); ctx.fillStyle = 'rgba(30,22,14,0.86)'; ctx.fill();
  ctx.lineWidth = 2 * k; ctx.strokeStyle = '#b8914a'; ctx.stroke();
  rr(ctx, x + 3 * k, y + 3 * k, w - 6 * k, h - 6 * k, 8 * k); ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,230,170,0.12)'; ctx.stroke();
}
function drawButton(ctx, x, y, w, h, pressed, k, label, o = {}) {
  const off = pressed ? 3 * k : 0, rad = (o.radius || 12) * k;
  rr(ctx, x, y + 4 * k, w, h, rad); ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fill();
  rr(ctx, x, y + off, w, h, rad);
  const g = ctx.createLinearGradient(0, y + off, 0, y + off + h);
  g.addColorStop(0, o.c1 || '#d99a3a'); g.addColorStop(1, o.c2 || '#9a6020');
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 2.5 * k; ctx.strokeStyle = o.border || '#ffe2a6'; ctx.stroke();
  if (pressed) { ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fill(); }
  if (label) txt(ctx, label, x + w / 2, y + h / 2 + off + 1, o.size || 26 * k, '#fff8e6', 'center', { stroke: 'rgba(60,30,5,0.85)', weight: 800 });
  return off;
}

// 상단 HUD 전체 폭(가상 px, 배율 전): 여백 + 성문 290 + 골드 128 + 기지 236 + 시간 104 + 버튼 58×2
const TOP_HUD_W = 10 + 290 + 10 + 128 + 10 + 316 + 10 + 104 + 10 + 58 + 10 + 58 + 10;   // 기지 칸은 최대 4곳 기준
function drawHUD(ctx) {
  const k = UI.kt, VW = CONFIG.view.width;     // kt: 상단 줄이 화면 폭을 넘지 않도록 줄인 배율
  const pad = 10 * k, top = 10 * k, ph = 58 * k;
  const g = G.gate;

  // --- 성문 에너지 (누르면 성문 업그레이드 메뉴) ---
  let x = pad, w = 290 * k;
  UI.block(x, top, w, ph);
  panel(ctx, x, top, w, ph, k);
  Icon.castle(ctx, x + 27 * k, top + ph / 2 + 2 * k, 30 * k);
  txt(ctx, '성문', x + 52 * k, top + 17 * k, 15 * k, '#f3e3bf');
  const sx = x + w - 12 * k, sy = top + 17 * k;
  if (g.destroyed) txt(ctx, '붕괴', sx, sy, 14 * k, '#ff6a55', 'right');
  else if (g.underAttack) {
    ctx.globalAlpha = 0.6 + Math.sin(realTime * 10) * 0.4;
    Icon.warn(ctx, sx - 88 * k, sy, 16 * k); txt(ctx, '공격받는 중', sx, sy, 14 * k, '#ff8a75', 'right');
    ctx.globalAlpha = 1;
  } else if (g.repairing) { Icon.hammer(ctx, sx - 62 * k, sy, 16 * k); txt(ctx, '수리 중', sx, sy, 14 * k, '#8dff7a', 'right'); }
  const ratio = g.hp / g.maxHp, bx = x + 52 * k, by = top + 30 * k, bw = w - 64 * k, bh = 19 * k;
  bar(ctx, bx, by, bw, bh, ratio, hpColor(ratio));
  txt(ctx, `${Math.ceil(g.hp)} / ${g.maxHp}`, bx + bw / 2, by + bh / 2 + 1, 13 * k, '#fff', 'center', { stroke: 'rgba(0,0,0,0.75)' });

  // --- 골드 ---
  x += w + pad; w = 128 * k;
  panel(ctx, x, top, w, ph, k); UI.block(x, top, w, ph);
  Icon.coin(ctx, x + 26 * k, top + ph / 2, 28 * k);
  const flash = realTime < G.goldFlashUntil && Math.sin(realTime * 30) > 0;
  txt(ctx, Math.floor(G.gold) + '', x + 48 * k, top + ph / 2 + 1 * k, 25 * k, flash ? '#ff6a55' : '#ffe08a', 'left', { weight: 900, stroke: 'rgba(0,0,0,0.5)' });

  // --- 적 기지 요약 ---
  x += w + pad; w = Math.max(236, 20 + G.bases.length * 74) * k;
  panel(ctx, x, top, w, ph, k); UI.block(x, top, w, ph);
  const active = G.bases.filter(b => b.enabled), alive = active.filter(b => b.alive).length;
  txt(ctx, `적 기지  ${alive} / ${active.length}`, x + 12 * k, top + 17 * k, 15 * k, '#f3e3bf');
  let ix = x + 12 * k;
  for (const b of active) {
    Icon.base(ctx, b.key, ix + 9 * k, top + 40 * k, 18 * k, b.alive);
    if (b.alive) bar(ctx, ix + 21 * k, top + 35 * k, 46 * k, 11 * k, b.hp / b.maxHp, '#d9443a');
    else txt(ctx, '파괴', ix + 44 * k, top + 41 * k, 13 * k, '#9a9a9a', 'center');
    ix += 74 * k;
  }

  // --- 오른쪽: 일시정지 / 배속 / 시간 ---
  const bs = ph;
  let rx = VW - pad - bs;
  let pr = UI.button('pause', rx, top, bs, bs, togglePause);
  let off = drawButton(ctx, rx, top, bs, bs, pr, k, '', { radius: 10 });
  if (G.paused) Icon.play(ctx, rx + bs / 2, top + bs / 2 + off, 26 * k); else Icon.pause(ctx, rx + bs / 2, top + bs / 2 + off, 26 * k);

  rx -= pad + bs;
  const sp = CONFIG.speeds[G.speedIdx];
  pr = UI.button('speed', rx, top, bs, bs, toggleSpeed);
  off = drawButton(ctx, rx, top, bs, bs, pr, k, '', sp > 1 ? { radius: 10, c1: '#e0663a', c2: '#a33a1a' } : { radius: 10 });
  const cx = rx + bs / 2, cy = top + bs / 2 + off - 6 * k;
  ctx.fillStyle = '#fff8e6';
  for (let i = 0; i < sp; i++) {
    const ox = sp === 1 ? 0 : (i === 0 ? -6 * k : 6 * k);
    ctx.beginPath(); ctx.moveTo(cx + ox - 6 * k, cy - 8 * k); ctx.lineTo(cx + ox + 6 * k, cy); ctx.lineTo(cx + ox - 6 * k, cy + 8 * k); ctx.closePath(); ctx.fill();
  }
  txt(ctx, `${sp}배속`, cx, top + bs - 12 * k + off, 12 * k, '#fff8e6', 'center', { stroke: 'rgba(60,30,5,0.8)' });

  rx -= pad + 104 * k;
  panel(ctx, rx, top, 104 * k, ph, k); UI.block(rx, top, 104 * k, ph);
  Icon.clock(ctx, rx + 20 * k, top + 20 * k, 20 * k);
  txt(ctx, fmtTime(G.time), rx + 34 * k, top + 20 * k, 18 * k, '#f3e3bf');
  txt(ctx, `위협 Lv.${G.threat}`, rx + 52 * k, top + 42 * k, 13 * k, G.threat >= 5 ? '#ff7a5a' : '#ffb35a', 'center');

  drawBottomHUD(ctx);
}

// ---------- 하단: 영웅 정보 + 스킬 버튼 ----------
const BOTTOM_HUD_H = 100;    // 하단 패널 높이(가상 px, UI.k 배율 전)
function drawBottomHUD(ctx) {
  const h = G.hero; if (!h) return;
  const k = UI.k, VW = CONFIG.view.width, VH = CONFIG.view.height, pad = 10 * k;

  // --- 영웅 패널 (왼쪽 아래) — 누르면 영웅에게 화면 이동 ---
  const pw = 380 * k, ph = BOTTOM_HUD_H * k, px = pad, py = VH - pad - ph;
  UI.button('heroPanel', px, py, pw, ph, focusHero);
  panel(ctx, px, py, pw, ph, k);
  const cx = px + 52 * k, cy = py + ph / 2, R = 38 * k;
  const g = ctx.createRadialGradient(cx, cy - R * 0.3, R * 0.2, cx, cy, R);
  g.addColorStop(0, '#3f5f9e'); g.addColorStop(1, '#1b2747');
  circle(ctx, cx, cy, R); ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 3 * k; ctx.strokeStyle = '#e8c35a'; ctx.stroke();
  Icon.heroHead(ctx, h.type, cx, cy + 3 * k, 46 * k);
  if (h.dead) {
    circle(ctx, cx, cy, R); ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fill();
    txt(ctx, Math.ceil(h.respawnTimer) + '', cx, cy + 2 * k, 34 * k, '#ffd36b', 'center', { stroke: 'rgba(0,0,0,0.8)', weight: 900 });
  }
  const lx = cx + R * 0.74, ly = cy + R * 0.7;
  circle(ctx, lx, ly, 14 * k); ctx.fillStyle = '#2a1d10'; ctx.fill(); ctx.strokeStyle = '#e8c35a'; ctx.lineWidth = 2 * k; ctx.stroke();
  txt(ctx, h.level + '', lx, ly + 1 * k, 15 * k, '#ffe7a8', 'center', { weight: 900 });

  const tx = px + 104 * k, bw = pw - 118 * k;
  txt(ctx, `${h.cfg.name}  Lv.${h.level}`, tx, py + 19 * k, 17 * k, '#f3e3bf');
  if (h.dead) txt(ctx, '쓰러짐', tx + bw, py + 19 * k, 14 * k, '#ff8a75', 'right');
  else if (h.buffs.warcry > 0) txt(ctx, '피해 50% 감소', tx + bw, py + 19 * k, 13 * k, '#ffae7a', 'right');
  else if (G.time - h.lastHit >= h.cfg.regenDelay && h.hp < h.maxHp) txt(ctx, '회복 중', tx + bw, py + 19 * k, 13 * k, '#8dff7a', 'right');
  const mp = h.maxMana > 0;                                     // 마법사: 체력 · 마나 · 경험치 3줄
  const hpY = py + (mp ? 30 : 33) * k, hpH = (mp ? 18 : 22) * k;
  bar(ctx, tx, hpY, bw, hpH, h.hp / h.maxHp, h.dead ? '#555' : '#4fc43c');
  txt(ctx, h.dead ? `부활까지 ${Math.ceil(h.respawnTimer)}초` : `${Math.ceil(h.hp)} / ${h.maxHp}`, tx + bw / 2, hpY + hpH / 2 + 1, (mp ? 13 : 14) * k, '#fff', 'center', { stroke: 'rgba(0,0,0,0.75)' });
  if (mp) {
    bar(ctx, tx, py + 51 * k, bw, 14 * k, h.mana / h.maxMana, '#4a8cff');
    txt(ctx, `MP ${Math.floor(h.mana)} / ${h.maxMana}`, tx + bw / 2, py + 58 * k + 1, 11.5 * k, '#fff', 'center', { stroke: 'rgba(0,0,0,0.75)' });
  }
  const maxed = h.level >= CONFIG.heroLevels.max;
  bar(ctx, tx, py + (mp ? 69 : 63) * k, bw, (mp ? 8 : 11) * k, maxed ? 1 : h.xp / h.xpToNext, '#8f7bff');
  txt(ctx, maxed ? 'EXP  최대 레벨' : `EXP  ${Math.floor(h.xp)} / ${h.xpToNext}`, tx, py + 86 * k, 12 * k, '#c9c0ff', 'left', { weight: 600 });
  const cap = armyCap(), pop = armyPop();
  txt(ctx, `인구 ${pop} / ${cap}`, tx + bw, py + 86 * k, 12 * k, G.army.full ? '#ff9a7a' : '#9fd8ff', 'right', { weight: 700 });

  // --- 스킬 버튼 (오른쪽 아래) ---
  const n = h.cfg.skills.length, bs = (n > 3 ? 82 : 92) * k, gap = (n > 3 ? 10 : 14) * k, by = VH - pad - bs;
  const left = VW - pad - bs * n - gap * (n - 1);
  for (let i = 0; i < n; i++) drawSkillButton(ctx, i, left + i * (bs + gap), by, bs, k);

  // --- 영웅에게 화면 이동 (지도를 움직일 수 있는 화면에서만) ---
  let mxR = left - gap;
  if (Camera.canPan()) {
    const fs = 66 * k, fx = left - gap - fs, fy = VH - pad - fs;
    const off = drawButton(ctx, fx, fy, fs, fs, UI.button('focus', fx, fy, fs, fs, focusHero), k, '', { radius: 33, c1: '#4a6aa8', c2: '#2a3f6e', border: '#c9d8ff' });
    Icon.focus(ctx, fx + fs / 2, fy + fs / 2 + off, 34 * k);
    mxR = fx - gap;
  }
  const ms = 54 * k, mx = mxR - ms, my = VH - pad - ms;            // 음소거 버튼
  const muteShown = mx > px + pw + gap;
  drawArmyBar(ctx, px + pw + gap, (muteShown ? mx : mxR) - gap, py);
  if (muteShown) {

// ---------- 아래 병력 칸: 성문에서 나올 병사 고르기 / 훈련 시설 건설·강화 ----------
// 칸 누르기: 다른 병사 → 생산 병사로 선택 / 이미 선택된 병사·미건설 → 시설 메뉴 열기
function armyCardTap(kind) {
  if (!kind || G.state !== 'playing') return;
  const A = G.army;
  if (!A.lv[kind] || A.sel === kind) { G.aim = null; G.sel = G.sel && G.sel.kind === 'facility' && G.sel.ref === kind ? null : { kind: 'facility', ref: kind }; return; }
  selectUnit(kind);

}
function drawArmyBar(ctx, L, R, heroTop) {
  const k = UI.k, VH = CONFIG.view.height, A = G.army, order = CONFIG.army.order, n = order.length;
  let cw = 84 * k, ch = 84 * k, gap = 8 * k, pad = 8 * k;

  if (R - L >= w) { x = L + (R - L - w) / 2; y = VH - 10 * k - h; }          // 넓은 화면: 영웅 패널과 스킬 버튼 사이
  else {                                                                     // 좁은 화면: 영웅 패널 위
    cw = ch = 72 * k; gap = 7 * k; pad = 7 * k;
    w = n * cw + (n - 1) * gap + pad * 2; h = ch + pad * 2; x = 10 * k; y = heroTop - 8 * k - h;
  }
  G.armyBarRect = { x, y, w, h }; G.armyRects = {};
  panel(ctx, x, y, w, h, k); UI.block(x, y, w, h);
  const cap = armyCap(), counts = {};
  for (const u of G.soldiers) counts[u.kind] = (counts[u.kind] || 0) + 1;
  order.forEach((kind, i) => {
    const cx = x + pad + i * (cw + gap), cy = y + pad, c = CONFIG.army[kind], lv = A.lv[kind], sel = A.sel === kind && lv > 0;
    G.armyRects[kind] = { x: cx, y: cy, w: cw, h: ch };
    const pr = UI.button('army_' + kind, cx, cy, cw, ch, () => armyCardTap(kind)), off = pr ? 2 * k : 0, u = cw / (84 * k);
    const next = lv < c.levels.length ? c.levels[lv].cost : null, canUp = next != null && G.gold >= next;
    rr(ctx, cx, cy + off, cw, ch, 10 * k);
    const g = ctx.createLinearGradient(0, cy, 0, cy + ch);
    if (sel) { g.addColorStop(0, '#8a6428'); g.addColorStop(1, '#5a3c14'); }
    else if (lv) { g.addColorStop(0, '#5a4630'); g.addColorStop(1, '#3a2c1c'); }
    else { g.addColorStop(0, '#3e3830'); g.addColorStop(1, '#2a2620'); }
    ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = (sel ? 3 : 2) * k; ctx.strokeStyle = sel ? '#ffe08a' : lv ? '#a8874e' : '#6a5e4a'; ctx.stroke();
    if (canUp) { ctx.globalAlpha = 0.45 + Math.sin(realTime * 5) * 0.35; rr(ctx, cx - 2 * k, cy - 2 * k + off, cw + 4 * k, ch + 4 * k, 12 * k); ctx.strokeStyle = '#8dff7a'; ctx.lineWidth = 2 * k; ctx.stroke(); ctx.globalAlpha = 1; }
    ctx.globalAlpha = lv ? 1 : 0.4;
    Icon.unit(ctx, kind, Math.max(1, lv), cx + cw / 2, cy + 34 * u * k + off, 46 * u * k);
    ctx.globalAlpha = 1;
    rr(ctx, cx + 4 * k, cy + 4 * k + off, 17 * k, 17 * k, 4 * k); ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fill();   // 단축키
    txt(ctx, String(i + 1), cx + 12.5 * k, cy + 13 * k + off, 12 * k, '#ffe7a8', 'center', { weight: 900 });
    if (counts[kind]) {                                                      // 살아 있는 수

    }
    const ly = cy + ch - 15 * u * k + off;

    } else {

// 훈련 시설 메뉴: 병사 능력치 (현재 → 다음 레벨) + 건설/강화 + 생산 선택 + 최고 레벨 자동 스킬
function drawFacilityMenu(ctx, kind, px, py, w, h, k) {
  const A = G.army, c = CONFIG.army[kind], sc = CONFIG.soldiers[kind], lv = A.lv[kind], maxL = c.levels.length;
  const cur = lv ? c.levels[lv - 1] : null, nx = lv < maxL ? c.levels[lv] : null;

  txt(ctx, lv ? `${c.facility}  Lv.${lv}${lv >= maxL ? ' (최고)' : ''}` : `${c.facility}  (미건설)`, px + 64 * k, py + 25 * k, 19 * k, '#ffe7b8');
  txt(ctx, `${sc.name} 생산 · 인구 ${popOf(kind)}`, px + 64 * k, py + 49 * k, 13 * k, '#cdbb98', 'left', { weight: 600 });

    ? [['체력', cv(L => L.hp), v(L => L.hp)], ['강화 효과', cv(L => '+' + pct(L.power)), v(L => '+' + pct(L.power))], ['시전 간격', cv(L => sec(L.interval)), v(L => sec(L.interval))],

    : [['체력', cv(L => L.hp), v(L => L.hp)], ['공격력', cv(L => L.damage), v(L => L.damage)],
       ['방어력', cv(L => pct(L.armor)), v(L => pct(L.armor))], ['생산 시간', cv(L => sec(L.spawnTime)), v(L => sec(L.spawnTime))]];
  if (sc.ranged) rows.push(['사거리', cv(L => L.range), v(L => L.range)]);
  drawStatRows(ctx, rows, px, py + 84 * k, w, k, 0.42, 0.72);
  let ty = py + 84 * k + rows.length * 28 * k;
  const slowNext = nx && nx.slow && !(cur && cur.slow);
  fitTxt(ctx, (slowNext ? '다음 레벨: 맞은 적 둔화 · ' : '') + c.desc, px + 18 * k, ty, 12.5 * k, w - 36 * k, slowNext ? '#b8ff9a' : '#cdbb98', 'left', { weight: 500 });

  }

// 9. 게임 상태 / 루프
// ==========================================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let G = null;
let MAPDATA = null;
let realTime = 0, viewScale = 1, pixelRatio = 1, bgCanvas = null, bgRes = 0, miniCanvas = null, bgLow = null;
const BG_LOW_RES = 0.75;    // 축소 화면용 저해상도 배경 배율

function buildMapData(baseKeys) {
  const W = CONFIG.world.width, H = CONFIG.world.height, rng = mulberry32(MAP.seed + 99);
  const keys = baseKeys || Object.keys(MAP.bases), used = new Set(['main']);
  for (const k of keys) for (const n of MAP.bases[k].path) used.add(n);
  const seg = {};
  for (const k in MAP.segments) if (used.has(k)) seg[k] = catmullRom(MAP.segments[k], 5);   // 이 스테이지 기지의 길만
  const routes = {};
  for (const k of keys) {
    const pts = [];
    for (const name of MAP.bases[k].path) { const sp = seg[name]; for (let i = pts.length ? 1 : 0; i < sp.length; i++) pts.push(sp[i]); }
    routes[k] = new Route(pts);
  }
  const river = catmullRom(MAP.river, 8);

  // 다리: 본길과 강이 만나는 곳
  let best = Infinity, bi = 0, bj = 0;
  for (let i = 0; i < seg.main.length; i++) for (let j = 0; j < river.length; j++) {
    const d = (seg.main[i].x - river[j].x) ** 2 + (seg.main[i].y - river[j].y) ** 2;
    if (d < best) { best = d; bi = i; bj = j; }
  }
  const tan = (P, i) => { const a = P[Math.max(0, i - 1)], b = P[Math.min(P.length - 1, i + 1)]; return Math.atan2(b.y - a.y, b.x - a.x); };
  let bridge = null;
  if (best < 30 * 30) {
    const pa = tan(seg.main, bi), ra = tan(river, bj), s = Math.max(0.45, Math.abs(Math.sin(pa - ra)));
    bridge = { x: seg.main[bi].x, y: seg.main[bi].y, angle: pa, len: (MAP.riverWidth + 22) / s + 18, wid: MAP.pathWidth + 12 };
  }

  // 나무/장식 배치 (길·강·성·기지·건설 자리를 피해서)
  const pathPts = [];
  for (const k in seg) for (let i = 0; i < seg[k].length; i += 2) pathPts.push(seg[k][i]);
  const blocked = (x, y, r, pathGap = 8) => {
    if (x < 215 || y < -20 || y > H + 20 || x > W + 20) return true;
    const pr = MAP.pathWidth / 2 + r + pathGap;
    for (const p of pathPts) if ((p.x - x) ** 2 + (p.y - y) ** 2 < pr * pr) return true;
    const rv = MAP.riverWidth / 2 + r + 8;
    for (const p of river) if ((p.x - x) ** 2 + (p.y - y) ** 2 < rv * rv) return true;
    for (const k of keys) { const b = MAP.bases[k], br = b.hitRadius + 30 + r; if ((b.x - x) ** 2 + (b.y - y) ** 2 < br * br) return true; }
    if (x < 330 && Math.abs(y - MAP.gate.y) < 120) return true;     // 성문 앞 광장 (병사가 모이는 곳)
    return false;
  };
  const trees = [];
  const crowded = (x, y, r) => trees.some(t => (t.x - x) ** 2 + (t.y - y) ** 2 < (Math.max(t.r, r) * 0.95) ** 2);
  const addTree = (x, y, r) => trees.push({ x, y, r, pine: rng() < 0.3, hue: rng(), rot: rng() * TAU });
  for (const f of MAP.forests) {
    let placed = 0;
    for (let tries = 0; tries < f.n * 4 && placed < f.n; tries++) {
      const a = rng() * TAU, d = Math.sqrt(rng()) * f.r;
      const x = f.x + Math.cos(a) * d, y = f.y + Math.sin(a) * d * 0.85, r = 14 + rng() * 12;
      if (blocked(x, y, r) || crowded(x, y, r)) continue;
      addTree(x, y, r); placed++;
    }
  }
  for (let i = 0, tries = 0; i < MAP.scatterTrees && tries < 800; tries++) {
    const x = rng() * W, y = rng() * H, r = 13 + rng() * 9;
    if (blocked(x, y, r, 14) || crowded(x, y, r * 2.5)) continue;
    addTree(x, y, r); i++;
  }
  trees.sort((a, b) => a.y - b.y);
  const decor = [];
  for (let i = 0, tries = 0; i < 70 && tries < 900; tries++) {
    const x = rng() * W, y = rng() * H, r = 4 + rng() * 6;
    if (blocked(x, y, r, 2) || crowded(x, y, r + 10)) continue;
    decor.push({ k: rng() < 0.45 ? 'rock' : 'bush', x, y, r }); i++;
  }
  return { seg, routes, river, riverOff: [offsetPoly(river, -13), offsetPoly(river, 12)], bridge, trees, decor };
}

function createState() {
  return {
    state: 'title', paused: false, speedIdx: 0, time: 0, threat: 1, threatTime: 1, nextId: 1,
    gate: null, hero: null, aim: null, bases: [], enemies: [], projectiles: [], fx: [],
    gold: 0, goldFlashUntil: 0,     // 시작 골드는 newGame에서 난이도에 따라
    soldiers: [],       // 아군 병사 (최대 병력은 성문 레벨에 따라)
    army: { sel: 'footman', timer: 2, full: false, lv: Object.fromEntries(CONFIG.army.order.map(k => [k, CONFIG.army[k].levels[0].cost ? 0 : 1])) },   // 생산할 병사 / 시설 레벨 (0 = 없음)
    front: 0, fCount: 0, bCount: 0, fCenter: null,   // 대형 앞쪽 방향 (0 = 동쪽)
    toast: null,
    zones: [], traps: [],   // 영웅 스킬 효과 (화살비·얼음 폭풍 / 덫)
    telegraphs: [], hazards: [],   // 보스 스킬 예고 표시 / 독 웅덩이
    pending: [],                   // 잠시 뒤 나타날 적 (다시 일어나는 해골)
    drops: [], itemPrompt: null, itemInfo: null,   // 바닥 아이템 / 교체 선택 창 / 아이템 정보 창
    midTimer: 0, finalSpawned: false, finalBoss: null, redFlash: 0,
    sel: null,          // 선택된 메뉴: { kind: 'gate' | 'facility', ref }
    pendingResult: null, endTimer: 0, banner: null,
    stats: { kills: 0, bossKills: 0, goldEarned: 0, itemsFound: 0, heroDeaths: 0, built: 0, trained: 0 },
    shakeT: 0, shakeDur: 1, shakeMag: 0,
  };
}
function newGame(state, heroType = 'knight', diffKey = 'normal', stageIdx = selectedStage) {
  loadStage(stageIdx);
  G = createState();
  G.stageIdx = stageIdx; G.stage = CONFIG.stages[stageIdx];
  G.heroType = heroType; G.diffKey = diffKey; G.diff = CONFIG.difficulty[diffKey] || CONFIG.difficulty.normal;
  G.gold = G.diff.startGold + (G.stage.startGold || 0);
  G.midTimer = G.stage.mid.first;
  G.gate = new Gate();
  G.hero = new Hero(heroType);
  G.bases = G.stage.bases.map(k => new EnemyBase(k));
  G.state = state;
}
function startGame(heroType, stageIdx = selectedStage) {
  selectedStage = stageIdx; try { localStorage.setItem('kg.stage', stageIdx); } catch (_) {}
  newGame('playing', CONFIG.heroes[heroType] ? heroType : selectedHero, selectedDiff, stageIdx);
  Camera.centerOn(MAP.startView.x, MAP.startView.y);
  showBanner(`${stageIdx + 1}스테이지 ${G.stage.name} — 적 기지 ${G.bases.length}곳을 모두 파괴하세요!`, '#ffe08a', 3.4);
}
function nextStage() {
  const n = G.stageIdx + 1; if (n >= CONFIG.stages.length) return;
  selectedDiff = G.diffKey; startGame(G.heroType, n);
}
// 지도 바꾸기 (스테이지마다 다른 지도): 배경·미니맵을 다시 그림
let loadedMap = null;
function loadStage(i) {
  const st = CONFIG.stages[i], key = st.map + ':' + st.bases.join(','); if (loadedMap === key) return;
  loadedMap = key; MAP = MAPS[st.map]; MAPDATA = buildMapData(st.bases); bgCanvas = null;
  if (Camera.inited) { resize(); Camera.centerOn(MAP.startView.x, MAP.startView.y); }
}
function togglePause() { if (G.state === 'playing') G.paused = !G.paused; }
function toggleSpeed() { if (G.state === 'playing') G.speedIdx = (G.speedIdx + 1) % CONFIG.speeds.length; }

function update(dt) {
  G.time += dt;
  const esc = CONFIG.escalation, lost = G.bases.filter(b => b.enabled && !b.alive).length;
  const timeTh = 1 + Math.floor(G.time / esc.interval), th = timeTh + lost * (esc.baseLostBonus || 0);
  if (th !== G.threat) {
    if (timeTh !== G.threatTime) { showBanner(`적이 강해집니다!  위협 Lv.${th}`, '#ff9a4a', 2.4); Sound.play('threat'); }
    G.threat = th; G.threatTime = timeTh;
  }
  G.gate.update(dt);
  G.hero.update(dt);
  updateArmy(dt);
  updateFormation(dt);
  for (let i = 0; i < G.soldiers.length; i++) if (!G.soldiers[i].dead) G.soldiers[i].update(dt, i);
  compact(G.soldiers, u => !u.dead);
  for (const b of G.bases) b.update(dt);
  for (const e of G.enemies) if (e.alive) e.update(dt);
  for (const p of G.projectiles) p.update(dt);
  for (const z of G.zones) z.update(dt);
  for (const t of G.traps) t.update(dt);
  for (const t of G.telegraphs) t.update(dt);
  for (const q of G.pending) {                                    // 해골 부활
    q.t -= dt; if (q.t > 0) continue;
    const e = new Enemy(q.type, q.base, rand(-8, 8), G.threat); e.revived = true;
    e.maxHp = Math.round(e.maxHp); e.hp = Math.round(e.maxHp * q.hpRatio); e.x = q.x; e.y = q.y;
    if (q.post && q.base.alive) { e.post = q.post; e.guardCfg = q.guardCfg; e.state = 'guard'; }
    else if (q.reachedEnd) { e.dist = e.route.length; e.slot = G.gate.claimSlot(e); if (!e.slot) e.fallback = { x: e.x, y: e.y }; e.state = 'toGate'; }
    else { e.dist = e.route.nearestDist(e.x, e.y, q.dist); e.state = 'rejoin'; }
    G.enemies.push(e); FX.dust(e.x, e.y); FX.ring(e.x, e.y, 16, '190,140,255', 0.4);
  }
  compact(G.pending, q => q.t > 0);
  for (const z of G.hazards) z.update(dt);
  compact(G.zones, z => !z.done); compact(G.traps, t => !t.done); compact(G.telegraphs, t => !t.done); compact(G.hazards, z => !z.done);
  for (const d of G.drops) d.update(dt);
  compact(G.drops, d => !d.done);
  if (G.redFlash > 0) G.redFlash -= dt;
  G.midTimer -= dt;                                       // 중간보스
  if (G.midTimer <= 0) {
    const M = G.stage.mid; G.midTimer = M.interval;
    const cands = G.bases.filter(b => b.enabled && b.alive && M.byBase[b.key]);
    if (cands.length) { const b = cands[Math.floor(Math.random() * cands.length)]; spawnBoss(M.byBase[b.key], b); }
  }
  FX.update(dt);
  compact(G.enemies, e => e.alive);
  compact(G.projectiles, p => !p.done);
  if (G.banner && G.banner.t > 0) G.banner.t -= dt;
  if (G.pendingResult) {
    G.endTimer -= dt;
    if (G.endTimer <= 0) { G.state = G.pendingResult; G.paused = false; G.sel = null; G.aim = null; Sound.play(G.state === 'won' ? 'victory' : 'defeat'); if (G.state === 'won') markCleared(G.stageIdx); }
  }
}

function renderWorld(ctx) {
  const W = CONFIG.world.width, H = CONFIG.world.height;
  const vx = clamp(Camera.x, 0, W), vy = clamp(Camera.y, 0, H);                       // 화면에 보이는 부분만 그림
  const vw = Math.min(W, Camera.x + Camera.viewW()) - vx, vh = Math.min(H, Camera.y + Camera.viewH()) - vy;
  const low = bgLow && pixelRatio * Camera.zoom <= BG_LOW_RES * 1.1;                   // 많이 축소했을 때는 저해상도 배경 (성능)
  const src = low ? bgLow : bgCanvas, sr = low ? BG_LOW_RES : bgRes;
  ctx.imageSmoothingQuality = low ? 'medium' : 'high';
  if (vw > 0 && vh > 0) ctx.drawImage(src, vx * sr, vy * sr, vw * sr, vh * sr, vx, vy, vw, vh);
  const cx0 = Camera.x - 80, cy0 = Camera.y - 120, cx1 = Camera.x + Camera.viewW() + 80, cy1 = Camera.y + Camera.viewH() + 80;
  const vis = o => o.x > cx0 && o.x < cx1 && o.y > cy0 && o.y < cy1;               // 화면 안에 있는지 (밖은 그리지 않음)
  Art.riverShimmer(ctx, realTime);
  Art.castleDynamic(ctx, G.gate, realTime);
  for (const b of G.bases) Art.base(ctx, b, G.time, realTime);
  for (const tr of G.traps) Art.trap(ctx, tr);
  for (const d of G.drops) Art.drop(ctx, d, realTime);
  for (const z of G.zones) Art.zoneGround(ctx, z);
  for (const z of G.hazards) Art.hazard(ctx, z, realTime);
  for (const t of G.telegraphs) Art.telegraph(ctx, t, realTime);

  const h = G.hero, sel = G.sel;
  if (h && !h.dead && h.mode === 'move') Art.rallyFlag(ctx, h.guard, realTime);
  if (h && G.aim && !h.dead) Art.aimPreview(ctx, h, G.aim, Input.hover, realTime);

  for (const e of G.enemies) if (e.air && vis(e)) Art.airShadow(ctx, e);
  const ground = [];
  for (const e of G.enemies) if (!e.air && vis(e)) ground.push(e);
  for (const c of G.gate.carpenters) ground.push(c);
  for (const u of G.soldiers) if (vis(u)) ground.push(u);
  if (h) ground.push(h);
  ground.sort((a, b) => (a.dead ? a.deathY : a.y) - (b.dead ? b.deathY : b.y));
  for (const o of ground) {
    if (o instanceof Enemy) Art.enemy(ctx, o);
    else if (o instanceof Hero) Art.hero(ctx, o, realTime);
    else if (o instanceof Soldier) Art.soldier(ctx, o, realTime);
    else Art.carpenter(ctx, o);
  }
  for (const a of G.gate.archers) Art.wallArcher(ctx, a);
  for (const p of G.projectiles) if (vis(p)) Art.projectile(ctx, p);
  for (const e of G.enemies) if (e.air && (vis(e) || e.boss)) Art.enemy(ctx, e);
  for (const z of G.zones) Art.zoneTop(ctx, z);
  for (const t of G.telegraphs) Art.telegraphTop(ctx, t, realTime);
  FX.draw(ctx);
  for (const b of G.bases) Art.baseBar(ctx, b);
  for (const e of G.enemies) if (vis(e)) Art.enemyBar(ctx, e);
  for (const u of G.soldiers) if (vis(u)) Art.soldierBar(ctx, u);
  if (h) Art.heroBar(ctx, h);
  if (h && !h.dead) Art.status(ctx, h, realTime);
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#1d2914'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
  ctx.save();
  if (SETTINGS.screenShake && G.shakeT > 0) {                     // 화면 흔들림
    const m = G.shakeMag * (G.shakeT / G.shakeDur);
    ctx.translate(rand(-m, m), rand(-m, m));
  }
  ctx.scale(Camera.zoom, Camera.zoom); ctx.translate(-Camera.x, -Camera.y);
  renderWorld(ctx);
  ctx.restore();
  if (G.redFlash > 0) { ctx.fillStyle = `rgba(200,20,10,${G.redFlash * 0.4})`; ctx.fillRect(0, 0, CONFIG.view.width, CONFIG.view.height); }   // 최종보스 등장 경고
  UI.begin();
  drawHUD(ctx);
  drawMinimap(ctx);
  drawItemSlots(ctx);
  G.bossBarH = drawBossBars(ctx);
  drawBanner(ctx);
  drawSelectionPanel(ctx);   // 메뉴는 안내 띠보다 위에
  drawAimHint(ctx);
  drawItemPrompt(ctx);
  drawOverlay(ctx);
}

function resize() {
  const VW = CONFIG.view.width, VH = CONFIG.view.height;
  const vw = window.innerWidth, vh = window.innerHeight;
  viewScale = Math.min(vw / VW, vh / VH);
  const cssW = Math.max(1, Math.floor(VW * viewScale)), cssH = Math.max(1, Math.floor(VH * viewScale));
  canvas.style.width = cssW + 'px'; canvas.style.height = cssH + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
  pixelRatio = canvas.width / VW;
  UI.k = clamp(0.78 / viewScale, 1, 1.8);           // 버튼이 최소 약 45 CSS px 이 되도록
  UI.kt = Math.min(UI.k, (VW - 4) / TOP_HUD_W);
  Camera.topPad = (10 + 58 + 6) * UI.kt;
  Camera.botPad = (BOTTOM_HUD_H + 20) * UI.k;
  if (!Camera.inited) {                                   // 처음 한 번: 화면 크기에 맞는 기본 배율
    Camera.inited = true;
    Camera.zoom = viewScale < CONFIG.view.smallScreenScale ? CONFIG.view.smallScreenZoom : 1;
    Camera.centerOn(MAP.startView.x, MAP.startView.y);
  } else Camera.setZoom(Camera.zoom);
  // 배경 해상도: 최대 확대에서도 선명하게, 단 큰 지도에서 메모리를 너무 쓰지 않도록 상한 (약 800만 픽셀)
  const W = CONFIG.world.width, H = CONFIG.world.height, maxRes = Math.floor(Math.sqrt(8e6 / (W * H)) * 4) / 4;
  const res = clamp(Math.round(pixelRatio * CONFIG.view.maxZoom * 4) / 4, 1, Math.min(2, maxRes));
  if (!bgCanvas || res !== bgRes) {
    bgRes = res; bgCanvas = Art.buildBackground(res); miniCanvas = buildMinimapCanvas();
    bgLow = document.createElement('canvas'); bgLow.width = Math.round(W * BG_LOW_RES); bgLow.height = Math.round(H * BG_LOW_RES);
    const lg = bgLow.getContext('2d'); lg.imageSmoothingQuality = 'high'; lg.drawImage(bgCanvas, 0, 0, bgLow.width, bgLow.height);
  }
}

let lastNow = performance.now(), acc = 0;
function frame(now) {
  let dt = (now - lastNow) / 1000; lastNow = now;
  dt = clamp(dt, 0, 0.25);
  realTime += dt;
  Input.panKeys(dt);
  if (G.shakeT > 0 && !G.paused && !G.itemPrompt) G.shakeT -= dt;
  Camera.glide(dt);
  Music.update();
  if (G.state === 'playing' && !G.paused && !G.itemPrompt) {
    acc += dt * CONFIG.speeds[G.speedIdx];
    let n = 0;
    while (acc >= STEP && n < 30 && G.state === 'playing') { update(STEP); acc -= STEP; n++; }
    if (n >= 30) acc = 0;
  } else acc = 0;
  render();
  requestAnimationFrame(frame);
}

// ---------- 시작 ----------
loadImages();
Sprites.load();
newGame('title');
resize();
Input.init(canvas);
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => {
  if (document.hidden && G.state === 'playing') G.paused = true;          // 앱 전환 시 자동 일시정지
  if (Sound.ctx) { if (document.hidden) Sound.ctx.suspend(); else if (Sound.unlocked) Sound.ctx.resume(); }   // 소리도 멈춤
});
for (const ev of ['touchend', 'click']) document.addEventListener(ev, () => Sound.unlock(), { passive: true });   // iOS 소리 켜기 보조
requestAnimationFrame(frame);

// 콘솔 디버그/밸런스 테스트용: GAME.simulate(60) → 60초 진행
window.GAME = {
  get G() { return G; }, get MAP() { return MAP; }, CONFIG, Camera,
  unlockAll() { for (const k in cleared) cleared[k] = CONFIG.stages.length; },
  start: startGame, useSkill, tap: (x, y) => onWorldTap({ x, y }),
  simulate(sec) { const n = Math.round(sec / STEP); for (let i = 0; i < n && G.state === 'playing'; i++) update(STEP); },
};
</script>
</body>
</html>
